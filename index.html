<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
<title>الفردوس للنقل والتوريد</title>

<!-- ===== إعدادات تطبيق الهاتف (PWA) ===== -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f766e" />
<meta name="background-color" content="#0f172a" />
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="الفردوس" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');
  :root{
    --charcoal:#0f172a; --charcoal2:#1e293b; --charcoal3:#334155;
    --stone-50:#fafaf9; --stone-100:#f5f5f4; --stone-200:#e7e5e4; --stone-300:#d6d3d1;
    --stone-400:#a8a29e; --stone-500:#78716c; --stone-600:#57534e;
    --teal-50:#f0fdfa; --teal-100:#ccfbf1; --teal-200:#99f6e4; --teal-600:#0d9488; --teal-700:#0f766e; --teal-800:#115e59;
    --amber-50:#fffbeb; --amber-100:#fef3c7; --amber-300:#fcd34d; --amber-600:#d97706; --amber-700:#b45309; --amber-800:#92400e;
    --emerald-600:#059669; --emerald-700:#047857;
    --rose-50:#fff1f2; --rose-200:#fecdd3; --rose-500:#f43f5e; --rose-600:#e11d48;
    --slate-800:#1e293b;
    --brand-navy:#102a43; --brand-orange:#f2740f; --brand-orange-dark:#c25a08; --brand-orange-light:#fde8d5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Cairo','Tahoma',sans-serif;
    background:var(--stone-100);
    color:var(--charcoal2);
    -webkit-tap-highlight-color:transparent;
  }
  #app{display:flex; min-height:100vh;}
  a{color:inherit;}

  /* ===== Sidebar (desktop) ===== */
  .sidebar{
    display:none; width:230px; flex-shrink:0; background:var(--charcoal);
    color:#e2e8f0; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .sidebar-head{padding:18px 16px; border-bottom:1px solid rgba(255,255,255,.08);}
  .sidebar-head .brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:16px; color:#fff;}
  .sidebar-head .sub{font-size:11px; color:#94a3b8; margin-top:4px; line-height:1.5;}
  .sidebar-nav{flex:1; overflow-y:auto; padding:8px 0;}
  .nav-btn{
    display:flex; align-items:center; gap:10px; width:100%; background:none; border:none;
    color:#cbd5e1; padding:9px 16px; font-size:13px; text-align:right; cursor:pointer;
    border-right:2px solid transparent; font-family:inherit;
  }
  .nav-btn:hover{background:rgba(255,255,255,.05); color:#fff;}
  .nav-btn.active{background:rgba(255,255,255,.06); color:var(--brand-orange); border-right-color:var(--brand-orange); font-weight:700;}
  .nav-icon{font-size:15px; width:18px; text-align:center;}
  .sidebar-foot{padding:12px 16px; border-top:1px solid rgba(255,255,255,.08); font-size:11px; color:#94a3b8; line-height:1.6;}
  .save-indicator{margin-top:4px; color:#5eead4; font-weight:600;}

  /* ===== Bottom nav (mobile) ===== */
  .bottom-nav{
    position:fixed; bottom:0; inset-inline:0; z-index:40; background:var(--charcoal);
    display:flex; overflow-x:auto; border-top:1px solid rgba(255,255,255,.1);
    -webkit-overflow-scrolling:touch;
  }
  .bottom-nav::-webkit-scrollbar{display:none;}
  .bn-btn{
    flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px;
    background:none; border:none; color:#94a3b8; padding:8px 12px; font-size:10px;
    font-family:inherit; white-space:nowrap;
  }
  .bn-btn.active{color:var(--brand-orange);}
  .bn-icon{font-size:16px;}

  /* ===== Mobile header ===== */
  .mobile-header{
    display:flex; position:sticky; top:0; z-index:30; background:rgba(255,255,255,.95);
    backdrop-filter:blur(6px); border-bottom:1px solid var(--stone-200); padding:12px 16px;
    font-weight:800; color:var(--charcoal2); align-items:center; justify-content:space-between;
  }
  .mobile-header .save-tag{font-size:10px; color:var(--emerald-700); font-weight:700;}

  main{flex:1; min-width:0; overflow-x:hidden; padding-bottom:70px;}
  .content-wrap{padding:16px; max-width:960px; margin:0 auto;}

  @media (min-width:860px){
    .sidebar{display:flex;}
    .bottom-nav{display:none;}
    .mobile-header{display:none;}
    main{padding-bottom:0;}
    .content-wrap{padding:28px;}
  }

  /* ===== Generic UI ===== */
  .section-head{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-start; justify-content:space-between; border-bottom:1px solid var(--stone-200); padding-bottom:14px; margin-bottom:18px;}
  .section-head .left{display:flex; gap:10px; align-items:flex-start;}
  .section-head .icon-box{background:var(--slate-800); color:#fff; border-radius:8px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
  .section-head h2{margin:0; font-size:17px; font-weight:800; color:var(--charcoal);}
  .section-head p{margin:2px 0 0; font-size:12px; color:var(--stone-500);}

  .cards-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:20px;}
  @media(min-width:640px){.cards-grid{grid-template-columns:repeat(4,1fr);}}
  .card{background:#fff; border:1px solid var(--stone-300); border-radius:10px; padding:14px; box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .card .t{font-size:11px; font-weight:600; color:var(--stone-500);}
  .card .v{font-size:22px; font-weight:800; margin-top:4px; font-variant-numeric:tabular-nums;}
  .card .s{font-size:11px; color:var(--stone-400); margin-top:4px;}
  .tone-teal{color:var(--teal-800); border-color:#99f6e4;}
  .tone-amber{color:var(--amber-800); border-color:var(--amber-300);}
  .tone-slate{color:var(--charcoal2);}
  .tone-emerald{color:var(--emerald-700); border-color:#6ee7b7;}
  .tone-rose{color:var(--rose-600); border-color:var(--rose-200);}

  .btn{display:inline-flex; align-items:center; gap:6px; border-radius:7px; font-weight:700; font-size:13px; padding:9px 14px; border:1px solid transparent; cursor:pointer; font-family:inherit;}
  .btn-primary{background:var(--brand-orange); color:#fff;}
  .btn-primary:hover{background:var(--brand-orange-dark);}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}
  .btn-ghost{background:#fff; color:var(--charcoal2); border-color:var(--stone-300);}
  .btn-ghost:hover{background:var(--stone-100);}
  .btn-danger{background:#fff; color:var(--rose-600); border-color:var(--rose-200);}
  .btn-sm{padding:5px 10px; font-size:12px;}
  .icon-btn{background:none; border:none; padding:6px; border-radius:6px; cursor:pointer; color:var(--stone-500); font-size:14px;}
  .icon-btn:hover{background:var(--stone-100); color:var(--teal-700);}
  .icon-btn.danger:hover{background:var(--rose-50); color:var(--rose-600);}

  label.f-label{font-size:11px; color:var(--stone-500); display:block; margin-bottom:3px;}
  .f-input, select.f-input, textarea.f-input{
    width:100%; border:1px solid var(--stone-300); border-radius:7px; padding:8px 10px;
    font-size:13.5px; font-family:inherit; background:#fff; color:var(--charcoal2);
  }
  .f-input:focus{outline:none; border-color:var(--teal-600); box-shadow:0 0 0 3px rgba(13,148,136,.15);}
  .form-grid{display:grid; grid-template-columns:1fr; gap:10px;}
  @media(min-width:640px){.form-grid.cols-3{grid-template-columns:repeat(3,1fr);} .form-grid.cols-4{grid-template-columns:repeat(4,1fr);}}
  .form-panel{background:var(--teal-50); border:1px solid var(--teal-200); border-radius:10px; padding:16px; margin-bottom:18px;}
  .form-panel .sub-title{font-size:12px; font-weight:800; color:var(--teal-800); margin:14px 0 8px; padding-top:10px; border-top:1px solid var(--teal-200); display:flex; align-items:center; gap:6px;}
  .form-actions{display:flex; gap:8px; margin-top:12px;}

  .table-wrap{overflow-x:auto; background:#fff; border:1px solid var(--stone-200); border-radius:10px;}
  table{width:100%; border-collapse:collapse; text-align:right;}
  th{font-size:11px; font-weight:700; color:var(--stone-500); padding:9px 10px; border-bottom:2px solid var(--stone-300); white-space:nowrap;}
  td{font-size:13px; padding:9px 10px; border-bottom:1px solid var(--stone-100); vertical-align:middle;}
  tr:hover td{background:var(--stone-50);}
  tfoot td{border-top:2px double var(--charcoal3); font-weight:800; font-size:13px;}
  .num{font-variant-numeric:tabular-nums;}
  .tleft{text-align:left;}
  .empty-row{padding:34px 10px; text-align:center; color:var(--stone-400); font-style:italic; font-size:13px;}

  .group-title{font-size:13px; font-weight:800; color:var(--charcoal2); margin:18px 0 8px; display:flex; align-items:center; gap:8px;}
  .group-title:first-child{margin-top:0;}
  .dot{width:10px; height:10px; border-radius:2px; display:inline-block;}
  .dot-teal{background:#14b8a6;} .dot-amber{background:#f59e0b;} .dot-slate{background:#334155;} .dot-emerald{background:#10b981;} .dot-rose{background:#f43f5e;}

  /* ===== قوائم منسدلة بحثية (Searchable Select) ===== */
  .ss-wrap{position:relative; display:block; width:100%;}
  select.ss-native{
    position:absolute !important; opacity:0 !important; width:1px !important; height:1px !important;
    padding:0 !important; margin:0 !important; border:0 !important; overflow:hidden !important;
    pointer-events:none !important; clip:rect(0,0,0,0) !important;
  }
  .ss-input{cursor:pointer; width:100%;}
  .ss-input.ss-open{border-color:var(--teal-600); box-shadow:0 0 0 3px rgba(13,148,136,.15);}
  .ss-wrap .ss-caret{position:absolute; top:50%; inset-inline-end:10px; transform:translateY(-50%); font-size:10px; color:var(--stone-400); pointer-events:none;}
  .ss-dropdown{
    display:none; position:absolute; z-index:500; top:calc(100% + 4px); right:0; left:0;
    background:#fff; border:1px solid var(--stone-300); border-radius:8px;
    box-shadow:0 10px 28px rgba(0,0,0,.14); max-height:230px; overflow-y:auto; padding:4px;
  }
  .ss-dropdown.ss-show{display:block;}
  .ss-option{padding:8px 10px; font-size:13px; border-radius:6px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ss-option.ss-active{background:var(--teal-50); color:var(--teal-800);}
  .ss-option.ss-disabled{color:var(--stone-400); cursor:default;}
  .ss-empty{padding:10px; font-size:12.5px; color:var(--stone-400); text-align:center; font-style:italic;}

  .entry-card{background:#fff; border:1px solid var(--stone-200); border-radius:10px; overflow:hidden; margin-bottom:12px;}
  .entry-head{display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--stone-50); padding:10px 14px; border-bottom:1px solid var(--stone-200); flex-wrap:wrap;}
  .entry-head .meta{font-size:13px;}
  .entry-head .meta .d{font-weight:800; color:var(--charcoal2);}
  .entry-head .meta .sep{color:var(--stone-400); margin:0 6px;}
  .entry-head .meta .desc{color:var(--stone-600);}
  .badge{display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:800; border-radius:5px; padding:2px 7px; margin-right:6px;}
  .badge-auto{color:var(--teal-700); background:var(--teal-50); border:1px solid var(--teal-200);}
  .badge-lock{font-size:11px; color:var(--stone-400); display:inline-flex; align-items:center; gap:4px;}

  .alert{display:flex; align-items:center; gap:8px; font-size:13px; border-radius:8px; padding:9px 12px; margin-top:10px;}
  .alert-danger{background:var(--rose-50); color:var(--rose-600); border:1px solid var(--rose-200);}

  .balance-box{background:#fff; border:1px solid var(--stone-200); border-radius:10px; padding:18px; max-width:560px;}
  .balance-row{display:flex; justify-content:space-between; padding:6px 0; font-size:13px; border-bottom:1px solid var(--stone-100);}
  .balance-row.total{font-weight:800; border-top:1px solid var(--stone-300); border-bottom:none; margin-top:4px; padding-top:8px;}
  .balance-row.grand{font-weight:900; font-size:16px; border-top:2px double var(--charcoal3); border-bottom:none; margin-top:14px; padding-top:12px;}

  .search-box{position:relative; width:220px; max-width:100%; margin-bottom:12px;}
  .search-box input{padding-inline-start:30px;}
  .search-box .si{position:absolute; right:9px; top:9px; color:var(--stone-400); font-size:13px;}

  .footer-note{margin-top:24px; background:#fff; border:1px solid var(--stone-200); border-radius:10px; padding:14px; font-size:12.5px; color:var(--stone-500); line-height:1.8;}
  ::selection{background:#99f6e4;}

  /* ===== طباعة (كشف الحساب / السندات) ===== */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block; position:absolute; top:0; left:0; width:100%; padding:24px; background:#fff;}
    #printArea.thermal-print{width:80mm; padding:4mm;}
  }
  .thermal-receipt{font-family:'Cairo','Tahoma',sans-serif; direction:rtl; width:76mm; margin:auto; font-size:11.5px; color:#0f172a;}
  .thermal-receipt h2{font-size:13px; text-align:center; margin:0 0 2px;}
  .thermal-receipt .tr-sub{text-align:center; font-size:10px; color:#57534e; margin-bottom:6px;}
  .thermal-receipt hr{border:none; border-top:1px dashed #94a3b8; margin:6px 0;}
  .thermal-receipt table{width:100%; border-collapse:collapse; font-size:11px;}
  .thermal-receipt td{padding:2px 0;}
  .thermal-receipt .tr-total{font-weight:800; font-size:13px; text-align:center; margin-top:6px;}
  .thermal-receipt .tr-footer{text-align:center; font-size:9.5px; color:#78716c; margin-top:8px;}
  .print-doc{font-family:'Cairo','Tahoma',sans-serif; color:#0f172a; direction:rtl; position:relative;}
  .print-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #0f172a; padding-bottom:12px; margin-bottom:14px;}
  .print-co{font-size:18px; font-weight:800;}
  .print-co-sub{font-size:11px; color:#57534e; font-weight:400; margin-top:2px;}
  .print-doc-title{font-size:16px; font-weight:800; text-align:left;}
  .print-doc-num{font-size:11px; color:#57534e; font-weight:400; margin-top:4px;}
  .print-row{display:flex; gap:8px; font-size:13px; padding:4px 0; border-bottom:1px dashed #d6d3d1;}
  .print-row span{color:#57534e; min-width:150px;}
  .print-table{width:100%; border-collapse:collapse; margin-top:14px; font-size:12.5px;}
  .print-table th, .print-table td{border:1px solid #d6d3d1; padding:6px 8px; text-align:right;}
  .print-table tfoot td{font-weight:800; border-top:2px solid #0f172a;}
  .print-sign{display:flex; justify-content:space-between; margin-top:60px; font-size:12.5px; gap:10px;}
  .print-sign div{border-top:1px solid #57534e; padding-top:6px; width:150px; text-align:center; line-height:1.7;}
  .print-note{margin-top:14px; font-size:12px; color:#57534e; background:#f5f5f4; border:1px dashed #d6d3d1; border-radius:6px; padding:8px 10px;}
  .print-watermark{position:absolute; top:38%; left:12%; font-size:60px; font-weight:900; color:rgba(15,23,42,.08); transform:rotate(-25deg); z-index:0; pointer-events:none; white-space:nowrap;}
  /* ثيمات إضافية لكشف الحساب */
  .print-doc.theme-dark .print-head{background:#0f172a; color:#fff; padding:14px; border-radius:8px; border-bottom:none; margin-bottom:16px;}
  .print-doc.theme-dark .print-co-sub, .print-doc.theme-dark .print-doc-num{color:#cbd5e1;}
  .print-doc.theme-dark .print-table thead th{background:#f1f5f9;}
  .print-doc.theme-minimal{font-size:12px;}
  .print-doc.theme-minimal .print-head{border-bottom:1px solid #000; padding-bottom:8px; margin-bottom:10px;}
  .print-doc.theme-minimal .print-co{font-size:15px;}
  .print-doc.theme-minimal .print-table th, .print-doc.theme-minimal .print-table td{border:1px solid #000; padding:4px 6px;}
  .print-doc.theme-minimal .print-row{border-bottom:1px solid #000;}
  .print-doc.theme-formal{border:3px double #0f172a; padding:18px;}
  .print-doc.theme-formal .print-head{border-bottom:3px double #0f172a;}
  .print-doc.theme-formal .print-co{font-size:20px;}

  /* ===== شاشة تسجيل الدخول ===== */
  .auth-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    background:
      radial-gradient(circle at 15% 20%, rgba(242,115,24,.18) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(242,115,24,.12) 0%, transparent 45%),
      linear-gradient(160deg,var(--charcoal) 0%, #102a43 55%, #1e293b 100%);
  }
  .auth-card{background:#fff; border-radius:16px; padding:30px 26px; width:100%; max-width:380px; box-shadow:0 20px 60px rgba(0,0,0,.35); border-top:4px solid var(--brand-orange);}
  .auth-brand{text-align:center; margin-bottom:20px;}
  .auth-brand .t{font-size:19px; font-weight:800; color:var(--charcoal);}
  .auth-brand .s{font-size:12px; color:var(--stone-500); margin-top:3px;}
  .auth-error{background:var(--rose-50); color:var(--rose-600); border:1px solid var(--rose-200); border-radius:7px; padding:8px 10px; font-size:12.5px; margin-bottom:10px;}
  .auth-links{display:flex; justify-content:space-between; margin-top:10px; font-size:12px;}
  .auth-links a{color:var(--brand-orange-dark); cursor:pointer; text-decoration:underline;}
  .auth-hint{background:var(--stone-100); border-radius:7px; padding:8px 10px; font-size:11.5px; color:var(--stone-500); margin-top:14px; line-height:1.8;}
  .user-chip{display:flex; align-items:center; gap:6px; font-size:11px; color:#e2e8f0;}
  .user-chip .role{background:rgba(255,255,255,.1); border-radius:4px; padding:1px 6px; font-size:9px;}
  .user-chip button{background:none; border:none; color:#fca5a5; font-size:11px; cursor:pointer; padding:0; text-decoration:underline; font-family:inherit;}
  .tasbih-btn{width:100%; padding:34px 0; border-radius:16px; border:none; background:linear-gradient(160deg,var(--teal-700),var(--teal-800)); color:#fff; font-size:15px; font-weight:800; cursor:pointer; box-shadow:0 6px 18px rgba(15,118,110,.35);}
  .tasbih-count{font-size:56px; font-weight:900; text-align:center; color:var(--charcoal); font-variant-numeric:tabular-nums; margin:10px 0;}
  .azkar-item{border-bottom:1px solid var(--stone-100); padding:10px 0; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .azkar-text{font-size:13.5px; line-height:2; flex:1;}
  .hero-net-card{
    background:linear-gradient(135deg,#0f172a 0%,#102a43 55%,#1e293b 100%);
    color:#fff; border-radius:14px; padding:22px 24px; box-shadow:0 8px 24px rgba(15,23,42,.25);
    border-top:3px solid var(--brand-orange);
  }
  .hero-net-card .t{font-size:13px; font-weight:700; color:#fdba74; letter-spacing:.3px;}
  .hero-net-card .v{font-size:34px; font-weight:900; margin-top:6px; font-variant-numeric:tabular-nums;}
  .hero-net-card .v .unit{font-size:16px; font-weight:700; color:#cbd5e1;}
  .hero-net-card .s{font-size:12px; color:#cbd5e1; margin-top:8px; line-height:1.7;}

  /* ===== زر البحث الشامل والوضع الليلي ===== */
  .search-trigger-btn{width:100%; margin-top:10px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:#cbd5e1; border-radius:8px; padding:8px 10px; font-size:12px; text-align:right; cursor:pointer; font-family:inherit;}
  .search-trigger-btn:hover{background:rgba(255,255,255,.12); color:#fff;}
  .mobile-icon-btn{background:none; border:none; font-size:15px; cursor:pointer; padding:2px;}

  /* ===== تخصيص القائمة (إخفاء/إظهار أقسام) ===== */
  .nav-manage-toggle{width:100%; margin-top:6px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:#cbd5e1; border-radius:8px; padding:7px 10px; font-size:11.5px; text-align:right; cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:space-between; gap:6px;}
  .nav-manage-toggle:hover{background:rgba(255,255,255,.12); color:#fff;}
  .nav-manage-toggle.active{background:var(--brand-orange); color:#fff; border-color:var(--brand-orange);}
  .nav-manage-toggle .cnt{opacity:.75; font-size:10.5px;}
  .nav-edit-bar{display:flex; align-items:center; justify-content:space-between; gap:6px; padding:7px 16px; font-size:10.5px; color:#94a3b8; border-bottom:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.03);}

/* ترحيل أكواد الحسابات الافتراضية القديمة (3 أرقام) إلى الترميز الجديد
   الأطول (5 أرقام) لأي قاعدة بيانات محفوظة مسبقًا — يعمل مرة واحدة تلقائيًا
   عند فتح التطبيق، ولا يمسّ أكواد الحسابات المخصصة التي أضافها المستخدم */
const ACCOUNT_CODE_MIGRATION = {};
DEFAULT_ACCOUNTS.forEach(a=>{ ACCOUNT_CODE_MIGRATION[a.id] = a.code; });
function migrateAccountCodes(){
  let changed = false;
  DB.accounts.forEach(a=>{
    const newCode = ACCOUNT_CODE_MIGRATION[a.id];
    if(newCode && a.code !== newCode){ a.code = newCode; changed = true; }
  });
  return changed;
}
/* يضيف أي حساب افتراضي جديد (تمت إضافته لاحقًا في تحديث للتطبيق، مثل حسابات
   الخصم المكتسب/المسموح به ومخصص الديون المشكوك فيها) إلى قواعد البيانات
   الموجودة مسبقًا والتي أُنشئت قبل إضافته — يتحقق بالمعرّف الثابت لكل حساب
   حتى لا يُكرَّر، ويغيّر الكود تلقائيًا لو كان الكود الافتراضي مستخدَمًا بالفعل */
function seedMissingDefaultAccounts(){
  let changed = false;
  DEFAULT_ACCOUNTS.forEach(def=>{
    if(DB.accounts.some(a=>a.id===def.id)) return;
    const acc = Object.assign({}, def);
    if(DB.accounts.some(a=>a.code===acc.code)) acc.code = suggestNextAccountCode(def.type);
    DB.accounts.push(acc);
    changed = true;
  });
  return changed;
}
/* يقترح كودًا جديدًا غير مستخدم لحساب جديد بناءً على تصنيفه الرئيسي،
   متبعًا نفس نمط الترميز (5 أرقام: أصول 1xxxx، خصوم 2xxxx، حقوق ملكية
   3xxxx، إيرادات 4xxxx، مصروفات 5xxxx) */
const ACCOUNT_TYPE_CODE_PREFIX = { asset:"1", liability:"2", equity:"3", revenue:"4", expense:"5" };
function suggestNextAccountCode(type){
  const prefix = ACCOUNT_TYPE_CODE_PREFIX[type] || "9";
  const used = new Set(DB.accounts.filter(a=>a.code && a.code[0]===prefix).map(a=>a.code));
  for(let n=1; n<10000; n++){
    const candidate = prefix + String(n).padStart(4,"0");
    if(!used.has(candidate)) return candidate;
  }
  return prefix+"0000";
}

/* التصنيفات الفرعية داخل كل قسم رئيسي من الحسابات */
const SUBTYPES = {
  asset:     [ {id:"current",     label:"أصول متداولة"},      {id:"non_current", label:"أصول غير متداولة"}, {id:"party_customers", label:"حسابات العملاء (فرعية تلقائية)"} ],
  liability: [ {id:"current",     label:"خصوم متداولة"},      {id:"non_current", label:"خصوم غير متداولة"}, {id:"party_suppliers", label:"حسابات الموردين (فرعية تلقائية)"}, {id:"party_drivers", label:"حسابات السائقين (فرعية تلقائية)"}, {id:"party_helpers", label:"حسابات المساعدين/التبّاعين (فرعية تلقائية)"} ],
  equity:    [ {id:"capital",     label:"رأس المال والاحتياطيات"} ],
  revenue:   [ {id:"operating",   label:"إيرادات تشغيلية"},   {id:"other", label:"إيرادات أخرى"} ],
  expense:   [ {id:"operating",   label:"مصروفات تشغيلية"},   {id:"other", label:"مصروفات أخرى"} ],
};
/* تصنيفات مرتبطة تلقائيًا بكل نوع من الجهات (عميل/مورد/سائق/مساعد) —
   تحدد نوع الحساب الرئيسي، طبيعته، وتصنيفه الفرعي عند إنشاء حساب فرعي تلقائي له */
const PARTY_ACCOUNT_META = {
  customers: { type:"asset",     normal:"debit",  subType:"party_customers", prefixLabel:"عميل" },
  suppliers: { type:"liability", normal:"credit", subType:"party_suppliers", prefixLabel:"مورد" },
  drivers:   { type:"liability", normal:"credit", subType:"party_drivers",   prefixLabel:"سائق" },
  helpers:   { type:"liability", normal:"credit", subType:"party_helpers",   prefixLabel:"مساعد (تبّاع)" },
};
/* ينشئ (أو يحدّث) حساب فرعي تلقائي في شجرة الحسابات مرتبط بعميل/مورد/سائق/مساعد،
   بحيث يظهر أي طرف يتم تسجيله تلقائيًا داخل شجرة الحسابات دون تدخل يدوي */
function ensurePartyAccount(kind, party){
  const meta = PARTY_ACCOUNT_META[kind];
  if(!meta || !party) return null;
  let acc = party.accountId ? DB.accounts.find(a=>a.id===party.accountId) : null;
  if(!acc && party.accountId){
    // كان مرتبطًا بحساب حُذف يدويًا سابقًا — أعد إنشاء الربط
    acc = null;
  }
  if(acc){
    if(acc.name !== party.name) acc.name = party.name;
    if(!acc.partyKind || !acc.partyId){ acc.partyKind = kind; acc.partyId = party.id; }
    return acc;
  }
  acc = {
    id: uid("acc"), code: suggestNextAccountCode(meta.type), name: party.name,
    type: meta.type, normal: meta.normal, subType: meta.subType,
    partyKind: kind, partyId: party.id,
  };
  DB.accounts.push(acc);
  party.accountId = acc.id;
  return acc;
}
/* يمر على كل العملاء/الموردين/السائقين/المساعدين المسجَّلين مسبقًا (قبل تفعيل
   هذه الميزة) وينشئ لهم حسابات فرعية تلقائية إن لم تكن موجودة بعد */
function syncAllPartyAccounts(){
  let changed = false;
  ["customers","suppliers","drivers","helpers"].forEach(kind=>{
    (DB[kind]||[]).forEach(p=>{
      const before = p.accountId;
      const acc = ensurePartyAccount(kind, p);
      if(acc && p.accountId!==before) changed = true;
    });
  });
  return changed;
}
/* يحذف الحساب الفرعي التلقائي المرتبط بجهة عند حذفها، فقط إذا لم يكن مستخدمًا
   في أي قيد يومية؛ وإلا يُفصل الربط ويظل الحساب قائمًا بشكل مستقل حتى لا تُفقد القيود */
function releasePartyAccount(party){
  if(!party || !party.accountId) return;
  const acc = DB.accounts.find(a=>a.id===party.accountId);
  if(!acc) return;
  const used = DB.entries.some(e => e.lines.some(l=>l.accountId===acc.id));
  if(used){
    acc.partyKind = null; acc.partyId = null;
    acc.name = acc.name + " (محذوف)";
  }else{
    DB.accounts = DB.accounts.filter(a=>a.id!==acc.id);
  }
}
function accSubType(a){
  return a.subType || (SUBTYPES[a.type] && SUBTYPES[a.type][0] && SUBTYPES[a.type][0].id) || "";
}
function subTypeLabel(type, subTypeId){
  const list = SUBTYPES[type]||[];
  const found = list.find(s=>s.id===subTypeId);
  return found ? found.label : (list[0]?list[0].label:"");
}
function subtypeOptionsHtml(type, current){
  const list = SUBTYPES[type]||[];
  const cur = current || (list[0]&&list[0].id);
  return list.map(s=>'<option value="'+s.id+'" '+(s.id===cur?"selected":"")+'>'+s.label+'</option>').join("");
}

const NAV = [
  { id:"dashboard",     label:"الرئيسية",              icon:"🏠" },
  { id:"accounts",      label:"شجرة الحسابات",         icon:"🌳" },
  { id:"journal",       label:"قيود اليومية",          icon:"📘" },
  { id:"recurring",     label:"قيود متكررة",           icon:"🔁" },

  return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

   نظام تسجيل الدخول والمستخدمين (اسم مستخدم / كلمة مرور + استرجاع)
   ====================================================================== */
const SESSION_KEY = "ferdaws-session-v1";
const HIDDEN_NAV_KEY = "ferdaws-hidden-nav-v1";
const NAV_ORDER_KEY = "ferdaws-nav-order-v1";
const DEFAULT_RECOVERY_ANSWER = "فردوس2026";

async function hashText(text){
  try{
    if(window.crypto && crypto.subtle && crypto.subtle.digest){
      const enc = new TextEncoder().encode(String(text));
      const buf = await crypto.subtle.digest("SHA-256", enc);
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
    }
  }catch(e){ /* fallback below */ }
  let h = 0;
  const s = String(text);
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return "fb" + h.toString(16);
}
async function seedDefaultUsersIfNeeded(){
  if(DB.users && DB.users.length>0) return;
  const ansHash = await hashText(DEFAULT_RECOVERY_ANSWER);
  DB.users = [
    { id:uid("u"), username:"ahmed", displayName:"أ. أحمد رجب", role:"admin",
      passwordHash: await hashText("admin123"),
      securityQuestion:"ما هي كلمة الاسترجاع الافتراضية؟ (راجع تعليمات التثبيت)",
      securityAnswerHash: ansHash },
    { id:uid("u"), username:"ehab", displayName:"الأستاذ إيهاب محمد", role:"accountant",
      passwordHash: await hashText("acc123"),
      securityQuestion:"ما هي كلمة الاسترجاع الافتراضية؟ (راجع تعليمات التثبيت)",
      securityAnswerHash: ansHash },
  ];
  saveDB();
}
function loadSession(){
  try{ const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
let session = loadSession() || {userId:null};
function currentUser(){
  if(!session || !session.userId) return null;
  return (DB.users||[]).find(u=>u.id===session.userId) || null;
}
function roleLabel(r){ return r==="admin" ? "مدير" : r==="accountant" ? "محاسب" : "مشاهد (قراءة فقط)"; }
function can(action){
  const u = currentUser();
  if(!u) return false;
  if(u.role==="admin") return true;
  if(u.role==="accountant") return ["manageUsers","resetData","syncSettings"].indexOf(action)===-1;
  return false;
}
/* ======================================================================
   صلاحيات دقيقة لكل قسم (اختيارية) — يحددها المدير من "إدارة المستخدمين"
   لكل مستخدم غير مدير: افتراضيًا المحاسب يقدر يعدّل في كل مكان، والمشاهد
   قراءة فقط في كل مكان؛ ويمكن للمدير تخصيص ذلك قسمًا بقسم عبر u.sectionAccess
   (خريطة: tabId -> "edit" | "view").
   ====================================================================== */
function canEditTab(tab){
  const u = currentUser();
  if(!u) return false;
  if(u.role==="admin") return true;
  const override = u.sectionAccess && u.sectionAccess[tab];
  if(override==="edit") return true;
  if(override==="view") return false;
  return u.role==="accountant"; /* الافتراضي: محاسب = تعديل، مشاهد = قراءة فقط */
}
function logActivity(action, details, userOverride){
  const user = userOverride || currentUser();
  DB.activityLog = DB.activityLog || [];
  DB.activityLog.push({ id:uid("log"), at:new Date().toISOString(), userId:user?user.id:null, userName:user?user.displayName:"غير معروف", action, details:details||"" });
  if(DB.activityLog.length>500) DB.activityLog = DB.activityLog.slice(-500);
  saveDB();
}

function openGlobalSearch(){
  const el = byId("searchOverlay");
  el.style.display = "flex";
  el.innerHTML = '<div class="search-modal" onclick="event.stopPropagation()">' +
    '<div class="search-modal-head">' +
      '<input class="f-input" id="global-search-input" placeholder="ابحث عن عميل، مورد، سائق، حساب، أو وصف قيد..." oninput="onGlobalSearchInput(this.value)" onkeydown="if(event.key===\'Escape\') closeGlobalSearch();"/>' +
      (isVoiceSearchSupported() ? '<button class="btn btn-ghost btn-sm" id="voice-search-btn" onclick="startVoiceSearch()" title="بحث بالصوت">🎤</button>' : '') +
      '<button class="btn btn-ghost btn-sm" onclick="closeGlobalSearch()">✕</button>' +
    '</div>' +
    '<div class="search-modal-body" id="global-search-results"><div class="empty-row">اكتب أي كلمة للبحث في كل بيانات النظام</div></div>' +
  '</div>';
  setTimeout(function(){ const inp = byId("global-search-input"); if(inp) inp.focus(); }, 30);
}
function closeGlobalSearch(){
  const el = byId("searchOverlay");
  if(el){ el.style.display = "none"; el.innerHTML = ""; }
}
function onGlobalSearchInput(q){
  const box = byId("global-search-results");
  if(!box) return;
  if(!q.trim()){ box.innerHTML = '<div class="empty-row">اكتب أي كلمة للبحث في كل بيانات النظام</div>'; return; }
  box.innerHTML = renderSearchResults(runGlobalSearch(q.trim()));
}
function runGlobalSearch(q){
  const results = {customers:[], suppliers:[], drivers:[], helpers:[], accounts:[], entries:[]};
  DB.customers.forEach(c=>{ if(c.name.indexOf(q)>-1 || (c.phone||"").indexOf(q)>-1) results.customers.push(c); });
  DB.suppliers.forEach(s=>{ if(s.name.indexOf(q)>-1 || (s.phone||"").indexOf(q)>-1) results.suppliers.push(s); });
  (DB.drivers||[]).forEach(d=>{ if(d.name.indexOf(q)>-1) results.drivers.push(d); });
  (DB.helpers||[]).forEach(h=>{ if(h.name.indexOf(q)>-1) results.helpers.push(h); });
  DB.accounts.forEach(a=>{ if(a.name.indexOf(q)>-1 || a.code.indexOf(q)>-1) results.accounts.push(a); });
  DB.entries.forEach(e=>{ if((e.description||"").indexOf(q)>-1) results.entries.push(e); });
  Object.keys(results).forEach(k=> results[k] = results[k].slice(0,8));
  return results;
}
function renderSearchResults(results){
  const groups = [
    {key:"customers", title:"العملاء", render:function(c){return c.name+(c.phone?" — "+c.phone:"");}, action:function(c){return "goToStatement('customers','"+c.id+"')";}},
    {key:"suppliers", title:"الموردون", render:function(s){return s.name+(s.phone?" — "+s.phone:"");}, action:function(s){return "goToStatement('suppliers','"+s.id+"')";}},
    {key:"drivers", title:"السائقون", render:function(d){return d.name;}, action:function(d){return "goToPersonStatement('driver','"+d.id+"')";}},
    {key:"helpers", title:"المساعدون", render:function(h){return h.name;}, action:function(h){return "goToPersonStatement('helper','"+h.id+"')";}},
    {key:"accounts", title:"الحسابات", render:function(a){return a.code+" - "+a.name;}, action:function(){return "goTab('accounts')";}},
    {key:"entries", title:"قيود اليومية", render:function(e){return fmtDate(e.date)+" - "+(e.description||"");}, action:function(e){return "goTab('"+(e.isAdjustment?"adjustments":"journal")+"')";}},
  ];
  let html = "", any = false;
  groups.forEach(function(g){
    const items = results[g.key];
    if(!items || items.length===0) return;
    any = true;
    html += '<div class="search-result-group"><div class="g-title">'+g.title+'</div>';
    items.forEach(function(it){
      html += '<div class="search-result-item" onclick="closeGlobalSearch(); '+g.action(it)+';">'+esc(g.render(it))+'</div>';
    });
    html += '</div>';
  });
  if(!any) html = '<div class="empty-row">لا توجد نتائج مطابقة</div>';
  return html;
}

/* ======================================================================
   تكبير/تصغير حجم الواجهة (مفيد خصوصًا على الموبايل) — يستخدم خاصية
   zoom في CSS (مدعومة في كل متصفحات كروم/الأندرويد اللي التطبيق موجّه
   لها أساسًا)، ومحفوظة على الجهاز فتفضل ثابتة بين الجلسات
   ====================================================================== */
const ZOOM_KEY = "ferdaws-zoom-level-v1";
const ZOOM_STEPS = [0.75, 0.85, 1.0, 1.15, 1.3, 1.45, 1.6];
function applyZoomPreference(){
  let level = parseFloat(localStorage.getItem(ZOOM_KEY));
  if(!level || ZOOM_STEPS.indexOf(level)===-1) level = 1.0;
  document.body.style.zoom = level;
}
/* dir=-1 تصغير خطوة، dir=1 تكبير خطوة، dir=0 رجوع للحجم الافتراضي */
function adjustZoom(dir){
  let level = parseFloat(localStorage.getItem(ZOOM_KEY)) || 1.0;
  let idx = ZOOM_STEPS.indexOf(level);
  if(idx===-1) idx = ZOOM_STEPS.indexOf(1.0);
  if(dir===0){ idx = ZOOM_STEPS.indexOf(1.0); }
  else{ idx = Math.max(0, Math.min(ZOOM_STEPS.length-1, idx+dir)); }
  localStorage.setItem(ZOOM_KEY, String(ZOOM_STEPS[idx]));
  applyZoomPreference();
}

/* يقرأ ترتيب التبويبات المخصَّص من التخزين المحلي؛ يضيف أي تبويب جديد لم يُرتَّب
   بعد في نهاية القائمة، ويتجاهل أي معرّف قديم لم يعد له تبويب مطابق */
function getNavOrder(){
  const validIds = NAV.map(n=>n.id);
  let stored;
  try{ stored = JSON.parse(localStorage.getItem(NAV_ORDER_KEY) || "[]"); }catch(e){ stored = []; }
  if(!Array.isArray(stored)) stored = [];
  const filtered = stored.filter(id => validIds.indexOf(id) !== -1);
  const missing = validIds.filter(id => filtered.indexOf(id) === -1);
  return filtered.concat(missing);
}
function setNavOrder(arr){
  localStorage.setItem(NAV_ORDER_KEY, JSON.stringify(arr));
}
/* تحريك تبويب خطوة واحدة للخلف (dir=-1) أو للأمام (dir=1) ضمن التبويبات
   المتاحة للمستخدم الحالي، مع الحفاظ على موضع أي تبويبات أخرى (مثل تبويب
   إدارة المستخدمين المتاح للمدير فقط) كما هي في الترتيب العام المخزَّن */
function moveNavItem(id, dir){
  const currentList = manageableNav();
  const idx = currentList.findIndex(n=>n.id===id);
  const newIdx = idx + dir;
  if(idx===-1 || newIdx<0 || newIdx>=currentList.length) return;
  const ids = currentList.map(n=>n.id);
  const tmp = ids[idx]; ids[idx] = ids[newIdx]; ids[newIdx] = tmp;
  const fullOrder = getNavOrder();
  let ptr = 0;
  const merged = fullOrder.map(fid => {
    if(ids.indexOf(fid) !== -1){ const v = ids[ptr]; ptr++; return v; }
    return fid;
  });
  setNavOrder(merged);
  renderSidebar();
  renderBottomNav();
}
function resetNavOrder(){
  localStorage.removeItem(NAV_ORDER_KEY);
  renderSidebar();
  renderBottomNav();
}
function visibleNav(){

}

}

    if(password) u.passwordHash = await hashText(password);
    if(answer) u.securityAnswerHash = await hashText(answer);
    logActivity("تعديل مستخدم", displayName);
  }else{
    if(!password){ alert("الرجاء إدخال كلمة مرور للمستخدم الجديد"); return; }
    if(!question || !answer){ alert("الرجاء إدخال سؤال وإجابة أمان لإتاحة استرجاع كلمة المرور لاحقًا"); return; }
    DB.users.push({
      id: uid("u"), username, displayName, role, sectionAccess,
      passwordHash: await hashText(password),
      securityQuestion: question,
      securityAnswerHash: await hashText(answer),
    });
    logActivity("إنشاء مستخدم", displayName);
  }
  ui.userForm = null;
  saveDB(); render();
}
function deleteUser(id){
  const target = DB.users.find(u=>u.id===id);
  if(!target) return;
  const admins = DB.users.filter(u=>u.role==="admin");
  if(target.role==="admin" && admins.length<=1){ alert("لا يمكن حذف آخر مستخدم بصلاحية مدير."); return; }
  if(currentUser() && currentUser().id===id){ alert("لا يمكنك حذف حسابك الحالي وأنت مسجّل دخول به."); return; }
  if(!confirm('هل تريد حذف المستخدم "'+target.displayName+'"؟')) return;
  DB.users = DB.users.filter(u=>u.id!==id);
  logActivity("حذف مستخدم", target.displayName);
  saveDB(); render();
}

/* ======================================================================
   مزامنة الأجهزة (اختياري) — عبر باك إند خاص (Node.js + PostgreSQL) حتى
   تعمل نفس البيانات على أكثر من جهاز (هاتف + كمبيوتر مثلاً) لنفس الشركة
   ====================================================================== */
const SYNC_CONFIG_KEY = "ferdaws-sync-config-v1";
const DEVICE_ID_KEY = "ferdaws-device-id";
function getDeviceId(){
  let id = localStorage.getItem(DEVICE_ID_KEY);
  if(!id){ id = uid("dev"); localStorage.setItem(DEVICE_ID_KEY, id); }
  return id;
}
function loadSyncConfig(){
  try{
    const raw = localStorage.getItem(SYNC_CONFIG_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveSyncConfigObj(cfg){
  localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(cfg));
}
let syncState = { connected:false, error:"", lastSyncAt:null, applyingRemote:false, pollTimer:null, heartbeatTimer:null, authBusy:false, receivedChunks:{}, baseRevs:{}, devicesList:[], pushInFlight:false, pushQueued:false, pushQueuedForce:false };

function apiBase(cfg){
  return (cfg.backendUrl||"").replace(/\/+$/,"");
}
/* غلاف بسيط لكل نداءات الـ API: يضيف رمز الدخول (JWT) تلقائيًا، ويحوّل
   ردود الأخطاء لرسالة نصية عربية واضحة بدل ما يترك الاستدعاء يفشل بصمت */
function apiFetch(cfg, path, options){
  options = options || {};
  const headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
  if(cfg.token) headers["Authorization"] = "Bearer " + cfg.token;
  return fetch(apiBase(cfg) + path, Object.assign({}, options, { headers }))
    .then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(body){
        if(!res.ok){
          const err = new Error(body.error || ("خطأ في السيرفر ("+res.status+")"));
          err.status = res.status; err.body = body;
          throw err;
        }
        return body;
      });
    });
}
function describeSyncError(e){
  if(e && e.message === "Failed to fetch") return "تعذر الوصول للسيرفر — تأكد من رابط الباك إند والاتصال بالإنترنت (لو السيرفر على استضافة مجانية، أول اتصال بعد فترة خمول قد يأخذ دقيقة تقريبًا حتى يصحو).";
  return (e && e.message) || "حدث خطأ غير متوقع";
}

/* ======================================================================
   إنشاء/تسجيل الدخول لحساب الشركة على الباك إند الخاص بك

function syncRegisterCompany(){
  const base = readSyncFormBase(); if(!base) return;
  const companyName = byId("sync-company-name").value.trim();
  const email = byId("sync-email").value.trim();
  const password = byId("sync-password").value;
  const displayName = byId("sync-display-name") ? byId("sync-display-name").value.trim() : "";
  if(!companyName || !email || !password){ alert("أدخل اسم الشركة والبريد الإلكتروني وكلمة المرور"); return; }
  if(password.length<6){ alert("كلمة المرور يجب أن تكون 6 أحرف على الأقل"); return; }
  syncState.authBusy = true; syncState.error = ""; render();
  apiFetch(base, "/api/auth/register-company", {
    method: "POST", body: JSON.stringify({ companyName, email, password, displayName })
  }).then(function(data){
    saveSyncConfigObj({ enabled:true, backendUrl: base.backendUrl, token: data.token, companyId: data.companyId, companyName: data.companyName, email: data.email });
    syncState.authBusy = false; syncState.baseRevs = {}; syncState.receivedChunks = {};
    initialPullSettledOnce = false;
    startSync();
    pushToCloud(true); /* أول رفع لبيانات هذا الجهاز الحالية كأساس للشركة الجديدة */
    alert("✔ تم إنشاء حساب الشركة بنجاح. لربط جهاز آخر: افتح نفس التطبيق ← مزامنة الأجهزة ← نفس رابط الباك إند ← سجّل الدخول بنفس البريد وكلمة المرور.");
    render();
  }).catch(function(e){
    syncState.authBusy = false;
    alert("تعذر إنشاء حساب الشركة: " + describeSyncError(e));
    render();
  });
}

    render();

/* ======================================================================
   مزامنة مُجزَّأة (Chunked Sync) عبر الباك إند الخاص بك: بدل رفع/جلب
   قاعدة البيانات كلها في نداء واحد، تُقسَّم البيانات إلى 6 "أجزاء" —
   كل جزء برقم مراجعة (rev) يُستخدم لكشف التعارض قبل الكتابة فوقه.
   الاتصال هنا Polling دوري (كل ~8 ثوانٍ) بدل استماع لحظي، وهو كافٍ جدًا
   لطبيعة بيانات محاسبية وليس مطلوبًا فيها تزامن بالمللي ثانية.
   ====================================================================== */
const SYNC_CHUNK_GROUPS = {
  transactions: ["sales","purchases","receipts","payments","checks","trips"],
  entries:      ["entries"],
  operations:   ["custodyRecords","driverWorkDays","helperWorkDays","maintenanceLogs","fuelLogs"],
  activityLog:  ["activityLog"],
  trash:        ["trash"],
  /* أي حقل آخر (شجرة الحسابات، العملاء، الموردون، السائقون، المساعدون،
     المركبات، المستخدمون، إعدادات القفل...) يقع تلقائيًا في جزء "core" */
};
function chunkKeyForField(field){
  for(const g in SYNC_CHUNK_GROUPS){ if(SYNC_CHUNK_GROUPS[g].indexOf(field)!==-1) return g; }
  return "core";
}
const SYNC_CHUNK_KEYS = ["core"].concat(Object.keys(SYNC_CHUNK_GROUPS));
function buildChunksFromDB(){
  const chunks = {}; SYNC_CHUNK_KEYS.forEach(k=>{ chunks[k] = {}; });
  Object.keys(DB).forEach(field=>{ chunks[chunkKeyForField(field)][field] = DB[field]; });
  return chunks;
}
function applyMergedChunksToDB(){
  syncState.applyingRemote = true;
  const merged = {};
  Object.keys(syncState.receivedChunks).forEach(k=>Object.assign(merged, syncState.receivedChunks[k]||{}));
  DB = Object.assign({}, emptyDB, DB, merged);
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){}
  syncState.applyingRemote = false;
}
const DEVICE_NAME_KEY = "ferdaws-device-name";
function getDeviceName(){
  return localStorage.getItem(DEVICE_NAME_KEY) || "";
}
function setDeviceName(name){
  localStorage.setItem(DEVICE_NAME_KEY, name || "");
}
function startSync(){
  const cfg = loadSyncConfig();
  if(!cfg || !cfg.enabled || !cfg.backendUrl || !cfg.token) return;
  if(syncState.pollTimer) clearInterval(syncState.pollTimer);
  if(syncState.heartbeatTimer) clearInterval(syncState.heartbeatTimer);
  pullFromCloud();
  syncState.pollTimer = setInterval(pullFromCloud, 8000);
  sendDeviceHeartbeat();
  syncState.heartbeatTimer = setInterval(sendDeviceHeartbeat, 60000);
  registerOnlineRetryListener();
}
/* يراقب رجوع الاتصال بالإنترنت (مرة واحدة بس على مستوى الصفحة كلها)،
   وفور ما يرجع، يرفع أي تعديل اتعمل وإحنا أوفلاين فورًا ويسحب آخر
   تحديثات فاتتنا في نفس اللحظة — بدل ما ننتظر حفظة جديدة عشان
   التعديلات القديمة توصل للسحابة */
let onlineRetryListenerRegistered = false;
function registerOnlineRetryListener(){
  if(onlineRetryListenerRegistered) return;
  onlineRetryListenerRegistered = true;
  window.addEventListener("online", function(){
    pushToCloud(false);
    pullFromCloud();
  });
}
/* يرسل "نبضة" دورية للسيرفر تحمل اسم هذا الجهاز (لو مسمّى) وتحدّث وقت
   آخر ظهور له — بحيث تقدر أي جهاز آخر من نفس الشركة يشوف مين متصل
   حاليًا من صفحة "مزامنة الأجهزة" */
function sendDeviceHeartbeat(){
  const cfg = loadSyncConfig();
  if(!cfg || !cfg.enabled || !cfg.backendUrl || !cfg.token) return;
  apiFetch(cfg, "/api/devices/heartbeat", {
    method: "POST", body: JSON.stringify({ deviceId: getDeviceId(), name: getDeviceName() })
  }).catch(function(){ /* لا داعي لإزعاج المستخدم لو فشلت نبضة واحدة */ });
}
function fetchConnectedDevices(){
  const cfg = loadSyncConfig();
  if(!cfg || !cfg.enabled || !cfg.backendUrl || !cfg.token) return;
  const box = byId("connected-devices-box");
  if(box) box.innerHTML = '<span style="color:var(--stone-500);">جارِ التحميل...</span>';
  apiFetch(cfg, "/api/devices").then(function(list){
    syncState.devicesList = list;
    renderConnectedDevicesBox();
  }).catch(function(e){
    if(box) box.innerHTML = '<span style="color:var(--rose-600);">تعذر تحميل قائمة الأجهزة: '+esc(describeSyncError(e))+'</span>';
  });
}
function renderConnectedDevicesBox(){
  const box = byId("connected-devices-box");
  if(!box) return;
  const list = syncState.devicesList || [];
  const myId = getDeviceId();
  if(list.length===0){ box.innerHTML = '<span style="color:var(--stone-500);">لا توجد أجهزة مسجَّلة بعد.</span>'; return; }
  box.innerHTML = list.map(function(d){
    const isMe = d.device_id === myId;
    const name = d.name && d.name.trim() ? d.name : "(بدون اسم)";
    const when = d.last_seen ? new Date(d.last_seen).toLocaleString("ar-EG", {dateStyle:"short", timeStyle:"short"}) : "—";
    const recent = d.last_seen && (Date.now() - new Date(d.last_seen).getTime() < 3*60*1000);
    return '<div style="display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--stone-200);">' +
      '<div><b>'+(recent?'🟢':'⚪')+' '+esc(name)+'</b>'+(isMe?' <span style="color:var(--emerald-700); font-size:11px;">(هذا الجهاز)</span>':'')+'<div style="font-size:11px; color:var(--stone-500);">آخر ظهور: '+when+'</div></div>' +
      (isMe ? '' : '<button class="icon-btn danger" title="إزالة من القائمة" onclick="forgetDevice(\''+d.device_id+'\')">🗑️</button>') +
    '</div>';
  }).join("");
}
function saveDeviceNameFromForm(){
  const val = byId("device-name-input").value.trim();
  setDeviceName(val);
  sendDeviceHeartbeat();
  setTimeout(fetchConnectedDevices, 400);
  alert("✔ تم حفظ اسم الجهاز.");
}
function forgetDevice(deviceId){
  const cfg = loadSyncConfig();
  if(!cfg) return;
  if(!confirm("إزالة هذا الجهاز من القائمة؟ (هذا لا يمنعه من الاتصال فعليًا، فقط يخفيه من العرض)")) return;
  apiFetch(cfg, "/api/devices/"+encodeURIComponent(deviceId), { method:"DELETE" })
    .then(fetchConnectedDevices)
    .catch(function(e){ alert("تعذر الحذف: "+describeSyncError(e)); });
}
/* يجلب كل الأجزاء من السيرفر، ويطبّق محليًا فقط الأجزاء اللي رقم
   مراجعتها على السيرفر أحدث من آخر نسخة عندنا (baseRevs) */
/* بيحل مشكلة حقيقية: لو الجهاز اتقفل وحصل تعديل من جهاز تاني، أول ما
   يفتح تاني كان ممكن "يدفع" (Push) بياناته المحلية القديمة فورًا قبل
   ما ياخد فرصة يسحب (Pull) آخر تحديثات فاتته — فيتسبب في الكتابة فوق
   تعديل حقيقي من الجهاز التاني! عشان كده أي رفع (Push) بيتأجّل لحد ما
   أول عملية سحب (Pull) في الجلسة دي تخلص (نجحت أو فشلت، مش مهم) */
let initialPullSettledOnce = false;
function markInitialPullSettled(){
  if(initialPullSettledOnce) return;
  initialPullSettledOnce = true;
  flushQueuedPush();
}
function pullFromCloud(){
  const cfg = loadSyncConfig();
  if(!cfg || !cfg.enabled || !cfg.backendUrl || !cfg.token || syncState.applyingRemote || syncState.pushInFlight) return;
  apiFetch(cfg, "/api/chunks").then(function(data){
    syncState.connected = true; syncState.error = "";
    let appliedAny = false;
    Object.keys(data).forEach(function(key){
      const remoteRev = data[key].rev || 0;
      const localRev = syncState.baseRevs[key] || 0;
      if(remoteRev > localRev){
        syncState.receivedChunks[key] = data[key].fields || {};
        syncState.baseRevs[key] = remoteRev;
        appliedAny = true;
      }
    });
    if(appliedAny){
      applyMergedChunksToDB();
      syncState.lastSyncAt = new Date();
      render();
    }
    renderSyncStatusIfVisible();
    markInitialPullSettled();
  }).catch(function(e){
    syncState.connected = false;
    markInitialPullSettled();
    if(e && e.status===401){
      syncState.error = "انتهت صلاحية الجلسة — سجّل الدخول مرة أخرى من صفحة مزامنة الأجهزة.";
      if(syncState.pollTimer){ clearInterval(syncState.pollTimer); syncState.pollTimer=null; }
    }else{
      syncState.error = describeSyncError(e);
    }
    renderSyncStatusIfVisible();
  });
}
/* رفع التعديلات للسحابة، مع التحقق من عدم وجود تعارض: لو حد تاني عدّل
   نفس الجزء في نفس الوقت تقريبًا، يرفض السيرفر الطلب (409) ويرجع أحدث
   نسخة من الأجزاء المتعارضة مباشرة في نفس الرد — فتُطبَّق محليًا فورًا
   بدل الكتابة فوق تعديلاته بصمت، مع تنبيه واضح للمستخدم. force=true
   (تُستخدم عند استرجاع نسخة احتياطية أو الرفع اليدوي الأول) تتجاوز هذا التحقق عمدًا. */
/* رفع التعديلات للسحابة، مع التحقق من عدم وجود تعارض: لو حد تاني عدّل
   نفس الجزء في نفس الوقت تقريبًا، يرفض السيرفر الطلب (409). في هذه
   الحالة، بدل التخلي فورًا عن تعديلك المحلي (اللي كان بيحصل قبل كده
   ويُشعر وكأن "الحذف مش بيتم")، نحدّث رقم المراجعة المعروف محليًا فقط
   ونعيد محاولة الرفع تلقائيًا مرة واحدة بنفس بياناتك الحالية — غالبًا
   تنجح لأن التعارض غالبًا كان بسبب فارق توقيت بسيط بين جهازين لنفس
   المستخدم، لا تعديل حقيقي متضارب. فقط لو فشلت المحاولة الثانية أيضًا،
   نطبّق نسخة السيرفر وننبّه المستخدم لمراجعة عمله الأخير. force=true
   (تُستخدم عند استرجاع نسخة احتياطية أو الرفع اليدوي الأول) تتجاوز هذا التحقق عمدًا. */
/* رفع التعديلات للسحابة، مع التحقق من عدم وجود تعارض. ملحوظة مهمة:
   saveDB() بتنادي الدالة دي بعد كل عملية حفظ، وممكن المستخدم يعمل
   كذا إجراء بسرعة قبل ما الرفع الأول يخلص — فلو سمحنا بأكتر من طلب
   رفع "طاير" في نفس الوقت، الطلب التاني هيستخدم رقم مراجعة (baseRev)
   قديم لسه ما اتحدّثش من الطلب الأول، فيترفض كـ"تعارض" رغم إنه من
   نفس الجهاز ونفس المستخدم! عشان كده: لو فيه رفع شغّال بالفعل، أي
   طلب رفع جديد بيتأجّل بس (pushQueued) وبيتنفّذ تلقائيًا فور ما
   الرفع الحالي يخلص، بدل ما يتبعت فورًا ويتعارض مع نفسه. */
function pushToCloud(force, isRetry){
  const cfg = loadSyncConfig();
  if(!cfg || !cfg.enabled || !cfg.backendUrl || !cfg.token || syncState.applyingRemote) return;
  if(!initialPullSettledOnce){
    /* استنّى أول سحب في الجلسة يخلص قبل ما تبعت أي حاجة، حتى لو force=true
       (لو force حقيقي زي استرجاع نسخة احتياطية، هيتنفّذ بمجرد ما السحب يخلص) */
    syncState.pushQueued = true;
    if(force) syncState.pushQueuedForce = true;
    return;
  }
  if(syncState.pushInFlight){
    syncState.pushQueued = true;
    if(force) syncState.pushQueuedForce = true;
    return;
  }
  const chunks = buildChunksFromDB();
  syncState.pushInFlight = true;
  apiFetch(cfg, "/api/chunks/push", {
    method: "POST",
    body: JSON.stringify({ chunks, baseRevs: syncState.baseRevs, force: !!force, deviceId: getDeviceId() })
  }).then(function(data){
    syncState.pushInFlight = false;
    syncState.connected = true; syncState.error = "";
    Object.assign(syncState.baseRevs, data.revs || {});
    syncState.lastSyncAt = new Date();
    renderSyncStatusIfVisible();
    flushQueuedPush();
  }).catch(function(e){
    syncState.pushInFlight = false;
    if(e && e.status===409 && e.body && e.body.conflicts){
      Object.keys(e.body.conflicts).forEach(function(key){
        syncState.baseRevs[key] = e.body.conflicts[key].rev || 0;
      });
      if(!isRetry && !force){
        /* محاولة تانية فورية ببياناتك الحالية بعد تحديث رقم المراجعة —
           بدون التخلي عن تعديلك المحلي (زي الحذف اللي لسه ما اتحفظش) */
        setTimeout(function(){ pushToCloud(false, true); }, 300);
        return;
      }
      Object.keys(e.body.conflicts).forEach(function(key){
        syncState.receivedChunks[key] = e.body.conflicts[key].fields || {};
      });
      applyMergedChunksToDB();
      render();
      alert("⚠️ تعذّر حفظ آخر تعديل لأن مستخدمًا آخر عدّل نفس البيانات في نفس اللحظة تقريبًا.\n\nتم تحديث بياناتك المحلية بآخر نسخة من السيرفر تلقائيًا. برجاء مراجعة آخر إجراء قمت به والتأكد من حفظه مرة أخرى إذا لزم الأمر.\n\n💡 نصيحة: لو بتستخدم أكتر من نسخة من التطبيق على نفس الجهاز (رابط قديم + رابط جديد مثلاً)، استخدم نسخة واحدة بس في نفس الوقت لتقليل هذه الرسالة.");
    }else if(e && e.status===401){
      syncState.error = "انتهت صلاحية الجلسة — سجّل الدخول مرة أخرى من صفحة مزامنة الأجهزة.";
    }else{
      syncState.error = describeSyncError(e);
    }
    renderSyncStatusIfVisible();
    flushQueuedPush();
  });
}
/* لو اتأجّل رفع أثناء رفع سابق شغّال، ده بيبعته فور ما الحالي يخلص —
   بيستخدم أحدث نسخة من DB لحظة التنفيذ (مش النسخة وقت الطلب الأصلي) */
function flushQueuedPush(){
  if(!syncState.pushQueued) return;
  syncState.pushQueued = false;
  const wasForce = !!syncState.pushQueuedForce;
  syncState.pushQueuedForce = false;
  pushToCloud(wasForce);
}

/* ======================================================================
   حسابات دفترية (Ledger math)
   ====================================================================== */
function computeBalances(entries){
  const map = {};
  DB.accounts.forEach(a => map[a.id] = {debit:0, credit:0});
  entries.forEach(e => {
    e.lines.forEach(l => {
      if(!map[l.accountId]) map[l.accountId] = {debit:0, credit:0};
      map[l.accountId].debit += Number(l.debit)||0;
      map[l.accountId].credit += Number(l.credit)||0;
    });
  });
  return map;
}
function netSide(bal){
  const net = bal.debit - bal.credit;
  return net >= 0 ? {debit:net, credit:0} : {debit:0, credit:-net};
}
function trialBalanceFrom(balMap){
  return DB.accounts.map(a => {
    const bal = balMap[a.id] || {debit:0, credit:0};
    const side = netSide(bal);
    return { account:a, debit:side.debit, credit:side.credit, rawDebit:bal.debit, rawCredit:bal.credit };
  });
}
function incomeStatementFrom(balMap){
  const revenues = DB.accounts.filter(a=>a.type==="revenue").map(a=>{
    const b = balMap[a.id]||{debit:0,credit:0};
    return {account:a, amount: b.credit - b.debit};
  });
  const expenses = DB.accounts.filter(a=>a.type==="expense").map(a=>{
    const b = balMap[a.id]||{debit:0,credit:0};
    return {account:a, amount: b.debit - b.credit};
  });
  const totalRevenue = revenues.reduce((s,r)=>s+r.amount,0);
  const totalExpense = expenses.reduce((s,r)=>s+r.amount,0);
  return {revenues, expenses, totalRevenue, totalExpense, netIncome: totalRevenue-totalExpense};
}
function groupBySubType(rows, type){
  return (SUBTYPES[type]||[]).map(st => {
    const items = rows.filter(r => r.subType === st.id);
    return { id:st.id, label:st.label, items, total: items.reduce((s,r)=>s+r.amount,0) };
  }).filter(g => g.items.length > 0);
}
function balanceSheetFrom(balMap, netIncome){
  const assets = DB.accounts.filter(a=>a.type==="asset").map(a=>{
    const b = balMap[a.id]||{debit:0,credit:0};
    const amount = a.normal==="debit" ? b.debit-b.credit : b.credit-b.debit;
    return {account:a, amount, subType:accSubType(a)};
  });
  const liabilities = DB.accounts.filter(a=>a.type==="liability").map(a=>{
    const b = balMap[a.id]||{debit:0,credit:0};
    return {account:a, amount: b.credit-b.debit, subType:accSubType(a)};
  });
  const equity = DB.accounts.filter(a=>a.type==="equity").map(a=>{
    const b = balMap[a.id]||{debit:0,credit:0};
    const amount = a.normal==="credit" ? (b.credit-b.debit) : -(b.debit-b.credit);
    return {account:a, amount, subType:accSubType(a)};
  });
  const totalAssets = assets.reduce((s,r)=>s+r.amount,0);
  const totalLiabilities = liabilities.reduce((s,r)=>s+r.amount,0);
  const totalEquityBase = equity.reduce((s,r)=>s+r.amount,0);
  const totalEquity = totalEquityBase + netIncome;
  const assetGroups = groupBySubType(assets, "asset");
  const liabilityGroups = groupBySubType(liabilities, "liability");
  return {assets, liabilities, equity, totalAssets, totalLiabilities, totalEquity, netIncome, assetGroups, liabilityGroups};
}
function ledgerForAccount(accountId, includeAdjustments){
  const acc = DB.accounts.find(a=>a.id===accountId);
  const list = DB.entries
    .filter(e => includeAdjustments ? true : !e.isAdjustment)
    .filter(e => e.lines.some(l=>l.accountId===accountId))
    .slice()
    .sort((x,y)=> x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
  let running = 0;
  const rows = [];
  list.forEach(e=>{
    e.lines.filter(l=>l.accountId===accountId).forEach(l=>{
      const d = Number(l.debit)||0, c = Number(l.credit)||0;
      running += (acc && acc.normal==="credit") ? (c-d) : (d-c);
      rows.push({entry:e, debit:d, credit:c, running});
    });
  });
  return rows;
}
function computeMath(){
  const regular = DB.entries.filter(e=>!e.isAdjustment);
  const all = DB.entries;
  const preBal = computeBalances(regular);
  const postBal = computeBalances(all);
  const trialPre = trialBalanceFrom(preBal);
  const trialPost = trialBalanceFrom(postBal);
  const incomePost = incomeStatementFrom(postBal);
  const bsPost = balanceSheetFrom(postBal, incomePost.netIncome);
  return {trialPre, trialPost, incomePost, bsPost};
}

/* بناء قيد يومية تلقائي لعملية بيع/شراء */
function buildRegisterLines(record, isSales){
  const amount = (Number(record.quantity)||0) * (Number(record.unitPrice)||0);
  const paid = Number(record.paid)||0;
  const remain = Math.max(amount-paid, 0);
  const lines = [];
  if(isSales){
    if(paid>0 && record.paymentAccountId) lines.push({accountId:record.paymentAccountId, debit:paid, credit:0});
    if(remain>0 && record.deferredAccountId) lines.push({accountId:record.deferredAccountId, debit:remain, credit:0});
    if(amount>0 && record.mainAccountId) lines.push({accountId:record.mainAccountId, debit:0, credit:amount});
  }else{
    if(amount>0 && record.mainAccountId) lines.push({accountId:record.mainAccountId, debit:amount, credit:0});
    if(paid>0 && record.paymentAccountId) lines.push({accountId:record.paymentAccountId, debit:0, credit:paid});
    if(remain>0 && record.deferredAccountId) lines.push({accountId:record.deferredAccountId, debit:0, credit:remain});
  }
  return lines;
}

/* ======================================================================
   تكلفة البضاعة المباعة (COGS) — تُحسب تلقائيًا من دفعات الشراء
   بطريقة أول وارد أول صادر (FIFO) لكل حساب مخزون على حدة، ثم يُنشأ
   قيد يومية تلقائي (مدين: تكلفة البضاعة المباعة 510 / دائن: حساب المخزون)
   لكل عملية بيع مرتبطة بحساب مخزون.
   ====================================================================== */
/* حسابات المخزون: أي حساب "أصول" استُخدم كحساب رئيسي في عملية شراء */
function getInventoryAccounts(){
  const ids = new Set(DB.purchases.map(p=>p.mainAccountId).filter(Boolean));
  return DB.accounts.filter(a=> ids.has(a.id) && a.type==="asset");
}
function recomputeCOGS(){
  /* امسح كل قيود تكلفة البضاعة المباعة القديمة تمهيدًا لإعادة بنائها من الصفر */
  DB.entries = DB.entries.filter(e => !(e.autoGenerated && e.sourceType==="cogs"));

  /* كل حسابات المخزون التي ظهرت في المشتريات أو ارتبطت بعمليات بيع */
  const accIds = new Set();
  DB.purchases.forEach(p=>{ if(p.mainAccountId) accIds.add(p.mainAccountId); });
  DB.sales.forEach(s=>{ if(s.inventoryAccountId) accIds.add(s.inventoryAccountId); });

  DB.sales.forEach(s=>{ s.cogsAmount = 0; s.cogsQuantity = 0; s.cogsShortfall = 0; });

  const byDateThenId = (a,b) => a.date===b.date ? (a.id<b.id?-1:1) : (a.date<b.date?-1:1);

  accIds.forEach(accId=>{
    const acc = DB.accounts.find(a=>a.id===accId);
    if(!acc || acc.type!=="asset") return; /* التكلفة التلقائية تخص حسابات المخزون (أصول) فقط */

    /* دفعات الشراء المرتبطة بهذا الحساب، مرتبة من الأقدم (أول وارد) */
    const batches = DB.purchases
      .filter(p=>p.mainAccountId===accId)
      .slice().sort(byDateThenId)
      .map(p=>({ remaining: Number(p.quantity)||0, unitCost: Number(p.unitPrice)||0 }));

    /* عمليات البيع المرتبطة بنفس حساب المخزون، تُسحب بنفس ترتيب الشراء (أول صادر) */
    const salesForAcc = DB.sales.filter(s=>s.inventoryAccountId===accId).slice().sort(byDateThenId);

    salesForAcc.forEach(sale=>{
      let need = Number(sale.quantity)||0;
      let cost = 0, drawn = 0;
      for(const batch of batches){
        if(need<=0) break;
        if(batch.remaining<=0) continue;
        const take = Math.min(batch.remaining, need);
        cost += take*batch.unitCost;
        batch.remaining -= take;
        need -= take;
        drawn += take;
      }
      sale.cogsAmount = Math.round(cost*100)/100;
      sale.cogsQuantity = Math.round(drawn*1000)/1000;
      sale.cogsShortfall = Math.round(need*1000)/1000; /* كمية مُباعة تفوق الرصيد المسجل فعليًا في المخزون */
    });
  });

  /* إنشاء قيد يومية تلقائي لكل عملية بيع لها تكلفة محسوبة */
  DB.sales.forEach(sale=>{
    const cost = Number(sale.cogsAmount)||0;
    if(cost<=0 || !sale.inventoryAccountId) return;
    const cogsAcc = ensureAccount("50010","تكلفة البضاعة المباعة","expense","operating","debit");
    pushEntry({
      id: uid("e"),
      date: sale.date,
      description: "تكلفة بضاعة مباعة" + (sale.description ? " - "+sale.description : ""),
      isAdjustment: false,
      autoGenerated: true,
      sourceType: "cogs",
      sourceId: sale.id,
      lines: [
        {accountId: cogsAcc.id, debit: cost, credit: 0},
        {accountId: sale.inventoryAccountId, debit: 0, credit: cost},
      ],
    });
  });
}
/* إنشاء حساب تلقائيًا إذا لم يكن موجودًا (يُستخدم في ترحيل عهدة/أجور/سلف السائقين والمساعدين) */
function ensureAccount(code, name, type, subType, normal){
  let acc = DB.accounts.find(a=>a.code===code);
  if(!acc){
    acc = {id:uid("a"), code, name, type, normal, subType};
    DB.accounts.push(acc);
  }
  return acc;
}
function defaultCashAccountId(preferredId){
  if(preferredId && DB.accounts.some(a=>a.id===preferredId)) return preferredId;
  const cash = DB.accounts.find(a=>a.code==="10001") || DB.accounts.find(a=>a.type==="asset" && a.normal==="debit");
  return cash ? cash.id : "";
}
/* ---- ترحيل محاسبي تلقائي لسجلات عهدة السائقين ---- */
function upsertCustodyEntry(record){
  removeCustodyEntry(record.id);
  const custodyAmount = Number(record.custodyAmount)||0;
  const commission = Number(record.commission)||0;
  const expenses = Number(record.expenses)||0;
  if(custodyAmount<=0 && commission<=0 && expenses<=0) return;
  const custodyAcc = ensureAccount("10007","عهدة السائقين تحت التسوية","asset","current","debit");
  const payableAcc = ensureAccount("20004","مستحق للسائقين والمساعدين","liability","current","credit");
  const commissionAcc = ensureAccount("50007","عمولات السائقين والمساعدين","expense","operating","debit");
  const expenseAcc = ensureAccount("50009","مصروفات نقلات ورحلات السائقين","expense","operating","debit");
  const cashAccId = defaultCashAccountId(record.paymentAccountId);
  const remaining = custodyAmount - commission - expenses;
  const lines = [];
  if(expenses>0) lines.push({accountId:expenseAcc.id, debit:expenses, credit:0});
  if(commission>0) lines.push({accountId:commissionAcc.id, debit:commission, credit:0});
  if(custodyAmount>0 && cashAccId) lines.push({accountId:cashAccId, debit:0, credit:custodyAmount});
  if(remaining>0) lines.push({accountId:custodyAcc.id, debit:remaining, credit:0});
  else if(remaining<0) lines.push({accountId:payableAcc.id, debit:0, credit:-remaining});
  if(lines.length===0) return;
  const driver = DB.drivers.find(d=>d.id===record.driverId);
  pushEntry({
    id:uid("e"), date:record.tripDate||record.departDate||todayISO(),
    description:"عهدة سائق: "+(driver?driver.name:"")+(record.description?" - "+record.description:""),
    isAdjustment:false, autoGenerated:true, sourceType:"custody", sourceId:record.id,
    lines: lines,
  });
}
function removeCustodyEntry(recordId){
  DB.entries = DB.entries.filter(e=>!(e.autoGenerated && e.sourceType==="custody" && e.sourceId===recordId));
}
/* ---- ترحيل محاسبي تلقائي لأجور أيام عمل السائقين/المساعدين ---- */
function upsertWorkDaysEntry(record, kind){
  removeWorkDaysEntry(record.id);
  const stats = computeWorkDaysStats(record);
  if(!stats.totalWage) return;
  const wageAcc = ensureAccount("50008","أجور السائقين والمساعدين","expense","operating","debit");
  const payableAcc = ensureAccount("20004","مستحق للسائقين والمساعدين","liability","current","credit");
  const amt = Math.abs(stats.totalWage);
  const lines = stats.totalWage>0
    ? [{accountId:wageAcc.id, debit:amt, credit:0},{accountId:payableAcc.id, debit:0, credit:amt}]
    : [{accountId:payableAcc.id, debit:amt, credit:0},{accountId:wageAcc.id, debit:0, credit:amt}];
  const isDriver = kind==="driver";
  const person = DB[isDriver?"drivers":"helpers"].find(p=>p.id===record[isDriver?"driverId":"helperId"]);
  pushEntry({
    id:uid("e"), date:record.returnDate||record.departDate||todayISO(),
    description:"أجر "+(isDriver?"سائق":"مساعد")+": "+(person?person.name:""),
    isAdjustment:false, autoGenerated:true, sourceType:"workDays", sourceId:record.id,
    lines: lines,
  });
}
function removeWorkDaysEntry(recordId){
  DB.entries = DB.entries.filter(e=>!(e.autoGenerated && e.sourceType==="workDays" && e.sourceId===recordId));
}
/* ---- ترحيل محاسبي تلقائي لسلف ومسحوبات السائقين/المساعدين ---- */
function upsertAdvanceEntry(record){
  removeAdvanceEntry(record.id);
  const amount = Number(record.amount)||0;
  if(amount<=0) return;
  const advanceAcc = ensureAccount("10008","سلف العاملين (سائقين ومساعدين)","asset","current","debit");
  const cashAccId = defaultCashAccountId(record.paymentAccountId);
  if(!cashAccId) return;
  pushEntry({
    id:uid("e"), date:record.date,
    description:(record.type==="withdrawal"?"مسحوبات":"سلفة")+" - "+(record.description||""),
    isAdjustment:false, autoGenerated:true, sourceType:"advance", sourceId:record.id,
    lines: [{accountId:advanceAcc.id, debit:amount, credit:0},{accountId:cashAccId, debit:0, credit:amount}],
  });
}
function removeAdvanceEntry(recordId){

function moveAccountOrder(id, direction){
  if(!canEditTab("accounts")){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  const acc = DB.accounts.find(a=>a.id===id);
  if(!acc) return;
  const group = DB.accounts.filter(a=> a.type===acc.type && accSubType(a)===accSubType(acc))
    .slice().sort((a,b)=> (Number(a.sortOrder)||0)-(Number(b.sortOrder)||0));
  group.forEach((a,i)=>{ a.sortOrder = i; });
  const idx = group.findIndex(a=>a.id===id);
  const swapIdx = idx + direction;
  if(idx<0 || swapIdx<0 || swapIdx>=group.length) return;
  const tmp = group[idx].sortOrder;
  group[idx].sortOrder = group[swapIdx].sortOrder;
  group[swapIdx].sortOrder = tmp;
  saveDB(); render();
}

function saveAccountForm(){
  if(!canEditTab("accounts")){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  const code = byId("af-code").value.trim();
  const name = byId("af-name").value.trim();

  const normal = byId("af-normal").value;
  const subType = byId("af-subtype").value;
  if(!code || !name){ alert("الرجاء إدخال الكود والاسم"); return; }
  if(ui.accountForm.id){
    const acc = DB.accounts.find(a=>a.id===ui.accountForm.id);
    Object.assign(acc, {code,name,type,normal,subType});
    logActivity("تعديل حساب", code+" - "+name);
  }else{
    DB.accounts.push({id:uid("a"), code, name, type, normal, subType});
    logActivity("إضافة حساب", code+" - "+name);
  }

function deleteAccount(id){
  if(!canEditTab("accounts")){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  const accCheck = DB.accounts.find(a=>a.id===id);
  if(accCheck && accCheck.partyKind && accCheck.partyId){
    const kindLabel = (PARTY_ACCOUNT_META[accCheck.partyKind]||{}).prefixLabel || "جهة";
    alert("⛔ هذا حساب فرعي تلقائي مرتبط بـ"+kindLabel+" — لحذفه احذف الجهة نفسها من صفحتها (عملاء/موردون/سائقون/مساعدون) بدلاً من حذفه من هنا.");
    return;
  }
  const used = DB.entries.some(e => e.lines.some(l=>l.accountId===id));
  if(used){ alert("لا يمكن حذف هذا الحساب لوجود قيود مرتبطة به."); return; }
  const acc = DB.accounts.find(a=>a.id===id);
  if(!confirm("هل أنت متأكد من حذف هذا الحساب؟")) return;
  if(acc) moveToTrash("accounts", acc, acc.code+" - "+acc.name);
  DB.accounts = DB.accounts.filter(a=>a.id!==id);
  logActivity("حذف حساب", acc?(acc.code+" - "+acc.name):"");
  saveDB(); render();
}

function entryAddLine(){

}
function entryRemoveLine(i){
  syncEntryFormFromDOM();

function onEntryDebitInput(i, el){
  if(el.value){
    const row = el.closest(".entry-line-row");
    const c = row.querySelector(".line-cred");
    c.value = "";
  }
  entryLineChanged();
}
function onEntryCreditInput(i, el){
  if(el.value){
    const row = el.closest(".entry-line-row");
    const d = row.querySelector(".line-deb");
    d.value = "";
  }
  entryLineChanged();
}
function entryLineChanged(){
  let totalDebit=0, totalCredit=0;
  document.querySelectorAll(".entry-line-row").forEach(row=>{
    totalDebit += Number(row.querySelector(".line-deb").value)||0;
    totalCredit += Number(row.querySelector(".line-cred").value)||0;
  });
  const balanced = Math.abs(totalDebit-totalCredit)<0.005 && totalDebit>0;
  const totalsEl = byId("entry-totals");
  if(totalsEl){
    totalsEl.style.color = balanced ? "#059669" : "#e11d48";
    totalsEl.textContent = "مدين: "+money(totalDebit)+" — دائن: "+money(totalCredit);
  }
  const btn = byId("entry-save-btn");
  if(btn) btn.disabled = !balanced;
}
function saveEntryForm(){
  if(!canEditTab(ui.tab)){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  syncEntryFormFromDOM();
  const f = ui.entryForm;
  const totalDebit = f.lines.reduce((s,l)=>s+(Number(l.debit)||0),0);
  const totalCredit = f.lines.reduce((s,l)=>s+(Number(l.credit)||0),0);
  if(!(Math.abs(totalDebit-totalCredit)<0.005 && totalDebit>0)){ alert("القيد غير متوازن"); return; }
  if(checkPeriodLock(f.date, "حفظ هذا القيد")) return;
  const cleanLines = f.lines.filter(l=>l.accountId && (Number(l.debit)||Number(l.credit)));
  if(f.id){
    const idx = DB.entries.findIndex(e=>e.id===f.id);
    DB.entries[idx] = Object.assign({}, DB.entries[idx], {date:f.date, description:f.description, lines:cleanLines, attachment:f.attachment||null});
    logActivity(f.isAdjustment?"تعديل قيد تسوية":"تعديل قيد يومية", f.description||"");
  }else{
    pushEntry({id:uid("e"), date:f.date, description:f.description, lines:cleanLines, isAdjustment:f.isAdjustment, attachment:f.attachment||null});
    logActivity(f.isAdjustment?"إضافة قيد تسوية":"إضافة قيد يومية", f.description||"");
  }
  ui.entryForm = null;
  saveDB(); render();
}
function deleteEntry(id){
  if(!canEditTab(ui.tab)){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  const e = DB.entries.find(x=>x.id===id);
  if(e && checkPeriodLock(e.date, "حذف هذا القيد")) return;
  if(!confirm("هل تريد حذف هذا القيد؟")) return;
  if(e) moveToTrash("entries", e, fmtDate(e.date)+" — "+(e.description||""));
  DB.entries = DB.entries.filter(e=>e.id!==id);
  logActivity(e&&e.isAdjustment?"حذف قيد تسوية":"حذف قيد يومية", e?(e.description||""):"");
  saveDB(); render();
}

function incomeStatementForRange(fromDate, toDate){
  const entries = DB.entries.filter(e => (!fromDate || e.date>=fromDate) && (!toDate || e.date<=toDate));
  return incomeStatementFrom(computeBalances(entries));
}
function shiftDateByDays(dateStr, days){ return addDays(dateStr, days); }
function shiftYears(dateStr, delta){
  const d = new Date((dateStr||todayISO())+"T00:00:00");
  d.setFullYear(d.getFullYear()+delta);
  return d.toISOString().slice(0,10);
}
function amtCompareHtml(current, prev, hasCompare){
  if(!hasCompare) return '<span class="num">'+money(current)+'</span>';
  const diff = current - prev;
  const pct = Math.abs(prev)>0.001 ? Math.round((diff/Math.abs(prev))*100) : (Math.abs(current)>0.001?100:0);
  return '<span class="num">'+money(current)+
    ' <span style="font-size:10px; color:'+(diff>=0?"#059669":"#e11d48")+';">('+(diff>=0?"+":"")+pct+'%)</span>' +
    '<br/><span style="font-size:10px; color:var(--stone-400);">سابقًا: '+money(prev)+'</span></span>';
}
function renderIncome(){
  ui.incomeFrom = ui.incomeFrom || (todayISO().slice(0,4)+"-01-01");
  ui.incomeTo = ui.incomeTo || todayISO();
  ui.incomeCompare = ui.incomeCompare || false;

  const inc = incomeStatementForRange(ui.incomeFrom, ui.incomeTo);
  let prevInc = null, prevLabel = "";
  if(ui.incomeCompare){
    const spanDays = daysBetween(ui.incomeFrom, ui.incomeTo);
    const prevTo = shiftDateByDays(ui.incomeFrom, -1);
    const prevFrom = shiftDateByDays(prevTo, -spanDays);
    prevInc = incomeStatementForRange(prevFrom, prevTo);
    prevLabel = fmtDate(prevFrom)+" — "+fmtDate(prevTo);
  }

  let html = sectionHead("📈","قائمة الدخل","الإيرادات والمصروفات وصافي نتيجة النشاط عن الفترة المحددة");
  html += '<div style="display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin-bottom:14px;">' +
    '<div style="width:150px;"><label class="f-label">من تاريخ</label><input class="f-input" type="date" value="'+esc(ui.incomeFrom)+'" onchange="ui.incomeFrom=this.value; render();"/></div>' +
    '<div style="width:150px;"><label class="f-label">إلى تاريخ</label><input class="f-input" type="date" value="'+esc(ui.incomeTo)+'" onchange="ui.incomeTo=this.value; render();"/></div>' +
    '<label style="display:flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer; padding-bottom:9px;"><input type="checkbox" '+(ui.incomeCompare?"checked":"")+' onchange="ui.incomeCompare=this.checked; render();"/> قارن بالفترة السابقة المماثلة</label>' +
  '</div>';

  function rowHtml(label, amount, prevAmount){
    let variance = "";
    if(prevInc){
      const diff = amount-prevAmount;
      const pct = prevAmount!==0 ? Math.round((diff/Math.abs(prevAmount))*100) : (amount!==0?100:0);
      variance = '<span class="num" style="font-size:11px; color:'+(diff>=0?"#059669":"#e11d48")+'; margin-inline-start:8px;">('+(diff>=0?"+":"")+pct+'%)</span>';
    }
    return '<div class="balance-row"><span>'+esc(label)+'</span><span class="num">'+money(amount)+variance+(prevInc?' <span style="color:var(--stone-400); font-size:11px;"> — سابقًا: '+money(prevAmount)+'</span>':'')+'</span></div>';
  }

  html += '<div class="balance-box">';
  html += '<div style="font-size:13px; font-weight:800; color:var(--charcoal2); margin-bottom:6px;">الإيرادات</div>';
  inc.revenues.forEach((r,i) => html += rowHtml(r.account.name, r.amount, prevInc?prevInc.revenues[i].amount:0));
  html += rowHtml("إجمالي الإيرادات", inc.totalRevenue, prevInc?prevInc.totalRevenue:0).replace('balance-row', 'balance-row total');

  html += '<div style="font-size:13px; font-weight:800; color:var(--charcoal2); margin:18px 0 6px;">المصروفات</div>';
  inc.expenses.forEach((r,i) => html += rowHtml(r.account.name, r.amount, prevInc?prevInc.expenses[i].amount:0));
  html += rowHtml("إجمالي المصروفات", inc.totalExpense, prevInc?prevInc.totalExpense:0).replace('balance-row', 'balance-row total');

  const color = inc.netIncome>=0 ? "var(--emerald-700)" : "var(--rose-600)";
  html += '<div class="balance-row grand" style="color:'+color+';"><span>'+(inc.netIncome>=0?"صافي الربح":"صافي الخسارة")+'</span><span class="num">'+money(Math.abs(inc.netIncome))+(prevInc?' <span style="color:var(--stone-400); font-size:11px;"> — سابقًا ('+prevLabel+'): '+money(Math.abs(prevInc.netIncome))+'</span>':'')+'</span></div>';
  html += '</div>';
  html += renderYearEndClosingPanel();
  return html;
}
function renderYearEndClosingPanel(){
  if(!can("resetData")) return "";
  return '<div class="form-panel" style="max-width:560px; margin-top:16px;">' +
    '<div style="font-weight:800; font-size:13px; margin-bottom:8px;">🔒 إقفال السنة المالية</div>' +
    '<div style="font-size:12px; color:var(--stone-500); line-height:1.9; margin-bottom:10px;">يُنشئ قيد إقفال يصفّر كل حسابات الإيرادات والمصروفات (حتى التاريخ المحدد) وينقل صافي الربح أو الخسارة إلى حساب "أرباح مرحلة" ضمن حقوق الملكية — خطوة معتادة في نهاية كل سنة مالية.</div>' +
    '<div class="form-grid cols-3">' +
      '<div><label class="f-label">حتى تاريخ</label><input class="f-input" type="date" id="year-close-date" value="'+esc(todayISO())+'"/></div>' +
    '</div>' +
    '<div class="form-actions"><button class="btn btn-primary" onclick="performYearEndClosing()">🔒 ترحيل قيد الإقفال</button></div>' +
  '</div>';
}
function performYearEndClosing(){
  if(!can("resetData")){ alert("متاح لمدير النظام فقط."); return; }
  const closingDate = byId("year-close-date").value;
  if(!closingDate){ alert("اختر تاريخًا"); return; }
  const balMap = computeBalances(DB.entries.filter(e=>e.date<=closingDate));
  const revenueAccounts = DB.accounts.filter(a=>a.type==="revenue");
  const expenseAccounts = DB.accounts.filter(a=>a.type==="expense");
  const lines = [];
  let totalRev=0, totalExp=0;
  revenueAccounts.forEach(a=>{
    const b = balMap[a.id]||{debit:0,credit:0};
    const bal = b.credit-b.debit;
    if(Math.abs(bal)>0.001){ lines.push({accountId:a.id, debit: bal>0?bal:0, credit: bal<0?-bal:0}); totalRev += bal; }
  });
  expenseAccounts.forEach(a=>{
    const b = balMap[a.id]||{debit:0,credit:0};
    const bal = b.debit-b.credit;
    if(Math.abs(bal)>0.001){ lines.push({accountId:a.id, debit: bal<0?-bal:0, credit: bal>0?bal:0}); totalExp += bal; }
  });
  if(lines.length===0){ alert("لا توجد أرصدة إيرادات أو مصروفات لإقفالها حتى هذا التاريخ."); return; }
  const netIncome = totalRev - totalExp;
  const retainedAcc = DB.accounts.find(a=>a.code==="30002") || ensureAccount("30002","أرباح مرحلة","equity","capital","credit");
  lines.push({accountId:retainedAcc.id, debit: netIncome<0?-netIncome:0, credit: netIncome>0?netIncome:0});
  if(!confirm('سيتم ترحيل قيد إقفال يصفّر حسابات الإيرادات والمصروفات وينقل صافي '+(netIncome>=0?"الربح":"الخسارة")+' ('+money(Math.abs(netIncome))+' ج.م) إلى "أرباح مرحلة"، بتاريخ '+fmtDate(closingDate)+'. متابعة؟')) return;
  pushEntry({id:uid("e"), date:closingDate, description:"قيد إقفال السنة المالية حتى "+fmtDate(closingDate), isAdjustment:true, autoGenerated:false, lines:lines});
  logActivity("إقفال سنة مالية", "حتى "+fmtDate(closingDate)+" — صافي "+(netIncome>=0?"ربح":"خسارة")+": "+money(Math.abs(netIncome)));
  saveDB(); render();
  if(confirm("✔ تم ترحيل قيد الإقفال بنجاح. هل تريد قفل الفترة المحاسبية حتى هذا التاريخ الآن لمنع أي تعديل عليها؟")){
    DB.periodLockDate = closingDate;
    logActivity("قفل فترة محاسبية", "حتى "+fmtDate(closingDate)+" (بعد الإقفال)");
    saveDB(); render();
  }
}

  html += '<div class="balance-row total"><span>إجمالي الخصوم</span><span class="num">'+money(bs.totalLiabilities)+'</span></div>';

  html += '<div style="font-size:13px; font-weight:800; color:var(--charcoal2); margin:18px 0 6px;">حقوق الملكية</div>';

  html += '<div class="balance-row"><span>صافي ربح الفترة</span><span class="num">'+money(bs.netIncome)+'</span></div>';
  html += '<div class="balance-row total"><span>إجمالي الخصوم وحقوق الملكية</span><span class="num">'+money(bs.totalLiabilities+bs.totalEquity)+'</span></div>';
