  html += '</div>';

  if(Math.abs(bs.totalAssets-(bs.totalLiabilities+bs.totalEquity)) > 0.001){
    html += '<div class="alert alert-danger">⚠️ القائمة غير متوازنة — راجع القيود.</div>';
  }
  html += '<style>@media(min-width:760px){.bs-grid{grid-template-columns:1fr 1fr !important;}}</style>';
  return html;
}

/* ======================================================================
   7ب) أدوات مشتركة لحساب الأرصدة "كما في تاريخ معيّن" ولحساب صافي
   الربح الفعلي لأي فترة (تُستخدم في قائمتي التدفقات النقدية والتغير
   في حقوق الملكية) — تتعامل بشكل صحيح مع قيود إقفال السنة المالية
   ====================================================================== */
function addDays(dateStr, delta){
  const d = new Date((dateStr||todayISO())+"T00:00:00");
  d.setDate(d.getDate()+delta);
  return d.toISOString().slice(0,10);
}
/* صافي الربح/الخسارة المتراكم من كل العمليات (بما فيها قيود الإقفال) حتى تاريخ معيّن */
function netIncomeAsOfDate(asOfDate){
  const bal = computeBalances(DB.entries.filter(e=>e.date<=asOfDate));
  return incomeStatementFrom(bal).netIncome;
}
/* إجمالي الأرباح "المكتسبة" حتى تاريخ معيّن، سواء كانت مُقفلة إلى الأرباح المرحلة
   أو ما زالت قائمة في حسابات الإيرادات/المصروفات — يبقى ثابتًا بغض النظر عن توقيت الإقفال */
function cumulativeEarningsAsOfDate(asOfDate){
  const retAcc = DB.accounts.find(a=>a.code==="30002");
  const retBal = retAcc ? bookBalanceAsOf(retAcc.id, asOfDate) : 0;
  return retBal + netIncomeAsOfDate(asOfDate);
}
/* صافي ربح/خسارة الفترة [from..to] بالضبط، بمعزل عن وجود أو توقيت أي قيد إقفال داخل الفترة */
function netIncomeForPeriod(fromDate, toDate){
  return cumulativeEarningsAsOfDate(toDate) - cumulativeEarningsAsOfDate(addDays(fromDate,-1));
}
/* حسابات النقدية (الصندوق والبنك وأي حساب بنكي إضافي) */
function cashLikeAccounts(){
  return DB.accounts.filter(a=> a.type==="asset" && (a.code==="10001" || a.code==="10002" || /نقد|بنك|صندوق/.test(a.name)));
}

/* ======================================================================
   7ج) قائمة التدفقات النقدية (بالطريقة غير المباشرة)
   تصنيف الحسابات: المتداول (غير النقدية) ← تشغيلي، غير المتداول من
   الأصول ← استثماري، غير المتداول من الخصوم وحقوق الملكية (عدا الأرباح
   المرحلة، لأنها مندمجة أصلاً في صافي الربح) ← تمويلي.
   ====================================================================== */
function cashFlowStatementFrom(fromDate, toDate){
  const prevDate = addDays(fromDate, -1);
  const cashIds = new Set(cashLikeAccounts().map(a=>a.id));

  const netIncome = netIncomeForPeriod(fromDate, toDate);

  /* الإهلاك: مصروف غير نقدي — نضيفه مرة أخرى عبر التغير في مجمع الإهلاك (حساب دائن مقابل) */
  let depreciationAddBack = 0;
  DB.accounts.filter(a=>a.type==="asset" && a.normal==="credit").forEach(a=>{
    depreciationAddBack += bookBalanceAsOf(a.id, toDate) - bookBalanceAsOf(a.id, prevDate);
  });

  const workingCapitalRows = [];
  DB.accounts.filter(a=> a.type==="asset" && accSubType(a)==="current" && !cashIds.has(a.id)).forEach(a=>{
    const delta = bookBalanceAsOf(a.id, toDate) - bookBalanceAsOf(a.id, prevDate);
    if(Math.abs(delta) > 0.001) workingCapitalRows.push({account:a, delta, cashEffect:-delta});
  });
  DB.accounts.filter(a=> a.type==="liability" && accSubType(a)==="current").forEach(a=>{
    const delta = bookBalanceAsOf(a.id, toDate) - bookBalanceAsOf(a.id, prevDate);
    if(Math.abs(delta) > 0.001) workingCapitalRows.push({account:a, delta, cashEffect:delta});
  });
  const workingCapitalTotal = workingCapitalRows.reduce((s,r)=>s+r.cashEffect,0);
  const operatingCF = netIncome + depreciationAddBack + workingCapitalTotal;

  const investingRows = [];
  DB.accounts.filter(a=> a.type==="asset" && accSubType(a)==="non_current" && a.normal==="debit").forEach(a=>{
    const delta = bookBalanceAsOf(a.id, toDate) - bookBalanceAsOf(a.id, prevDate);
    if(Math.abs(delta) > 0.001) investingRows.push({account:a, delta, cashEffect:-delta});
  });
  const investingCF = investingRows.reduce((s,r)=>s+r.cashEffect,0);

  const financingRows = [];
  DB.accounts.filter(a=> a.type==="liability" && accSubType(a)==="non_current").forEach(a=>{
    const delta = bookBalanceAsOf(a.id, toDate) - bookBalanceAsOf(a.id, prevDate);
    if(Math.abs(delta) > 0.001) financingRows.push({account:a, delta, cashEffect:delta});
  });
  DB.accounts.filter(a=> a.type==="equity" && a.code!=="30002").forEach(a=>{
    const delta = bookBalanceAsOf(a.id, toDate) - bookBalanceAsOf(a.id, prevDate);
    if(Math.abs(delta) > 0.001){
      const cashEffect = a.normal==="credit" ? delta : -delta;
      financingRows.push({account:a, delta, cashEffect});
    }
  });
  const financingCF = financingRows.reduce((s,r)=>s+r.cashEffect,0);

  const netChangeInCash = operatingCF + investingCF + financingCF;
  const cashBegin = cashLikeAccounts().reduce((s,a)=>s+bookBalanceAsOf(a.id, prevDate),0);
  const cashEnd = cashLikeAccounts().reduce((s,a)=>s+bookBalanceAsOf(a.id, toDate),0);

  return {
    fromDate, toDate, netIncome, depreciationAddBack,
    workingCapitalRows, workingCapitalTotal, operatingCF,
    investingRows, investingCF,
    financingRows, financingCF,
    netChangeInCash, cashBegin, cashEnd,
    reconciles: Math.abs((cashBegin+netChangeInCash) - cashEnd) < 0.01,
  };
}

/* ======================================================================
   7د) قائمة التغير في حقوق الملكية
   ====================================================================== */
function equityStatementFrom(fromDate, toDate){
  const prevDate = addDays(fromDate, -1);
  const capAcc = DB.accounts.find(a=>a.code==="30001");
  const drawAcc = DB.accounts.find(a=>a.code==="30003");
  const otherEquity = DB.accounts.filter(a=>a.type==="equity" && a.code!=="30001" && a.code!=="30002" && a.code!=="30003");

  const capBegin = capAcc ? bookBalanceAsOf(capAcc.id, prevDate) : 0;
  const capEnd = capAcc ? bookBalanceAsOf(capAcc.id, toDate) : 0;
  const drawBegin = drawAcc ? bookBalanceAsOf(drawAcc.id, prevDate) : 0;
  const drawEnd = drawAcc ? bookBalanceAsOf(drawAcc.id, toDate) : 0;
  const retainedBegin = cumulativeEarningsAsOfDate(prevDate);
  const retainedEnd = cumulativeEarningsAsOfDate(toDate);
  const periodNetIncome = retainedEnd - retainedBegin;

  const otherRows = otherEquity.map(a=>{
    const begin = bookBalanceAsOf(a.id, prevDate);
    const end = bookBalanceAsOf(a.id, toDate);
    return {account:a, begin, end, movement:end-begin};
  });
  const otherBeginTotal = otherRows.reduce((s,r)=>s+r.begin,0);
  const otherEndTotal = otherRows.reduce((s,r)=>s+r.end,0);

  const beginTotal = capBegin + retainedBegin - drawBegin + otherBeginTotal;
  const endTotal = capEnd + retainedEnd - drawEnd + otherEndTotal;

  return {
    fromDate, toDate,
    capBegin, capEnd, capMovement: capEnd-capBegin,
    drawBegin, drawEnd, drawMovement: drawEnd-drawBegin,
    retainedBegin, retainedEnd, periodNetIncome,
    otherRows, otherBeginTotal, otherEndTotal,
    beginTotal, endTotal,
    capAccName: capAcc?capAcc.name:"رأس المال",
    drawAccName: drawAcc?drawAcc.name:"مسحوبات صاحب العمل",
  };
}

    '<td class="tleft num">'+amtCompareHtml(eq.endTotal, hasCompare?prevEq.endTotal:0, hasCompare)+'</td></tr>';

  html += '</tbody></table></div>';
  html += '<div class="footer-note">💡 يشمل بند "الأرباح المحتجزة" أي أرباح مرحّلة فعليًا من إقفالات سابقة بالإضافة إلى صافي ربح/خسارة الفترة الحالي (سواء تم ترحيله رسميًا أم لا) — بنفس منطق قائمة المركز المالي، لذلك يجب أن يتطابق "الإجمالي" في نهاية الفترة مع إجمالي حقوق الملكية الظاهر في قائمة المركز المالي عند نفس التاريخ.</div>';

   8) العملاء / الموردون

function partyBalance(kind, partyId){
  const rows = buildStatementRows(kind, partyId);
  return rows.length ? rows[rows.length-1].balance : 0;
}
/* في اتفاقية الأرصدة بالتطبيق: عند العملاء فإن رصيدًا موجبًا (balance>0) يعني أنه
   مدين لنا (مستحق لنا)، بينما عند الموردين فإن رصيدًا موجبًا يعني العكس تمامًا —
   أننا مدينون له (مستحق عليه لنا نحن). هذه الدالة توحّد التفسير: ترجع 'owedToUs' لو
   الطرف مدين لنا، 'weOwe' لو نحن مدينون له، أو 'settled' إذا كان الرصيد صفرًا تقريبًا. */
function partyBalanceDirection(kind, balance){
  if(Math.abs(balance) <= 0.001) return "settled";
  const theyOweUs = kind==="customers" ? balance>0.001 : balance<-0.001;
  return theyOweUs ? "owedToUs" : "weOwe";
}
function partyStatusText(kind, balance, longForm){
  const d = partyBalanceDirection(kind, balance);
  if(d==="settled") return "متسوٍّ";
  if(longForm) return d==="owedToUs" ? "عليه (مستحق منه)" : "له (مستحق له)";
  return d==="owedToUs" ? "عليه" : "له";
}
function partyStatusColor(kind, balance){
  const d = partyBalanceDirection(kind, balance);
  return d==="settled" ? "#059669" : (d==="owedToUs" ? "#e11d48" : "#d97706");
}

    // أما عند الموردين فإن b>0 يعني رصيد دائن للمورد (أي مستحق عليه لنا نحن — نحن مدينون له).
    // لذلك التصنيف بين "المستحق لنا" و"المستحق علينا" يجب أن يُعكس حسب نوع الجهة.

      '<option value="credit" '+(ui.partyBalanceFilter[kind]==="credit"?"selected":"")+'>'+(isCustomers?"له رصيد دائن":"عليه رصيد دائن")+'</option>' +
      '<option value="zero" '+(ui.partyBalanceFilter[kind]==="zero"?"selected":"")+'>لا يوجد رصيد</option>' +
    '</select></div>' +

function resetEntireList(target){
  const tabMap = {customers:"customers", suppliers:"suppliers", drivers:"custody", helpers:"custody", sales:"salesReg", purchases:"purchases"};
  if(!canEditTab(tabMap[target] || target)){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  const labels = {customers:"كل العملاء", suppliers:"كل الموردين", drivers:"كل السائقين", helpers:"كل المساعدين", sales:"كل عمليات البيع", purchases:"كل عمليات الشراء"};
  const label = labels[target] || target;
  const count = (DB[target]||[]).length;
  if(count===0){ alert("القائمة فارغة بالفعل."); return; }
  const confirmWord = "تصفير";
  const typed = prompt("⚠️ تحذير: هذا سيحذف "+label+" ("+count+" سجل) نهائيًا من القائمة الحالية (تُنقَل إلى سلة المحذوفات كدفعة واحدة، ويمكن استرجاع الدفعة بالكامل دفعة واحدة لاحقًا من هناك).\n\nللتأكيد، اكتب كلمة \""+confirmWord+"\" بالضبط:");
  if(typed !== confirmWord){ if(typed!==null) alert("لم تُكتَب الكلمة بشكل صحيح — تم الإلغاء."); return; }

  const kindKey = trashKindForTarget(target);
  const batchId = uid("batch");
  (DB[target]||[]).forEach(rec=>{
    moveToTrash(kindKey, rec, rec.name || (fmtDate(rec.date||todayISO())+" — "+money(rec.amount||0)), batchId);
    if(target==="sales" || target==="purchases") removeRegisterEntry(target, rec.id);
  });
  DB[target] = [];
  logActivity("تصفير قائمة", label);
  showUndoToast(null, batchId, label, count+" سجل");
  saveDB(); render();
}
function trashKindForTarget(target){
  return target; // نفس أسماء المجموعات في DB مطابقة لأسماء أنواع سلة المحذوفات المستخدمة أصلاً
}
function exportPartiesExcel(kind){
  if(!ensureExcelLib()) return;
  const isCustomers = kind==="customers";
  const header = isCustomers
    ? ["الاسم","الهاتف","العنوان","اسم البنك","رقم الحساب البنكي","الحد الائتماني"]
    : ["الاسم","الهاتف","العنوان","اسم البنك","رقم الحساب البنكي"];
  const data = [header];
  DB[kind].forEach(p=>{
    const row = [p.name||"", p.phone||"", p.address||"", p.bankName||"", p.bankAccountNumber||""];
    if(isCustomers) row.push(p.creditLimit||"");
    data.push(row);
  });
  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, isCustomers?"العملاء":"الموردون");
  downloadWorkbook(wb, (isCustomers?"العملاء":"الموردون")+"_"+todayISO()+".xlsx");
}
function importPartiesExcel(event){
  const file = event.target.files[0];
  if(!file) return;
  if(!ensureExcelLib()){ event.target.value = ""; return; }
  const kind = ui.partyImportKind || "customers";
  const isCustomers = kind==="customers";
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:""});
      let added=0, updated=0, skipped=0;
      rows.forEach((row,i)=>{
        if(i===0) return; // تجاهل صف العناوين
        const name = String(row[0]||"").trim();
        if(!name){ skipped++; return; }
        const phone = String(row[1]||"").trim();
        const address = String(row[2]||"").trim();
        const bankName = String(row[3]||"").trim();
        const bankAccountNumber = String(row[4]||"").trim();
        const creditLimit = isCustomers ? String(row[5]||"").trim() : "";
        const existing = DB[kind].find(x=>x.name.trim()===name);
        if(existing){
          Object.assign(existing, {phone, address, bankName, bankAccountNumber});
          if(isCustomers) existing.creditLimit = creditLimit;
          updated++;
        }else{
          const rec = {id:uid("p"), name, phone, address, bankName, bankAccountNumber};
          if(isCustomers) rec.creditLimit = creditLimit;
          DB[kind].push(rec);
          added++;
        }
      });
      logActivity("استيراد "+(isCustomers?"عملاء":"موردين")+" من إكسيل", "إضافة: "+added+" — تحديث: "+updated);
      saveDB(); render();
      alert("تم الاستيراد بنجاح ✅\nإضافة "+added+" جهة جديدة، وتحديث "+updated+" جهة موجودة"+(skipped?("، وتجاهل "+skipped+" صف بدون اسم"):"")+".");
    }catch(err){
      alert("تعذّرت قراءة ملف الإكسيل. تأكد أن الملف بصيغة xlsx/xls صحيحة وبنفس ترتيب الأعمدة الموضح أعلى الجدول.");
    }
    event.target.value = "";
  };
  reader.readAsArrayBuffer(file);
}
function partyTableHtml(kind){
  const q = ui.partySearch[kind] || "";
  const balFilter = ui.partyBalanceFilter[kind] || "all";
  const sortMode = ui.partySort[kind] || "custom";
  const otherKind = kind==="customers" ? "suppliers" : "customers";

  let list = DB[kind].filter(p=>p.name.includes(q));
  if(balFilter!=="all"){
    list = list.filter(p=>{
      const b = partyBalance(kind, p.id);
      if(balFilter==="due") return b>0.001;
      if(balFilter==="credit") return b<-0.001;
      if(balFilter==="zero") return Math.abs(b)<=0.001;
      return true;
    });
  }
  if(sortMode==="name_asc") list = list.slice().sort((a,b)=> a.name.localeCompare(b.name,"ar"));
  else if(sortMode==="name_desc") list = list.slice().sort((a,b)=> b.name.localeCompare(a.name,"ar"));
  else if(sortMode==="balance_desc") list = list.slice().sort((a,b)=> partyBalance(kind,b.id)-partyBalance(kind,a.id));
  else if(sortMode==="balance_asc") list = list.slice().sort((a,b)=> partyBalance(kind,a.id)-partyBalance(kind,b.id));
  else list = list.slice().sort((a,b)=> (Number(a.sortOrder)||0)-(Number(b.sortOrder)||0));

  const isCustom = sortMode==="custom";
  let html = '<div class="table-wrap"><table><thead><tr>'+(isCustom?'<th style="width:56px;">ترتيب</th>':'')+'<th style="width:40px;">#</th><th>الاسم</th><th>الهاتف</th><th>العنوان</th><th class="tleft">الرصيد المستحق</th><th>الربط</th><th class="tleft">إجراءات</th></tr></thead><tbody>';
  if(list.length===0){
    html += '<tr><td colspan="'+(isCustom?8:7)+'"><div class="empty-row">لا توجد بيانات مطابقة</div></td></tr>';
  }
  list.forEach((p,i)=>{
    const bal = partyBalance(kind, p.id);
    const linked = p.linkedPartyId ? DB[otherKind].find(o=>o.id===p.linkedPartyId) : null;
    const hidden = !!p.hiddenFromReports;
    const limit = kind==="customers" ? Number(p.creditLimit)||0 : 0;
    let creditHtml = "";
    if(kind==="customers"){
      if(limit>0){
        const pct = Math.min(100, Math.round((bal/limit)*100));
        const overLimit = bal>limit;
        creditHtml = '<div style="font-size:10px; color:'+(overLimit?"#e11d48":"var(--stone-500)")+'; margin-top:2px;">حد ائتماني: '+money(limit)+(overLimit?' ⚠️ تجاوز':' ('+pct+'%)')+'</div>';
      }
    }
    html += '<tr style="'+(hidden?"opacity:.55;":"")+'">' +
      (isCustom ? '<td class="tleft"><button class="icon-btn" style="padding:2px 6px;" '+(i===0?"disabled":"")+' onclick="movePartyOrder(\''+kind+'\',\''+p.id+'\',-1)" title="تحريك لأعلى">▲</button><button class="icon-btn" style="padding:2px 6px;" '+(i===list.length-1?"disabled":"")+' onclick="movePartyOrder(\''+kind+'\',\''+p.id+'\',1)" title="تحريك لأسفل">▼</button></td>' : '') +
      '<td class="num" style="color:var(--stone-400);">'+(i+1)+'</td>' +
      '<td style="font-weight:600;">'+esc(p.name)+(hidden?' <span style="font-size:10px; color:var(--stone-400);">(مخفي من التقارير)</span>':'')+'</td>' +
      '<td>'+esc(p.phone||"—")+'</td><td>'+esc(p.address||"—")+'</td>' +
      '<td class="tleft num" style="font-weight:700; color:'+(bal>0?"#e11d48":"#059669")+';">'+money(bal)+creditHtml+'</td>' +
      '<td>'+(linked ? '<span class="badge badge-auto">🔗 '+(kind==="customers"?"مورد أيضًا":"عميل أيضًا")+': '+esc(linked.name)+'</span>' : '<span style="color:var(--stone-400); font-size:11px;">—</span>')+'</td>' +
      '<td class="tleft">' +
        '<button class="icon-btn" onclick="goToStatement(\''+kind+'\',\''+p.id+'\')" title="كشف حساب / طباعة">🖨️</button>' +
        '<button class="icon-btn" onclick="openPartyPortalPanel(\''+kind+'\',\''+p.id+'\')" title="بوابة '+(kind==="customers"?"العميل":"المورد")+'">🔗</button>' +
        (kind==="customers" && bal>0.001 ? '<button class="icon-btn" onclick="sendBalanceWhatsApp(\''+p.id+'\')" title="إرسال الرصيد عبر واتساب">📱</button>' : '') +
        (linked
          ? '<button class="icon-btn danger" onclick="unlinkParty(\''+kind+'\',\''+p.id+'\')" title="إلغاء الربط">🔓</button>'
          : '<button class="icon-btn" onclick="linkAsOpposite(\''+kind+'\',\''+p.id+'\')" title="'+(kind==="customers"?"هذا العميل مورد أيضًا":"هذا المورد عميل أيضًا")+'">🔄</button>') +
        '<button class="icon-btn" onclick="togglePartyVisibility(\''+kind+'\',\''+p.id+'\')" title="'+(hidden?"إظهار الرصيد في التقارير المجمّعة":"إخفاء الرصيد من التقارير المجمّعة")+'">'+(hidden?"🙈":"👁️")+'</button>' +
        '<button class="icon-btn" onclick="openPartyForm(\''+kind+'\',\''+p.id+'\')">✏️</button>' +
        '<button class="icon-btn danger" onclick="deleteParty(\''+kind+'\',\''+p.id+'\')">🗑️</button>' +
      '</td></tr>';
  });
  html += '</tbody></table></div>';
  return html;
}
function movePartyOrder(kind, id, direction){
  if(!canEditTab(kind)){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  const list = DB[kind].slice().sort((a,b)=> (Number(a.sortOrder)||0)-(Number(b.sortOrder)||0));
  const idx = list.findIndex(p=>p.id===id);
  const swapIdx = idx + direction;
  if(idx<0 || swapIdx<0 || swapIdx>=list.length) return;
  list.forEach((p,i)=>{ p.sortOrder = i; });
  const tmp = list[idx].sortOrder;
  list[idx].sortOrder = list[swapIdx].sortOrder;
  list[swapIdx].sortOrder = tmp;
  saveDB(); renderPartyTable(kind);
}
function renderPartyTable(kind){
  const el = byId("parties-table-"+kind);
  if(el) el.innerHTML = partyTableHtml(kind);

function savePartyForm(){
  if(!canEditTab(ui.tab)){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  const kind = ui.partyForm.kind;
  const name = byId("pf-name").value.trim();
  const phone = byId("pf-phone").value.trim();
  const address = byId("pf-address").value.trim();
  const bankName = byId("pf-bank-name").value.trim();
  const bankAccountNumber = byId("pf-bank-account").value.trim();
  const creditLimit = kind==="customers" && byId("pf-credit-limit") ? byId("pf-credit-limit").value : "";
  const openingBalance = byId("pf-opening-balance") ? byId("pf-opening-balance").value : "";
  const openingBalanceDate = byId("pf-opening-date") ? byId("pf-opening-date").value : todayISO();
  if(!name){ alert("الرجاء إدخال الاسم"); return; }
  if(checkPeriodLock(openingBalanceDate, "حفظ الرصيد الافتتاحي")) return;
  let party;
  if(ui.partyForm.id){
    party = DB[kind].find(x=>x.id===ui.partyForm.id);
    Object.assign(party, {name, phone, address, bankName, bankAccountNumber, openingBalance, openingBalanceDate});
    if(kind==="customers") party.creditLimit = creditLimit;
    logActivity("تعديل "+(kind==="customers"?"عميل":"مورد"), name);
  }else{
    party = {id:uid(kind==="customers"?"c":"s"), name, phone, address, bankName, bankAccountNumber, openingBalance, openingBalanceDate, linkedPartyId:null};
    if(kind==="customers") party.creditLimit = creditLimit;
    DB[kind].push(party);
    logActivity("إضافة "+(kind==="customers"?"عميل":"مورد"), name);
  }
  ensurePartyAccount(kind, party);
  upsertOpeningBalanceEntry(kind, party);
  ui.partyForm = null;
  saveDB(); render();
}
/* ---- الرصيد الافتتاحي للعملاء/الموردين: يُرحَّل كقيد يومية تلقائي مقابل حساب "أرصدة افتتاحية" ---- */
function ensureOpeningBalanceAccount(){
  let acc = DB.accounts.find(a=>a.code==="30004" || a.name==="أرصدة افتتاحية");
  if(!acc){
    acc = {id:uid("acc"), code:"30004", name:"أرصدة افتتاحية", type:"equity", normal:"credit", subType:"capital"};
    DB.accounts.push(acc);
  }
  return acc;
}
function upsertOpeningBalanceEntry(kind, party){
  DB.entries = DB.entries.filter(e => !(e.autoGenerated && e.sourceType==="openingBalance" && e.sourceId===party.id));
  const amount = Number(party.openingBalance)||0;
  if(!amount) return;
  const isCustomers = kind==="customers";
  const controlAcc = DB.accounts.find(a=>a.code===(isCustomers?"10003":"20001"));
  if(!controlAcc) return;
  const obAcc = ensureOpeningBalanceAccount();
  const date = party.openingBalanceDate || todayISO();
  const abs = Math.abs(amount);
  const controlIsDebitSide = isCustomers ? (amount>0) : (amount<0);
  const lines = controlIsDebitSide
    ? [{accountId:controlAcc.id, debit:abs, credit:0}, {accountId:obAcc.id, debit:0, credit:abs}]
    : [{accountId:controlAcc.id, debit:0, credit:abs}, {accountId:obAcc.id, debit:abs, credit:0}];
  pushEntry({
    id: uid("e"), date, description: "رصيد افتتاحي - " + party.name,
    isAdjustment:false, autoGenerated:true, sourceType:"openingBalance", sourceId:party.id,
    lines,
  });
}
/* ---- ربط عميل بمورد (أو العكس) لنفس الجهة — "قيد عكسي" ---- */
function linkAsOpposite(kind, partyId){
  const p = DB[kind].find(x=>x.id===partyId);
  if(!p) return;
  const otherKind = kind==="customers" ? "suppliers" : "customers";
  const otherLabel = otherKind==="suppliers" ? "مورد" : "عميل";
  const selfLabel = kind==="customers" ? "عميل" : "مورد";
  if(p.linkedPartyId){
    const other = DB[otherKind].find(o=>o.id===p.linkedPartyId);
    if(other && confirm('هذا ال'+selfLabel+' مرتبط بالفعل بـ'+otherLabel+' باسم "'+other.name+'". هل تريد عرض كشف حسابه كـ'+otherLabel+'؟')){
      goToStatement(otherKind, other.id);
    }
    return;
  }
  const existingMatch = DB[otherKind].find(o=>o.name.trim()===p.name.trim() && !o.linkedPartyId);
  let targetId;
  if(existingMatch && confirm('يوجد بالفعل '+otherLabel+' بنفس الاسم "'+existingMatch.name+'". هل تريد الربط به بدلاً من إنشاء سجل جديد؟')){
    targetId = existingMatch.id;
  }else{
    if(!confirm('سيتم إنشاء سجل '+otherLabel+' جديد بنفس بيانات "'+p.name+'" (الاسم، الهاتف، العنوان، البيانات البنكية) ويُربط بهذا ال'+selfLabel+'. متابعة؟')) return;
    const newParty = {
      id: uid(otherKind==="suppliers"?"s":"c"),
      name: p.name, phone: p.phone||"", address: p.address||"",
      bankName: p.bankName||"", bankAccountNumber: p.bankAccountNumber||"",
      linkedPartyId: p.id,
    };
    DB[otherKind].push(newParty);
    targetId = newParty.id;
  }
  const target = DB[otherKind].find(o=>o.id===targetId);
  target.linkedPartyId = p.id;
  p.linkedPartyId = targetId;
  logActivity("ربط "+selfLabel+" كـ"+otherLabel, p.name);
  saveDB(); render();
  alert('✔ تم الربط بنجاح. تقدر الآن ترى الرصيد الموحّد من صفحة كشف الحساب.');
}
function unlinkParty(kind, id){
  const p = DB[kind].find(x=>x.id===id);
  if(!p || !p.linkedPartyId) return;
  if(!confirm("هل تريد إلغاء الربط؟ (لن يتم حذف أي سجل، فقط إلغاء الربط بينهما)")) return;
  const otherKind = kind==="customers" ? "suppliers" : "customers";
  const other = DB[otherKind].find(x=>x.id===p.linkedPartyId);
  if(other) other.linkedPartyId = null;
  p.linkedPartyId = null;
  logActivity("إلغاء ربط "+(kind==="customers"?"عميل":"مورد"), p.name);
  saveDB(); render();
}
function togglePartyVisibility(kind, id){
  const p = DB[kind].find(x=>x.id===id);
  if(!p) return;
  p.hiddenFromReports = !p.hiddenFromReports;
  logActivity((p.hiddenFromReports?"إخفاء":"إظهار")+" "+(kind==="customers"?"عميل":"مورد")+" من التقارير المجمّعة", p.name);
  saveDB(); render();
}
function deleteParty(kind, id){
  if(!canEditTab(ui.tab)){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  const p = DB[kind].find(x=>x.id===id);
  if(!confirm("هل تريد حذف هذا السجل؟")) return;
  if(p && p.linkedPartyId){
    const otherKind = kind==="customers" ? "suppliers" : "customers";
    const other = DB[otherKind].find(x=>x.id===p.linkedPartyId);
    if(other) other.linkedPartyId = null;
  }
  if(p) releasePartyAccount(p);
  if(p) moveToTrash(kind, p, p.name);
  DB.entries = DB.entries.filter(e => !(e.autoGenerated && e.sourceType==="openingBalance" && e.sourceId===id));
  DB[kind] = DB[kind].filter(x=>x.id!==id);
  logActivity("حذف "+(kind==="customers"?"عميل":"مورد"), p?p.name:"");
  saveDB(); render();
}

    const totalCogs = rows.reduce((s,r)=>s+(Number(r.cogsAmount)||0),0);
    const cogsFootCells = showCogs
      ? '<td class="tleft">'+money(totalCogs)+'</td><td class="tleft">'+money(totalAmount-totalCogs)+'</td>'
      : '';
    return '<tr><td colspan="'+footColspan+'">'+esc(label)+'</td>' +
      '<td class="tleft">'+money(totalAmount)+'</td>' +
      '<td class="tleft">'+money(totalPaid)+'</td>' +
      '<td class="tleft">'+money(totalAmount-totalPaid)+'</td>'+cogsFootCells+
    '</tr>';
  }

  const MONTH_NAMES = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  let bodyHtml = "";
  if(grouping==="monthly" && list.length){
    const byMonth = {};
    const order = [];
    list.forEach(r=>{
      const key = (r.date||"").slice(0,7); // YYYY-MM
      if(!byMonth[key]){ byMonth[key]=[]; order.push(key); }
      byMonth[key].push(r);
    });
    order.forEach(key=>{
      const rows = byMonth[key];
      const [y,m] = key.split("-");
      const monthLabel = (MONTH_NAMES[Number(m)-1]||key)+" "+y;
      bodyHtml += '<div style="font-weight:800; font-size:12.5px; color:#0f172a; margin-top:16px; page-break-after:avoid;">'+esc(monthLabel)+' ('+rows.length+' عملية)</div>';
      bodyHtml += '<table class="print-table" style="margin-top:4px;"><thead>'+theadRow+'</thead><tbody>' +
        rows.map(rowHtml).join("") +
        '</tbody><tfoot>'+footRow("إجمالي "+monthLabel, rows)+'</tfoot></table>';
    });
    bodyHtml += '<div style="margin-top:14px; font-weight:800; font-size:13px; border-top:2px solid #0f172a; padding-top:8px;">' +
      'الإجمالي العام لكل الفترة: '+money(list.reduce((s,r)=>s+(Number(r.amount)||0),0))+' ج.م' +
    '</div>';
  }else{
    bodyHtml = '<table class="print-table"><thead>'+theadRow+'</thead><tbody>' +
      (list.length ? list.map(rowHtml).join("") : '<tr><td colspan="'+(footColspan+3)+'" style="text-align:center;">لا توجد عمليات ضمن الفترة المحددة</td></tr>') +
      '</tbody>' + (list.length ? '<tfoot>'+footRow("الإجمالي", list)+'</tfoot>' : '') +
    '</table>';
  }

  const html =
    '<div class="print-doc theme-'+theme+'">' +
      printHeadHtml(company, isSales?"كشف المبيعات":"كشف المشتريات", docNumber) +
      (ui.registerFilterFrom||ui.registerFilterTo
        ? '<div class="print-row"><span>الفترة:</span><b>من '+(ui.registerFilterFrom?fmtDate(ui.registerFilterFrom):"البداية")+' إلى '+(ui.registerFilterTo?fmtDate(ui.registerFilterTo):"اليوم")+'</b></div>'
        : '') +
      bodyHtml +
      printSignHtml("توقيع المستلم") +
    '</div>';
  openPrintArea(html);
}
function openRegisterForm(kind, id){

    ? DB.accounts.filter(a=>a.type==="revenue")
    : DB.accounts.filter(a=> (a.type==="expense"||a.type==="asset") && !["10001","10002","10003","10006","20001"].includes(a.code));

    ? (DB.accounts.find(a=>a.code==="10003")||DB.accounts.find(a=>a.type==="asset"&&a.name.includes("عملاء")))
    : (DB.accounts.find(a=>a.code==="20001")||DB.accounts.find(a=>a.type==="liability"&&a.name.includes("مورد")));

function registerLiveUpdate(){
  const qty = Number(byId("rf-qty").value)||0;
  const price = Number(byId("rf-price").value)||0;
  const paid = Number(byId("rf-paid").value)||0;
  const amt = qty*price;
  const remain = Math.max(amt-paid,0);
  const party = byId("rf-party").value;
  const main = byId("rf-main").value;
  const pay = byId("rf-pay").value;
  const deferred = byId("rf-deferred").value;

  byId("rf-summary").innerHTML = "الإجمالي: <b>"+money(amt)+"</b> ج.م" + (remain>0?"   المتبقي: <b>"+money(remain)+"</b>":"");

  const needsPayment = paid>0 && !pay;
  const needsDeferred = remain>0 && !deferred;
  let warnHtml = "";
  if(needsPayment || needsDeferred){
    warnHtml = '<div class="alert alert-danger">⚠️ ' +
      (needsPayment?"اختر حساب السداد لأن هناك مبلغًا مسددًا. ":"") +
      (needsDeferred?"اختر حساب العملاء/الموردين لأن هناك مبلغًا متبقيًا.":"") +
      '</div>';
  }
  byId("rf-warning").innerHTML = warnHtml;

  const invalid = !party || !qty || !price || !main || needsPayment || needsDeferred;
  byId("rf-save-btn").disabled = invalid;
}
function saveRegisterForm(){
  if(!canEditTab(ui.tab)){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  const f = ui.registerForm;
  const isSales = f.kind==="sales";
  const partyField = isSales?"customerId":"supplierId";
  const record = {
    id: f.id,
    date: byId("rf-date").value,
    [partyField]: byId("rf-party").value,
    operationType: byId("rf-optype") ? byId("rf-optype").value : "",
    loadingFactory: byId("rf-loading").value.trim(),
    unloadingLocation: byId("rf-unloading").value.trim(),
    driverName: byId("rf-driver") ? byId("rf-driver").value.trim() : "",
    quantity: byId("rf-qty").value,
    unitPrice: byId("rf-price").value,
    paid: byId("rf-paid").value,
    mainAccountId: byId("rf-main").value,
    paymentAccountId: byId("rf-pay").value,
    deferredAccountId: byId("rf-deferred").value,
    inventoryAccountId: isSales ? (byId("rf-inv") ? byId("rf-inv").value : "") : "",
    crossPartyId: byId("rf-cross-party") ? byId("rf-cross-party").value : "",
  };
  const amount = (Number(record.quantity)||0)*(Number(record.unitPrice)||0);
  const paidNum = Number(record.paid)||0;
  const remain = Math.max(amount-paidNum,0);
  if(!record[partyField] || !record.quantity || !record.unitPrice || !record.mainAccountId){ alert("الرجاء إكمال الحقول المطلوبة"); return; }
  if(paidNum>0 && !record.paymentAccountId){ alert("اختر حساب السداد"); return; }
  if(remain>0 && !record.deferredAccountId){ alert("اختر حساب العملاء/الموردين"); return; }
  if(checkPeriodLock(record.date, "حفظ هذه العملية")) return;

  const payload = Object.assign({}, record, {amount});
  const parties = DB[isSales?"customers":"suppliers"];
  const party = parties.find(p=>p.id===record[partyField]);

  if(isSales && party){
    const limit = Number(party.creditLimit)||0;
    if(limit>0){
      const oldRecord = f.id ? DB.sales.find(s=>s.id===f.id) : null;
      const netEffectOld = oldRecord ? ((Number(oldRecord.amount)||0) - (Number(oldRecord.paid)||0)) : 0;
      const baseBalance = partyBalance("customers", party.id) - netEffectOld;
      const newBalance = baseBalance + (amount - paidNum);
      if(newBalance > limit && !party.creditOverrideApproved){
        if(can("manageUsers")){
          if(!confirm("⚠️ هذا العميل سيتجاوز حده الائتماني ("+money(limit)+") ليصل رصيده إلى "+money(newBalance)+". بصفتك مديرًا يمكنك تجاوز الحد. متابعة؟")) return;
        }else{
          if(confirm("⚠️ هذا العميل سيتجاوز حده الائتماني ("+money(limit)+") — لا يمكنك إتمام هذه العملية إلا بموافقة المدير. هل تريد إرسال طلب موافقة الآن؟")){
            submitApprovalRequest("creditLimit", "customers", party.id, "طلب تجاوز الحد الائتماني — الرصيد سيصل إلى "+money(newBalance)+" (الحد المسموح: "+money(limit)+")");
          }
          return;
        }
      }else if(newBalance > limit && party.creditOverrideApproved){
        party.creditOverrideApproved = false;
      }
    }
  }

  if(f.id){
    const idx = DB[f.kind].findIndex(x=>x.id===f.id);
    DB[f.kind][idx] = payload;
    upsertRegisterEntry(payload, isSales, party?party.name:"");
    logActivity("تعديل عملية "+(isSales?"بيع":"شراء"), (party?party.name:"")+" — "+money(amount));
  }else{
    payload.id = uid(isSales?"sl":"pu");
    DB[f.kind].push(payload);
    upsertRegisterEntry(payload, isSales, party?party.name:"");
    logActivity("إضافة عملية "+(isSales?"بيع":"شراء"), (party?party.name:"")+" — "+money(amount));
  }
  recomputeCOGS();
  const quickRepeat = ui.registerQuickRepeat && ui.registerQuickRepeat[f.kind];
  if(quickRepeat && !f.id){
    const lastMainAccountId = payload.mainAccountId, lastPayAccountId = payload.paymentAccountId, lastDeferredId = payload.deferredAccountId, lastInv = payload.inventoryAccountId;
    ui.registerForm = {
      kind: f.kind, id:null, date: payload.date, [partyField]: payload[partyField], description:"",
      quantity:"", unitPrice:"", paid:"",
      mainAccountId: lastMainAccountId, paymentAccountId: lastPayAccountId, deferredAccountId: lastDeferredId,
      inventoryAccountId: lastInv||"", crossPartyId: payload.crossPartyId||"",
    };
  }else{
    ui.registerForm = null;
  }
  saveDB(); render();
  if(quickRepeat && !f.id){
    setTimeout(function(){ const el = byId("rf-qty"); if(el) el.focus(); }, 50);
  }
}
function deleteRegisterRecord(kind, id){
  if(!canEditTab((kind==="sales"?"salesReg":"purchases"))){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  const rec = DB[kind].find(x=>x.id===id);
  if(rec && checkPeriodLock(rec.date, "حذف هذه العملية")) return;
  if(!confirm("هل تريد حذف هذه العملية؟ سيتم حذف القيد المرتبط بها أيضًا.")) return;
  if(rec) moveToTrash(kind, rec, fmtDate(rec.date)+" — "+money(rec.amount||0));
  DB[kind] = DB[kind].filter(x=>x.id!==id);
  removeRegisterEntry(kind, id);
  recomputeCOGS();
  logActivity("حذف عملية "+(kind==="sales"?"بيع":"شراء"), "");
  saveDB(); render();
}

function monthKey(d){ return (d||"").slice(0,7); }
function monthLabel(k){
  if(!k) return "—";
  const [y,m] = k.split("-");
  const names = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  const idx = (Number(m)||1)-1;
  return (names[idx]||m) + " " + y;
}
function buildMonthlySeries(){
  const map = {};
  DB.sales.forEach(r=>{ const k=monthKey(r.date); if(!k) return; map[k]=map[k]||{sales:0,purchases:0}; map[k].sales += Number(r.amount)||0; });
  DB.purchases.forEach(r=>{ const k=monthKey(r.date); if(!k) return; map[k]=map[k]||{sales:0,purchases:0}; map[k].purchases += Number(r.amount)||0; });
  return Object.keys(map).sort().map(k=>({month:k, sales:map[k].sales, purchases:map[k].purchases}));
}
function topParties(kind, n){
  const regKey = kind==="customers" ? "sales" : "purchases";
  const field = kind==="customers" ? "customerId" : "supplierId";
  const totals = {};
  DB[regKey].forEach(r=>{ totals[r[field]] = (totals[r[field]]||0) + (Number(r.amount)||0); });
  return Object.entries(totals)
    .map(([id,amt])=>({party: DB[kind].find(p=>p.id===id), amount:amt}))
    .filter(x=>x.party)
    .sort((a,b)=>b.amount-a.amount)
    .slice(0,n);
}
function barRow(label, amount, max, color){
  const pct = max>0 ? Math.max(2, Math.round((amount/max)*100)) : 0;
  return '<div style="margin-bottom:10px;">' +
    '<div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:3px;"><span>'+esc(label)+'</span><span class="num" style="font-weight:700;">'+money(amount)+'</span></div>' +
    '<div style="background:var(--stone-200); border-radius:4px; height:8px; overflow:hidden;"><div style="width:'+pct+'%; height:100%; background:'+color+';"></div></div>' +
  '</div>';
}

  let html = sectionHead("📊","التحليل والتقارير","نظرة تحليلية على أداء المبيعات والمشتريات وتأخر تحصيل مستحقات العملاء");
  html += '<div style="width:260px; max-width:100%; margin-bottom:16px;"><label class="f-label">عرض</label>' +

      '<option value="monthlyProfit" '+(ui.analysisView==="monthlyProfit"?"selected":"")+'>عدد عمليات النقل وربحية العملاء الشهرية</option>' +
      '<option value="yearlyCompare" '+(ui.analysisView==="yearlyCompare"?"selected":"")+'>مقارنة سنة بسنة (شهريًا)</option>' +
      '<option value="counts" '+(ui.analysisView==="counts"?"selected":"")+'>📋 إحصائيات الأعداد</option>' +

function daysBetween(d1, d2){
  const a = new Date(d1), b = new Date(d2);
  if(isNaN(a.getTime()) || isNaN(b.getTime())) return 0;
  return Math.max(0, Math.round((b-a)/(1000*60*60*24)));
}
function agingBucketLabel(days){
  if(days<=30) return "0-30 يوم";
  if(days<=60) return "31-60 يوم";
  if(days<=90) return "61-90 يوم";
  return "أكثر من 90 يومًا";
}
function agingBucketColor(days){
  if(days<=30) return "#059669";
  if(days<=60) return "#d97706";
  if(days<=90) return "#ea580c";
  return "#e11d48";
}
function customerAgingRows(){
  const today = todayISO();
  return DB.customers.map(p=>{
    const balance = partyBalance("customers", p.id);
    const sales = DB.sales.filter(r=>r.customerId===p.id).slice().sort((a,b)=> a.date<b.date?-1:1);
    let oldestUnpaidDate = null;
    if(Number(p.openingBalance)>0.001 && p.openingBalanceDate){
      oldestUnpaidDate = p.openingBalanceDate;
    }
    sales.forEach(r=>{
      if(oldestUnpaidDate) return;
      if(((Number(r.amount)||0) - (Number(r.paid)||0)) > 0.001) oldestUnpaidDate = r.date;
    });
    let lastPaymentDate = null;
    sales.forEach(r=>{ if(Number(r.paid)>0){ if(!lastPaymentDate || r.date>lastPaymentDate) lastPaymentDate=r.date; } });
    (DB.receipts||[]).filter(v=>v.partyKind==="customers" && v.partyId===p.id).forEach(v=>{
      if(!lastPaymentDate || v.date>lastPaymentDate) lastPaymentDate=v.date;
    });
    const daysOverdue = (oldestUnpaidDate && balance>0.001) ? daysBetween(oldestUnpaidDate, today) : 0;
    const daysSincePayment = lastPaymentDate ? daysBetween(lastPaymentDate, today) : null;
    return {party:p, balance, oldestUnpaidDate, lastPaymentDate, daysOverdue, daysSincePayment};
  }).filter(r=>r.balance > 0.001).sort((a,b)=>b.daysOverdue-a.daysOverdue);
}

function currentMonthKey(){ return todayISO().slice(0,7); }
function customerMonthlyProfitRows(selectedMonth){
  const salesInMonth = DB.sales.filter(r=>monthKey(r.date)===selectedMonth);
  const totalSalesMonth = salesInMonth.reduce((s,r)=>s+(Number(r.amount)||0),0);
  const purchasesInMonth = DB.purchases.filter(r=>monthKey(r.date)===selectedMonth);
  const totalPurchasesMonth = purchasesInMonth.reduce((s,r)=>s+(Number(r.amount)||0),0);
  const totalProfitMonth = totalSalesMonth - totalPurchasesMonth;

  const byCustomer = {};
  salesInMonth.forEach(r=>{
    if(!byCustomer[r.customerId]) byCustomer[r.customerId] = {count:0, amount:0, quantity:0};
    byCustomer[r.customerId].count++;
    byCustomer[r.customerId].amount += Number(r.amount)||0;
    byCustomer[r.customerId].quantity += Number(r.quantity)||0;
  });
  const rows = Object.keys(byCustomer).map(cid=>{
    const c = DB.customers.find(x=>x.id===cid);
    const stats = byCustomer[cid];
    const share = totalSalesMonth>0 ? stats.amount/totalSalesMonth : 0;
    return {customer:c, count:stats.count, quantity:stats.quantity, amount:stats.amount, estimatedProfit: totalProfitMonth*share};
  }).filter(r=>r.customer).sort((a,b)=>b.amount-a.amount);

  return {rows, totalSalesMonth, totalPurchasesMonth, totalProfitMonth};
}
function supplierMonthlyRows(selectedMonth){
  const purchasesInMonth = DB.purchases.filter(r=>monthKey(r.date)===selectedMonth);
  const bySupplier = {};
  purchasesInMonth.forEach(r=>{
    if(!bySupplier[r.supplierId]) bySupplier[r.supplierId] = {count:0, amount:0, quantity:0};
    bySupplier[r.supplierId].count++;
    bySupplier[r.supplierId].amount += Number(r.amount)||0;
    bySupplier[r.supplierId].quantity += Number(r.quantity)||0;
  });
  return Object.keys(bySupplier).map(sid=>{
    const s = DB.suppliers.find(x=>x.id===sid);
    const stats = bySupplier[sid];
    return {supplier:s, count:stats.count, quantity:stats.quantity, amount:stats.amount};
  }).filter(r=>r.supplier).sort((a,b)=>b.amount-a.amount);
}

function importPeopleExcel(event){
  const file = event.target.files[0];
  if(!file) return;
  if(!ensureExcelLib()){ event.target.value = ""; return; }
  const kind = ui.peopleImportKind || "drivers";
  const isDrivers = kind==="drivers";
  const idPrefix = isDrivers ? "dr" : "hp";
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:""});
      let added=0, updated=0, skipped=0;
      rows.forEach((row,i)=>{
        if(i===0) return; // تجاهل صف العناوين
        const name = String(row[0]||"").trim();
        if(!name){ skipped++; return; }
        const phone = String(row[1]||"").trim();
        const dailyRate = String(row[2]||"").trim();
        const existing = (DB[kind]||[]).find(x=>x.name.trim()===name);
        if(existing){
          Object.assign(existing, {phone, dailyRate});
          updated++;
        }else{
          DB[kind].push({id:uid(idPrefix), name, phone, dailyRate});
          added++;
        }
      });
      logActivity("استيراد "+(isDrivers?"سائقين":"مساعدين")+" من إكسيل", "إضافة: "+added+" — تحديث: "+updated);
      saveDB(); render();
      alert("تم الاستيراد بنجاح ✅\nإضافة "+added+" جديد، وتحديث "+updated+" موجود"+(skipped?("، وتجاهل "+skipped+" صف بدون اسم"):"")+".");
    }catch(err){
      alert("تعذّرت قراءة ملف الإكسيل. تأكد أن الملف بصيغة xlsx/xls صحيحة وبنفس ترتيب الأعمدة الموضح أعلى الجدول.");
    }
    event.target.value = "";
  };
  reader.readAsArrayBuffer(file);
}

/* ---- سجلات النقلات والعهدة (مبسّطة) ---- */
function computeCustodyStats(r){
  const remaining = (Number(r.custodyAmount)||0) - (Number(r.commission)||0) - (Number(r.expenses)||0);
  return {remaining};
}
function renderCustodyRecordsTab(){
  let html = '<div style="margin-bottom:12px;"><button class="btn btn-primary" onclick="openCustodyForm()">➕ نقلة / سجل عهدة جديد</button></div>';
  if(ui.custodyForm) html += renderCustodyForm();
  const list = (DB.custodyRecords||[]).slice().sort((a,b)=> (a.tripDate||a.departDate||"")<(b.tripDate||b.departDate||"")?1:-1);
  html += '<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>تباع السائق</th><th class="tleft">الكمية</th><th class="tleft">العهدة</th><th class="tleft">الكمسيون</th><th class="tleft">المصاريف</th><th class="tleft">المتبقي</th><th class="tleft">إجراءات</th></tr></thead><tbody>';
  if(list.length===0){ html += '<tr><td colspan="9"><div class="empty-row">لا توجد سجلات نقلات بعد</div></td></tr>'; }
  let totalCustody=0, totalExpenses=0, totalCommission=0, totalRemaining=0;
  list.forEach(r=>{
    const driver = DB.drivers.find(d=>d.id===r.driverId);
    const stats = computeCustodyStats(r);
    totalCustody += Number(r.custodyAmount)||0; totalExpenses += Number(r.expenses)||0; totalCommission += Number(r.commission)||0; totalRemaining += stats.remaining;
    html += '<tr><td style="white-space:nowrap;">'+fmtDate(r.tripDate||r.departDate)+'</td>' +
      '<td>'+esc(r.description||"—")+' <span style="color:var(--stone-400); font-size:11px;">('+esc(driver?driver.name:"—")+')</span></td>' +
      '<td>'+esc((r.helperId && DB.helpers.find(h=>h.id===r.helperId))?DB.helpers.find(h=>h.id===r.helperId).name:(r.helperName||"—"))+'</td>' +
      '<td class="tleft num">'+(r.quantity!=null&&r.quantity!==""?r.quantity:"—")+'</td>' +
      '<td class="tleft num">'+money(r.custodyAmount)+'</td>' +
      '<td class="tleft num">'+money(r.commission)+'</td>' +
      '<td class="tleft num">'+money(r.expenses)+'</td>' +
      '<td class="tleft num" style="font-weight:700; color:'+(stats.remaining>=0?"#059669":"#e11d48")+';">'+money(stats.remaining)+'</td>' +
      '<td class="tleft"><button class="icon-btn" onclick="openCustodyForm(\''+r.id+'\')">✏️</button>' +
      '<button class="icon-btn danger" onclick="deleteCustodyRecord(\''+r.id+'\')">🗑️</button></td></tr>';
  });
  html += '</tbody>';
  if(list.length>0){
    html += '<tfoot><tr><td colspan="4">الإجمالي</td><td class="tleft num">'+money(totalCustody)+'</td><td class="tleft num">'+money(totalCommission)+'</td><td class="tleft num">'+money(totalExpenses)+'</td><td class="tleft num">'+money(totalRemaining)+'</td><td></td></tr></tfoot>';

function computeWorkDaysStats(r){
  const dep = new Date((r.departDate||"")+"T"+(r.departTime||"00:00"));
  const ret = new Date((r.returnDate||"")+"T"+(r.returnTime||"00:00"));
  let hours = 0;
  if(!isNaN(dep.getTime()) && !isNaN(ret.getTime()) && ret>dep){ hours = (ret-dep)/3600000; }
  let workDays = 0;
  if(hours>0) workDays = Math.max(1, Math.ceil(hours/24));
  else if(r.departDate && r.returnDate) workDays = Math.max(1, daysBetween(r.departDate,r.returnDate)+1);
  const baseWage = workDays * (Number(r.dailyRate)||0);
  const adjAmount = Number(r.adjustmentAmount)||0;
  const adjSigned = r.adjustmentType==="deduction" ? -adjAmount : adjAmount;
  const totalWage = baseWage + adjSigned;
  return {workDays, hours, baseWage, adjSigned, totalWage};
}

  const isDriver = kind==="driver";

  if(list.length===0){ html += '<tr><td colspan="8"><div class="empty-row">لا توجد سجلات أيام عمل بعد</div></td></tr>'; }
  let totalDays=0, totalWage=0;
  list.forEach(r=>{

    totalDays += stats.workDays; totalWage += stats.totalWage;

      '<td class="tleft num" style="color:'+(stats.adjSigned>=0?"#059669":"#e11d48")+';">'+(stats.adjSigned!==0?money(stats.adjSigned):"—")+'</td>' +

function saveAdvanceForm(){
  if(!canEditTab("custody")){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  const kind = ui.advanceForm.kind;
  const isDriver = kind==="driver";
  const listKey = isDriver ? "driverAdvances" : "helperAdvances";
  const peopleKey = isDriver ? "drivers" : "helpers";
  const personField = isDriver ? "driverId" : "helperId";
  const personId = byId("av-person").value;
  const record = {
    id: ui.advanceForm.id,
    [personField]: personId,
    date: byId("av-date").value,
    type: byId("av-type").value,
    amount: byId("av-amount").value,
    description: byId("av-desc").value.trim(),
    paymentAccountId: byId("av-payment-account").value,
  };
  if(!personId || !record.date || !Number(record.amount)){ alert("الرجاء اختيار "+(isDriver?"السائق":"المساعد")+" وإدخال التاريخ والمبلغ"); return; }
  if(checkPeriodLock(record.date, "حفظ سجل السلفة/المسحوبات")) return;
  const person = DB[peopleKey].find(p=>p.id===personId);
  if(record.id){
    const idx = DB[listKey].findIndex(x=>x.id===record.id);
    DB[listKey][idx] = record;
    logActivity("تعديل سلفة/مسحوبات "+(isDriver?"سائق":"مساعد"), person?person.name:"");
  }else{
    record.id = uid(isDriver?"advd":"advh");
    DB[listKey].push(record);
    logActivity("إضافة سلفة/مسحوبات "+(isDriver?"سائق":"مساعد"), person?person.name:"");
  }
  upsertAdvanceEntry(record);
  ui.advanceForm = null;
  saveDB(); render();
}
function deleteAdvanceRecord(kind, id){
  if(!canEditTab("custody")){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  const isDriver = kind==="driver";
  const listKey = isDriver ? "driverAdvances" : "helperAdvances";
  const rec = DB[listKey].find(x=>x.id===id);
  if(rec && checkPeriodLock(rec.date, "حذف سجل السلفة/المسحوبات")) return;
  if(!confirm("هل تريد حذف هذا السجل؟ سيتم حذف القيد المحاسبي المرتبط به أيضًا.")) return;
  DB[listKey] = DB[listKey].filter(x=>x.id!==id);
  removeAdvanceEntry(id);
  logActivity("حذف سلفة/مسحوبات "+(isDriver?"سائق":"مساعد"), "");
  saveDB(); render();
}

   (عميل/مورد عبر كشف الحساب، أو سائق/مساعد عبر كشف العهدة المجمّع) */
function goToPartyAccountOwner(partyKind, partyId){

  }else if(partyKind==="drivers"){
    goToPersonStatement("driver", partyId);

function personCombinedSummary(kind, personId){
  const isDriver = kind==="driver";
  const person = DB[isDriver?"drivers":"helpers"].find(p=>p.id===personId);
  const custodyList = isDriver ? (DB.custodyRecords||[]).filter(r=>r.driverId===personId) : [];
  const helperTrips = !isDriver ? (DB.custodyRecords||[]).filter(r=>r.helperId===personId) : [];
  const workDaysKey = isDriver ? "driverWorkDays" : "helperWorkDays";
  const personField = isDriver ? "driverId" : "helperId";
  const workDaysList = (DB[workDaysKey]||[]).filter(r=>r[personField]===personId);
  const advancesKey = isDriver ? "driverAdvances" : "helperAdvances";
  const advancesList = (DB[advancesKey]||[]).filter(r=>r[personField]===personId);

  const custodyRemainingTotal = custodyList.reduce((s,r)=>s+computeCustodyStats(r).remaining,0);
  const wagesTotal = workDaysList.reduce((s,r)=>s+computeWorkDaysStats(r).totalWage,0);
  const advancesTotal = advancesList.reduce((s,r)=>s+(Number(r.amount)||0),0);
  const openingBalance = person ? (Number(person.openingBalance)||0) : 0;
  const netDue = wagesTotal - custodyRemainingTotal - advancesTotal + openingBalance;

  return {custodyList, helperTrips, workDaysList, advancesList, custodyRemainingTotal, wagesTotal, advancesTotal, openingBalance, netDue};
}

function decideApprovalRequest(id, decision){
  if(!can("manageUsers")){ alert("هذا الإجراء متاح لمدير النظام فقط."); return; }
  const req = DB.approvalRequests.find(r=>r.id===id);
  if(!req) return;
  if(!confirm(decision==="approved" ? "هل تريد الموافقة على هذا الطلب؟" : "هل تريد رفض هذا الطلب؟")) return;
  req.status = decision;
  req.decidedBy = currentUser().displayName;
  req.decidedAt = new Date().toISOString();
  if(decision==="approved" && req.type==="creditLimit" && req.partyKind==="customers"){
    const p = DB.customers.find(c=>c.id===req.partyId);
    if(p) p.creditOverrideApproved = true;
  }
  logActivity(decision==="approved"?"الموافقة على طلب":"رفض طلب", approvalTypeLabel(req.type));
  saveDB(); render();
}

function saveCheckForm(){
  if(!canEditTab("checks")){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  const direction = byId("chk-direction").value;
  const partyKind = direction==="received" ? "customers" : "suppliers";
  const record = {
    id: ui.checkForm.id, direction, partyKind,
    partyId: byId("chk-party").value,
    checkNumber: byId("chk-number").value.trim(),
    bankName: byId("chk-bank").value.trim(),

    amount: byId("chk-amount").value,
    notes: byId("chk-notes").value.trim(),
    status: ui.checkForm.status || "pending",
  };
  if(!record.partyId || !record.dueDate || !Number(record.amount)){ alert("الرجاء اختيار الجهة وإدخال تاريخ الاستحقاق والمبلغ"); return; }
  const party = DB[partyKind].find(p=>p.id===record.partyId);
  if(record.id){
    const idx = DB.checks.findIndex(x=>x.id===record.id);
    DB.checks[idx] = record;
    logActivity("تعديل شيك", party?party.name:"");
  }else{
    record.id = uid("chk");
    DB.checks.push(record);
    logActivity("إضافة شيك", party?party.name:"");

function deleteCheck(id){
  if(!canEditTab("checks")){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  if(!confirm("هل تريد حذف هذا الشيك؟")) return;
  const chk = DB.checks.find(x=>x.id===id);
  if(chk) moveToTrash("checks", chk, (chk.checkNumber||"")+" — "+money(chk.amount||0));
  DB.checks = DB.checks.filter(x=>x.id!==id);
  logActivity("حذف شيك", "");
  saveDB(); render();
}
function cashCheck(id){
  if(!canEditTab("checks")){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  const c = DB.checks.find(x=>x.id===id);
  if(!c) return;
  const cashAcc = defaultCashAccountId();
  if(!cashAcc){ alert("لا يوجد حساب نقدية/بنك متاح."); return; }
  const partyAccId = c.direction==="received" ? (DB.accounts.find(a=>a.code==="10003")||{}).id : (DB.accounts.find(a=>a.code==="20001")||{}).id;
  if(!confirm("تأكيد تحصيل/صرف الشيك بمبلغ "+money(c.amount)+"؟ سيتم ترحيل قيد يومية تلقائي.")) return;
  if(partyAccId){
    const lines = c.direction==="received"
      ? [{accountId:cashAcc, debit:c.amount, credit:0},{accountId:partyAccId, debit:0, credit:c.amount}]
      : [{accountId:partyAccId, debit:c.amount, credit:0},{accountId:cashAcc, debit:0, credit:c.amount}];
    pushEntry({id:uid("e"), date:todayISO(), description:(c.direction==="received"?"تحصيل شيك رقم ":"صرف شيك رقم ")+(c.checkNumber||""), isAdjustment:false, autoGenerated:true, sourceType:"check", sourceId:c.id, lines:lines});
  }
  c.status = "cashed";
  logActivity("تحصيل/صرف شيك", c.checkNumber||"");
  saveDB(); render();
}
function bounceCheck(id){
  if(!canEditTab("checks")){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  const c = DB.checks.find(x=>x.id===id);
  if(!c) return;
  if(!confirm("هل تريد تسجيل ارتداد هذا الشيك؟")) return;
  c.status = "bounced";
  logActivity("ارتداد شيك", c.checkNumber||"");
  saveDB(); render();
}

  const byVehicle = {};
  list.forEach(m=>{

    byVehicle[m.vehicleId] = (byVehicle[m.vehicleId]||0) + (Number(m.cost)||0);

function renderFuelAnomalyNote(){
  const byVehicle = {};
  (DB.fuelLogs||[]).forEach(r=>{
    if(!r.liters || !r.odometerKm) return;
    byVehicle[r.vehicleId] = byVehicle[r.vehicleId] || [];
    byVehicle[r.vehicleId].push(r);
  });
  const warnings = [];
  Object.keys(byVehicle).forEach(vid=>{
    const logs = byVehicle[vid].slice().sort((a,b)=>a.date<b.date?-1:1);
    if(logs.length<3) return;
    const rates = [];
    for(let i=1;i<logs.length;i++){
      const km = Number(logs[i].odometerKm)-Number(logs[i-1].odometerKm);
      const liters = Number(logs[i].liters);
      if(km>0 && liters>0) rates.push(liters/km);
    }
    if(rates.length<2) return;
    const avg = rates.slice(0,-1).reduce((s,r)=>s+r,0)/(rates.length-1);
    const last = rates[rates.length-1];
    if(last > avg*1.3){
      const v = DB.vehicles.find(x=>x.id===vid);
      warnings.push((v?v.plateNumber:"مركبة")+": معدل الاستهلاك الأخير أعلى من المعتاد بنسبة "+Math.round((last/avg-1)*100)+"%");
    }
  });
  if(warnings.length===0) return "";
  return '<div class="alert alert-danger" style="margin-top:10px;">⚠️ تنبيه استهلاك وقود غير معتاد:<br/>'+warnings.map(esc).join("<br/>")+'</div>';
}

function ensureIncomeTaxAccounts(){
  let expenseAcc = DB.accounts.find(a=>a.code==="50009" || a.name==="مصروف ضريبة الدخل");
  if(!expenseAcc){
    expenseAcc = {id:uid("acc"), code:"50009", name:"مصروف ضريبة الدخل", type:"expense", normal:"debit", subType:"operating"};
    DB.accounts.push(expenseAcc);
  }
  let liabilityAcc = DB.accounts.find(a=>a.code==="20009" || a.name==="ضريبة الدخل المستحقة");
  if(!liabilityAcc){
    liabilityAcc = {id:uid("acc"), code:"20009", name:"ضريبة الدخل المستحقة", type:"liability", normal:"credit", subType:"current"};
    DB.accounts.push(liabilityAcc);
  }
  return {expenseAcc, liabilityAcc};
}

function postIncomeTaxEntry(){

  const year = ui.incomeTaxYear || Number(todayISO().slice(0,4));

  if(checkPeriodLock(toDate, "ترحيل قيد ضريبة الدخل")) return;
  const ts = incomeTaxSettings();
  const inc = incomeStatementForRange(year+"-01-01", toDate);
  const taxableProfit = Math.max(0, inc.netIncome);
  const estimatedTax = taxableProfit * ts.rate/100;
  if(estimatedTax<=0){ alert("لا توجد ضريبة مستحقة لهذه السنة (لا يوجد ربح خاضع للضريبة)."); return; }
  const {expenseAcc, liabilityAcc} = ensureIncomeTaxAccounts();
  DB.entries = DB.entries.filter(e => !(e.autoGenerated && e.sourceType==="incomeTax" && e.sourceId===String(year)));
  pushEntry({
    id: uid("e"), date: toDate, description: "ضريبة الدخل التقديرية عن سنة "+year,
    isAdjustment:true, autoGenerated:true, sourceType:"incomeTax", sourceId:String(year),
    lines: [{accountId:expenseAcc.id, debit:estimatedTax, credit:0}, {accountId:liabilityAcc.id, debit:0, credit:estimatedTax}],
  });
  logActivity("ترحيل قيد ضريبة الدخل", year+" — "+money(estimatedTax));
  saveDB(); render();
  alert("✔ تم ترحيل قيد ضريبة الدخل التقديرية بمبلغ "+money(estimatedTax));
}

function bookBalanceAsOf(accountId, asOfDate){
  if(!accountId) return 0;
  const rows = ledgerForAccount(accountId, true).filter(r=>r.entry.date <= asOfDate);
  return rows.length ? rows[rows.length-1].running : 0;
}
/* رقم مرجعي تسلسلي إجباري لكل قيد يومية (لسهولة المراجعة ومنع أي فجوة في الترقيم) */
function pushEntry(entryObj){
  DB.nextEntryNumber = (DB.nextEntryNumber||0) + 1;
  entryObj.entryNumber = DB.nextEntryNumber;
  DB.entries.push(entryObj);
  return entryObj;
}
function nextVoucherNumber(type){
  const key = type==="receipt" ? "nextReceiptNumber" : "nextPaymentNumber";
  DB[key] = (DB[key]||0) + 1;
  return DB[key];
}
/* قفل الفترات المحاسبية: يمنع إضافة/تعديل/حذف أي عملية بتاريخ يقع ضمن فترة مُقفلة */
function isDateLocked(date){
  return !!(DB.periodLockDate && date && date<=DB.periodLockDate);
}
function checkPeriodLock(date, actionLabel){
  if(isDateLocked(date)){
    alert("⛔ لا يمكن "+(actionLabel||"تنفيذ هذا الإجراء")+": التاريخ ("+fmtDate(date)+") يقع ضمن فترة محاسبية مُقفلة حتى "+fmtDate(DB.periodLockDate)+". يمكن للمدير فتح القفل مؤقتًا من نسخة احتياطية ← قفل الفترات المحاسبية.");
    return true;
  }
  return false;
}
function bankAccountsList(){

}
/* ---- حسابات صافي الأرصدة (تُستخدم في لوحة الأرصدة الصافية بالرئيسية) ---- */
function liquidAccountsList(){
  return DB.accounts.filter(a=> a.code==="10001" || a.code==="10002" ||
    (a.type==="asset" && a.normal==="debit" && (a.name.indexOf("صندوق")>-1 || a.name.indexOf("بنك")>-1)));
}
function totalLiquidBalance(){
  const today = todayISO();
  return liquidAccountsList().reduce((s,a)=> s + bookBalanceAsOf(a.id, today), 0);
}
function totalCustomersNet(){
  return DB.customers.filter(c=>!c.hiddenFromReports).reduce((s,c)=> s + partyBalance("customers", c.id), 0);
}
function totalSuppliersNet(){
  return DB.suppliers.filter(s=>!s.hiddenFromReports).reduce((s,sup)=> s + partyBalance("suppliers", sup.id), 0);
}
function totalDriverHelperNet(){
  let total = 0;
  (DB.drivers||[]).forEach(d=> total += personCombinedSummary("driver", d.id).netDue);
  (DB.helpers||[]).forEach(h=> total += personCombinedSummary("helper", h.id).netDue);
  return total;
}
function netBalancesSummary(){
  const cash = totalLiquidBalance();
  const customersNet = totalCustomersNet();
  const suppliersNet = totalSuppliersNet();
  const driversHelpersNet = totalDriverHelperNet();
  const overall = cash + customersNet - suppliersNet - driversHelpersNet;
  return {cash, customersNet, suppliersNet, driversHelpersNet, overall};
}
/* مؤشرات أداء متدحرجة لآخر 7 أيام (بديل عملي عن جدولة تلقائية أسبوعية غير ممكنة في صفحة ثابتة) */
function weeklyKPIs(){
  const today = todayISO();
  const weekAgo = new Date(Date.now()-7*86400000).toISOString().slice(0,10);
  const salesWeek = DB.sales.filter(r=>r.date>=weekAgo && r.date<=today);
  const purchasesWeek = DB.purchases.filter(r=>r.date>=weekAgo && r.date<=today);
  const totalSalesWeek = salesWeek.reduce((s,r)=>s+(Number(r.amount)||0),0);
  const totalPurchasesWeek = purchasesWeek.reduce((s,r)=>s+(Number(r.amount)||0),0);
  const marginPct = totalSalesWeek>0 ? ((totalSalesWeek-totalPurchasesWeek)/totalSalesWeek*100) : 0;

  const aging = customerAgingRows();
  const avgDaysOverdue = aging.length ? Math.round(aging.reduce((s,r)=>s+r.daysOverdue,0)/aging.length) : 0;

  const tripsWeek = (DB.custodyRecords||[]).filter(function(r){ const d=r.tripDate||r.departDate; return d>=weekAgo && d<=today; });
  const driverCounts = {};
  tripsWeek.forEach(function(r){ driverCounts[r.driverId] = (driverCounts[r.driverId]||0)+1; });
  const topDriverEntry = Object.entries(driverCounts).sort(function(a,b){return b[1]-a[1];})[0];
  const topDriver = topDriverEntry ? DB.drivers.find(function(d){return d.id===topDriverEntry[0];}) : null;

  return {totalSalesWeek, totalPurchasesWeek, marginPct, avgDaysOverdue, topDriver, topDriverTrips: topDriverEntry?topDriverEntry[1]:0};
}

function computeBankReconCalc(rec){
  const bookBalance = bookBalanceAsOf(rec.bankAccountId, rec.date);
  const deposits = (rec.deposits||[]).reduce((s,d)=>s+(Number(d.amount)||0),0);
  const checks = (rec.checks||[]).reduce((s,c)=>s+(Number(c.amount)||0),0);
  const adjDebits = (rec.adjustments||[]).filter(a=>a.direction==="debit").reduce((s,a)=>s+(Number(a.amount)||0),0);
  const adjCredits = (rec.adjustments||[]).filter(a=>a.direction==="credit").reduce((s,a)=>s+(Number(a.amount)||0),0);
  const adjustedBankBalance = (Number(rec.bankStatementBalance)||0) + deposits - checks;
  const adjustedBookBalance = bookBalance + adjDebits - adjCredits;
  const difference = adjustedBankBalance - adjustedBookBalance;
  return {bookBalance, deposits, checks, adjDebits, adjCredits, adjustedBankBalance, adjustedBookBalance, difference};
}

function brAddRow(field){
  syncBankReconFromDOM();
  const f = ui.bankReconForm;
  if(field==="adjustments") f.adjustments = (f.adjustments||[]).concat([{description:"", amount:"", direction:"debit", contraAccountId:"", posted:false}]);
  else f[field] = (f[field]||[]).concat([{description:"", amount:""}]);
  render();
}
function brRemoveRow(field, i){
  syncBankReconFromDOM();
  const f = ui.bankReconForm;
  f[field] = (f[field]||[]).filter((_,idx)=>idx!==i);

}
function bankReconLiveUpdate(){
  const account = byId("br-account").value;
  const date = byId("br-date").value;
  const bankStatementBalance = byId("br-statement-balance").value;
  const deposits = [];
  document.querySelectorAll(".br-deposit-row").forEach(row=> deposits.push({amount: row.querySelector(".br-dep-amt").value}));
  const checks = [];
  document.querySelectorAll(".br-check-row").forEach(row=> checks.push({amount: row.querySelector(".br-chk-amt").value}));
  const adjustments = [];
  document.querySelectorAll(".br-adj-row").forEach((row,i)=>{
    const existing = (ui.bankReconForm.adjustments||[])[i];
    if(existing && existing.posted){ adjustments.push(existing); return; }
    const amtInput = row.querySelector(".br-adj-amt");
    const dirInput = row.querySelector(".br-adj-dir");
    if(!amtInput || !dirInput) return;
    adjustments.push({amount: amtInput.value, direction: dirInput.value});
  });
  const tempRec = {bankAccountId:account, date:date, bankStatementBalance:bankStatementBalance, deposits:deposits, checks:checks, adjustments:adjustments};
  const calc = computeBankReconCalc(tempRec);
  const box = byId("br-summary");
  if(box) box.innerHTML = bankReconSummaryHtml(calc);
}
function saveBankReconForm(){
  if(!canEditTab("bankRecon")){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  syncBankReconFromDOM();
  const f = ui.bankReconForm;
  if(!f.bankAccountId || !f.date){ alert("الرجاء اختيار حساب البنك والتاريخ"); return; }
  if(checkPeriodLock(f.date, "حفظ مذكرة التسوية")) return;
  if(f.id){
    const idx = DB.bankReconciliations.findIndex(x=>x.id===f.id);
    DB.bankReconciliations[idx] = f;
    logActivity("تعديل مذكرة تسوية بنك", fmtDate(f.date));
  }else{
    f.id = uid("brc");
    DB.bankReconciliations.push(f);
    logActivity("إضافة مذكرة تسوية بنك", fmtDate(f.date));
  }
  ui.bankReconForm = null;
  saveDB(); render();
}
function deleteBankRecon(id){
  if(!canEditTab("bankRecon")){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  const rec = DB.bankReconciliations.find(x=>x.id===id);
  if(rec && checkPeriodLock(rec.date, "حذف مذكرة التسوية")) return;
  if(!confirm("هل تريد حذف مذكرة التسوية هذه؟ سيتم حذف أي قيود تسوية مُرحَّلة منها أيضًا.")) return;
  DB.entries = DB.entries.filter(e => !(e.autoGenerated && e.sourceType==="bankRecon" && e.sourceId && e.sourceId.indexOf(id+"_")===0));
  DB.bankReconciliations = DB.bankReconciliations.filter(x=>x.id!==id);
  logActivity("حذف مذكرة تسوية بنك", "");
  saveDB(); render();
}
function postAllBankReconAdjustments(id){
  if(!canEditTab("bankRecon")){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  const rec = DB.bankReconciliations.find(r=>r.id===id);
  if(!rec) return;
  if(checkPeriodLock(rec.date, "ترحيل تعديلات هذه المذكرة")) return;
  let postedCount = 0;
  (rec.adjustments||[]).forEach((item, idx)=>{
    if(item.posted) return;
    const amt = Number(item.amount)||0;
    if(amt<=0 || !item.contraAccountId) return;
    const lines = item.direction==="debit"
      ? [{accountId:rec.bankAccountId, debit:amt, credit:0},{accountId:item.contraAccountId, debit:0, credit:amt}]
      : [{accountId:rec.bankAccountId, debit:0, credit:amt},{accountId:item.contraAccountId, debit:amt, credit:0}];
    const entry = {
      id: uid("e"), date:rec.date, description:"تسوية بنكية: "+(item.description||""),
      isAdjustment:true, autoGenerated:true, sourceType:"bankRecon", sourceId:rec.id+"_"+idx,
      lines: lines,
    };
    pushEntry(entry);
    item.posted = true;
    item.postedEntryId = entry.id;
    postedCount++;
  });
  if(postedCount===0){ alert("لا توجد تعديلات جديدة تحتاج ترحيل (تأكد من إدخال المبلغ والحساب المقابل لكل بند غير مُرحَّل)."); return; }
  logActivity("ترحيل تعديلات تسوية بنكية", postedCount+" بند(ود) — "+fmtDate(rec.date));
  saveDB(); render();
  alert("✔ تم ترحيل "+postedCount+" تعديل(ات) كقيود يومية تلقائيًا.");
}

const WHATSAPP_TEMPLATE_KEY = "ferdaws-wa-template-v1";

function loadWaTemplate(){ return localStorage.getItem(WHATSAPP_TEMPLATE_KEY) || DEFAULT_WA_TEMPLATE; }
function saveWaTemplateStr(t){ localStorage.setItem(WHATSAPP_TEMPLATE_KEY, t); }
function normalizePhoneForWhatsApp(phone){
  let digits = String(phone||"").replace(/[^0-9]/g,"");
  if(!digits) return "";
  if(digits.startsWith("0")) digits = "20" + digits.slice(1); // افتراض رقم مصري محلي
  return digits;
}
function buildBalanceMessage(customer, balance){
  return loadWaTemplate()
    .replace(/\{name\}/g, customer.name)
    .replace(/\{balance\}/g, money(balance))
    .replace(/\{company\}/g, "الفردوس للنقل والتوريد")
    .replace(/\{date\}/g, fmtDate(todayISO()));
}
function sendBalanceWhatsApp(customerId){
  const c = DB.customers.find(x=>x.id===customerId);
  if(!c) return;
  const balance = partyBalance("customers", customerId);
  const phone = normalizePhoneForWhatsApp(c.phone);
  if(!phone){ alert("لا يوجد رقم هاتف صالح مسجل لهذا العميل. أضف رقمه أولاً من صفحة العملاء."); return; }
  const message = buildBalanceMessage(c, balance);
  const url = "https://wa.me/"+phone+"?text="+encodeURIComponent(message);
  window.open(url, "_blank");
  c.lastWhatsAppSentAt = todayISO();
  logActivity("إرسال رصيد واتساب", c.name+" — "+money(balance));
  saveDB(); render();
}

async function callAI(prompt, maxTokens){
  const cfg = loadAIConfig();
  if(!cfg.apiKey){ throw new Error('لم يتم إدخال مفتاح API بعد. اذهب إلى "نسخة احتياطية" ← "إعدادات المساعد الذكي".'); }
  const provider = cfg.provider || "gemini";
  if(provider==="anthropic") return callAnthropic(cfg, prompt, maxTokens);
  return callGemini(cfg, prompt, maxTokens);
}
async function callAnthropic(cfg, prompt, maxTokens){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": cfg.apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: cfg.model || "claude-sonnet-5",
      max_tokens: maxTokens || 700,
      messages: [{role:"user", content:prompt}],
    }),
  });
  if(!res.ok){
    let extra = "";
    try{ extra = (await res.text()).slice(0,180); }catch(e){}
    throw new Error("فشل الاتصال بـ Anthropic (كود "+res.status+"). تأكد من صحة مفتاح API. "+extra);
  }
  const data = await res.json();
  const block = (data.content||[]).find(b=>b.type==="text");
  return block ? block.text : "";
}
async function callGemini(cfg, prompt, maxTokens){
  const model = cfg.model || "gemini-2.0-flash";
  const url = "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent?key=" + encodeURIComponent(cfg.apiKey);
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{parts:[{text:prompt}]}],
      generationConfig: {maxOutputTokens: maxTokens || 700},
    }),
  });
  if(!res.ok){
    let extra = "";
    try{ extra = (await res.text()).slice(0,180); }catch(e){}
    throw new Error("فشل الاتصال بـ Gemini (كود "+res.status+"). تأكد من صحة مفتاح API واسم النموذج. "+extra);
  }
  const data = await res.json();
  const cand = (data.candidates||[])[0];
  const text = cand && cand.content && cand.content.parts ? cand.content.parts.map(p=>p.text||"").join("") : "";
  return text || "لم يصل رد من النموذج.";
}

function buildStatementRows(kind, partyId){
  const isCustomers = kind==="customers";
  const regKey = isCustomers ? "sales" : "purchases";
  const field = isCustomers ? "customerId" : "supplierId";
  const rows = [];

  const party = DB[kind].find(p=>p.id===partyId);
  const openingAmt = party ? (Number(party.openingBalance)||0) : 0;
  if(openingAmt){
    const openingAbs = Math.abs(openingAmt);
    rows.push({
      date: party.openingBalanceDate || "0000-00-00",
      desc: "رصيد افتتاحي",
      quantity:null, unitPrice:null,
      debit: isCustomers ? (openingAmt>0 ? openingAbs : 0) : (openingAmt<0 ? openingAbs : 0),
      credit: isCustomers ? (openingAmt<0 ? openingAbs : 0) : (openingAmt>0 ? openingAbs : 0),
      type: "opening",
      _openingSort: true,
    });
  }

  DB[regKey].filter(r=>r[field]===partyId).forEach(r=>{
    const siteBits = [];
    if(r.loadingFactory) siteBits.push("مصنع التحميل: "+r.loadingFactory);
    if(r.unloadingLocation) siteBits.push("مكان التعتيق: "+r.unloadingLocation);
    const siteInfo = siteBits.join(" — ");
    rows.push({
      date:r.date,
      desc:(isCustomers?"مبيعات":"مشتريات") + (siteInfo?" — "+siteInfo:"") + (r.description?" - "+r.description:""),
      loadingFactory: r.loadingFactory||"",
      unloadingLocation: r.unloadingLocation||"",
      quantity: r.quantity!=null && r.quantity!=="" ? Number(r.quantity) : null,
      unitPrice: r.unitPrice!=null && r.unitPrice!=="" ? Number(r.unitPrice) : null,
      debit: isCustomers ? (Number(r.amount)||0) : 0,
      credit: isCustomers ? 0 : (Number(r.amount)||0),
      type: "transaction",
    });
    if(Number(r.paid)>0){
      rows.push({
        date:r.date,
        desc:"مسدد عند "+(isCustomers?"البيع":"الشراء"),
        quantity:null, unitPrice:null,
        debit: isCustomers ? 0 : (Number(r.paid)||0),
        credit: isCustomers ? (Number(r.paid)||0) : 0,
        type: "payment",
      });
    }
  });

  const voucherKey = isCustomers ? "receipts" : "payments";
  (DB[voucherKey]||[]).filter(v=>v.partyKind===kind && v.partyId===partyId).forEach(v=>{
    rows.push({
      date:v.date,
      desc:(isCustomers?"سند قبض رقم ":"سند صرف رقم ") + esc0(v.number) + (v.description?" - "+v.description:""),
      quantity:null, unitPrice:null,
      debit: isCustomers ? 0 : (Number(v.amount)||0),
      credit: isCustomers ? (Number(v.amount)||0) : 0,
      type: "payment",
    });
  });

  rows.sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1 : 0);
  let running = 0;
  return rows.map(r=>{
    running += isCustomers ? (r.debit-r.credit) : (r.credit-r.debit);
    return Object.assign({}, r, {balance:running});
  });
}
function esc0(v){ return v==null ? "" : String(v); }

function confirmReconciliation(kind, partyId){
  if(!canEditTab("statement")){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  const party = DB[kind].find(p=>p.id===partyId);
  if(!party) return;
  const bal = partyBalance(kind, party.id);
  if(!confirm('تأكيد إن رصيد "'+party.name+'" الحالي ('+money(Math.abs(bal))+') مطابق لسجلاته الفعلية؟')) return;
  party.lastReconciledAt = new Date().toISOString();
  party.lastReconciledBalance = bal;
  party.lastReconciledBy = currentUser() ? currentUser().displayName : "";
  logActivity("تأكيد مطابقة حساب", party.name+" — "+money(Math.abs(bal)));
  saveDB(); render();

function generateQRDataUrl(text, size){
  if(typeof QRCode === "undefined" || !text) return null;
  try{
    const div = document.createElement("div");
    div.style.position = "absolute";
    div.style.left = "-9999px";
    document.body.appendChild(div);
    new QRCode(div, {text:text, width:size||120, height:size||120, correctLevel:QRCode.CorrectLevel.M});
    let dataUrl = null;
    const canvas = div.querySelector("canvas");
    const img = div.querySelector("img");
    if(canvas) dataUrl = canvas.toDataURL("image/png");
    else if(img) dataUrl = img.src;
    document.body.removeChild(div);
    return dataUrl;
  }catch(e){ return null; }
}

/* كشف حساب موحّد لجهة مرتبطة كعميل ومورد معًا — يدمج حركتيه (المبيعات/التحصيل
   كعميل، والمشتريات/السداد كمورد) في جدول زمني واحد برصيد صافٍ موحّد */
function printCombinedStatement(){
  const kind = ui.statementPartyKind;
  const party = DB[kind].find(p=>p.id===ui.statementPartyId);
  if(!party || !party.linkedPartyId) return;
  const otherKind = kind==="customers" ? "suppliers" : "customers";
  const other = DB[otherKind].find(x=>x.id===party.linkedPartyId);
  if(!other) return;
  const custParty = kind==="customers" ? party : other;
  const supParty = kind==="customers" ? other : party;

  const custRows = buildStatementRows("customers", custParty.id).map(r=>Object.assign({}, r, {role:"عميل"}));
  const supRows = buildStatementRows("suppliers", supParty.id).map(r=>Object.assign({}, r, {role:"مورد"}));
  const merged = custRows.concat(supRows).sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1 : (a.role<b.role?-1:1));

  let running = 0;
  const finalRows = merged.map(r=>{
    running += (Number(r.debit)||0) - (Number(r.credit)||0);
    return Object.assign({}, r, {netBalance: running});
  });

  const totalDebit = finalRows.reduce((s,r)=>s+(Number(r.debit)||0),0);
  const totalCredit = finalRows.reduce((s,r)=>s+(Number(r.credit)||0),0);
  const finalNet = finalRows.length ? finalRows[finalRows.length-1].netBalance : 0;
  const sideLabel = finalNet>=0 ? "لصالح الشركة (صافي مستحق لنا)" : "لصالح الطرف الآخر (صافي مستحق عليه لنا)";

  const theme = byId("print-theme") ? byId("print-theme").value : "classic";
  const note = byId("print-note") ? byId("print-note").value.trim() : "";
  const showWatermark = byId("print-watermark") ? byId("print-watermark").checked : false;
  const company = loadCompanyInfo();
  const stmtNumber = "STM-CMB-" + todayISO().replace(/-/g,"") + "-" + String(party.id).slice(-4).toUpperCase();

  let rowsHtml = "";
  finalRows.forEach(r=>{
    rowsHtml += '<tr><td>'+fmtDate(r.date)+'</td><td>'+esc(r.desc)+'</td>' +
      '<td class="tleft">'+esc(r.role)+'</td>' +
      '<td class="tleft">'+(r.debit?money(r.debit):"")+'</td>' +
      '<td class="tleft">'+(r.credit?money(r.credit):"")+'</td>' +
      '<td class="tleft">'+money(Math.abs(r.netBalance))+' '+(r.netBalance>=0?"لنا":"عليه")+'</td></tr>';
  });
  if(finalRows.length===0){
    rowsHtml = '<tr><td colspan="6" style="text-align:center;">لا توجد حركة على هذا الحساب</td></tr>';
  }

  const html =
    '<div class="print-doc theme-'+theme+'">' +
      (showWatermark ? '<div class="print-watermark">نسخة إلكترونية</div>' : '') +
      printHeadHtml(company, "كشف حساب موحّد (عميل + مورد)", stmtNumber) +
      '<div class="print-row"><span>اسم الجهة:</span><b>'+esc(party.name)+'</b></div>' +
      (custParty.phone||supParty.phone ? '<div class="print-row"><span>رقم الهاتف:</span><b>'+esc(custParty.phone||supParty.phone||"")+'</b></div>':'') +
      '<div class="print-row"><span>مُسجَّل كعميل باسم:</span><b>'+esc(custParty.name)+'</b></div>' +
      '<div class="print-row"><span>مُسجَّل كمورد باسم:</span><b>'+esc(supParty.name)+'</b></div>' +
      '<table class="print-table"><thead><tr><th>التاريخ</th><th>البيان</th><th class="tleft">الحساب</th><th class="tleft">مدين</th><th class="tleft">دائن</th><th class="tleft">الرصيد الموحّد</th></tr></thead><tbody>' +
        rowsHtml +
      '</tbody><tfoot><tr><td colspan="3">الإجمالي</td><td class="tleft">'+money(totalDebit)+'</td><td class="tleft">'+money(totalCredit)+'</td><td class="tleft">'+money(Math.abs(finalNet))+'</td></tr></tfoot></table>' +
      '<div class="print-row" style="margin-top:14px; border-bottom:none;"><span>الرصيد الختامي الموحّد:</span><b>'+money(Math.abs(finalNet))+' ج.م — '+sideLabel+'</b></div>' +
      (note ? '<div class="print-note">'+esc(note)+'</div>' : '') +
      printSignHtml("توقيع الطرف الآخر") +
    '</div>';
  openPrintArea(html);
}

/* ينظّف اسم الملف من أي رموز ممنوعة في أسماء الملفات على أغلب الأنظمة
   (زي / اللي بتتحوّل لمسار فرعي وتكسر التنزيل) — بعض أسماء العملاء/
   الموردين بتحتوي على "/" (مثلاً "أحمد / إخوانه") وده كان يسبب نزول
   ملف فاضي أو تالف بدون أي رسالة خطأ ظاهرة */
function safeFilename(name){

}

}
/* تصدير كل قاعدة البيانات دفعة واحدة، كل جدول في ورقة منفصلة */
function exportFullDatabaseExcel(){
  if(!ensureExcelLib()) return;
  const wb = XLSX.utils.book_new();
  function addSheet(name, rows, headers){
    const data = [headers].concat(rows);
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws["!views"] = [{RTL:true}];
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
  }
  addSheet("شجرة الحسابات", DB.accounts.map(a=>[a.code,a.name,ACCOUNT_TYPES[a.type]?ACCOUNT_TYPES[a.type].label:a.type,a.normal==="debit"?"مدينة":"دائنة"]), ["الكود","الاسم","التصنيف","الطبيعة"]);
  const accMap = accountsById();
  const entryRows = [];
  DB.entries.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(e=>{
    e.lines.forEach(l=>{
      const acc = accMap[l.accountId];
      entryRows.push([e.entryNumber||"", fmtDate(e.date), e.description||"", acc?acc.code+" - "+acc.name:"", l.debit||0, l.credit||0, e.isAdjustment?"تسوية":"عادي"]);
    });
  });

function exportStatementExcel(){
  if(!ensureExcelLib()) return;
  const kind = ui.statementPartyKind;
  const party = DB[kind].find(p=>p.id===ui.statementPartyId);
  if(!party){ alert("اختر عميلًا أو موردًا أولًا قبل التصدير."); return; }
  const isCustomers = kind==="customers";
  const rows = buildStatementRows(kind, party.id);
  if(rows.length===0){
    alert('لا توجد أي حركات مسجَّلة على حساب "'+party.name+'" حتى الآن — لا يوجد ما يُصدَّر.');
    return;
  }
  const totalDebit = rows.reduce((s,r)=>s+r.debit,0);
  const totalCredit = rows.reduce((s,r)=>s+r.credit,0);
  const finalBalance = rows.length ? rows[rows.length-1].balance : 0;
  const sideLabel = finalBalance>=0
    ? (isCustomers?"مدين (مستحق للشركة)":"دائن (مستحق للمورد)")
    : (isCustomers?"دائن (رصيد له)":"مدين (رصيد لنا)");

  const data = [
    ["الفردوس للنقل والتوريد"],
    ["كشف حساب " + (isCustomers?"عميل":"مورد") + ": " + party.name],
    ["تاريخ التصدير: " + fmtDate(todayISO())],
    [],
    ["التاريخ","البيان","الكمية","النولون","مدين","دائن","الرصيد"],
  ];
  rows.forEach(r=>{
    data.push([fmtDate(r.date), r.desc, r.quantity!=null?r.quantity:"", r.unitPrice!=null?r.unitPrice:"", r.debit || 0, r.credit || 0, Math.abs(r.balance)]);
  });
  data.push([]);
  data.push(["","","","الإجمالي", totalDebit, totalCredit, Math.abs(finalBalance)]);
  data.push(["","","","الرصيد الختامي","","", sideLabel]);

  const ws = XLSX.utils.aoa_to_sheet(data);
  ws["!cols"] = [{wch:12},{wch:30},{wch:10},{wch:12},{wch:14},{wch:14},{wch:16}];
  ws["!views"] = [{RTL:true}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "كشف الحساب");
  downloadWorkbook(wb, "كشف حساب - " + safeFilename(party.name) + ".xlsx");
}
