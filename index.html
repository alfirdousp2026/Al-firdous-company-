function consolidatedRows(kind){
  const isCustomers = kind==="customers";
  const regKey = isCustomers ? "sales" : "purchases";
  const field = isCustomers ? "customerId" : "supplierId";
  return DB[kind].filter(p=>!p.hiddenFromReports).map(p=>{
    const ops = DB[regKey].filter(r=>r[field]===p.id);
    const totalAmount = ops.reduce((s,r)=>s+(Number(r.amount)||0),0);
    const totalPaid = ops.reduce((s,r)=>s+(Number(r.paid)||0),0);
    const balance = partyBalance(kind, p.id);
    return {party:p, totalAmount, totalPaid, balance};
  });
}

function exportConsolidatedExcel(){
  if(!ensureExcelLib()) return;
  const kind = ui.consolidatedKind;
  const isCustomers = kind==="customers";
  const rows = consolidatedRows(kind);
  const totalOwedByThem = rows.filter(r=>partyBalanceDirection(kind,r.balance)==="owedToUs").reduce((s,r)=>s+Math.abs(r.balance),0);
  const totalOwedToThem = rows.filter(r=>partyBalanceDirection(kind,r.balance)==="weOwe").reduce((s,r)=>s+Math.abs(r.balance),0);

  const data = [
    ["الفردوس للنقل والتوريد"],
    ["كشف مجمع " + (isCustomers?"العملاء":"الموردين")],
    ["تاريخ التصدير: " + fmtDate(todayISO())],
    [],
    ["الاسم","إجمالي العمليات","المسدد","الرصيد","الحالة"],
  ];
  rows.forEach(r=>{
    const status = partyStatusText(kind, r.balance, true);
    data.push([r.party.name, r.totalAmount || 0, r.totalPaid || 0, Math.abs(r.balance), status]);
  });
  const totAmount = rows.reduce((s,r)=>s+r.totalAmount,0);
  const totPaid = rows.reduce((s,r)=>s+r.totalPaid,0);
  data.push([]);
  data.push(["الإجمالي", totAmount, totPaid, Math.abs(totalOwedByThem-totalOwedToThem), ""]);
  data.push(["إجمالي المستحق لنا","","",totalOwedByThem,""]);
  data.push(["إجمالي المستحق علينا","","",totalOwedToThem,""]);

  const ws = XLSX.utils.aoa_to_sheet(data);
  ws["!cols"] = [{wch:26},{wch:16},{wch:14},{wch:14},{wch:18}];
  ws["!views"] = [{RTL:true}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "كشف مجمع");
  downloadWorkbook(wb, "كشف مجمع " + (isCustomers?"العملاء":"الموردين") + ".xlsx");
}

function openVoucherForm(type, id){
  const isReceipt = type==="receipt";
  const key = isReceipt ? "receipts" : "payments";
  const partyKindKey = isReceipt ? "customers" : "suppliers";
  const cashAccounts = DB.accounts.filter(a=> a.type==="asset" && a.normal==="debit");
  const defaultPartyAccount = isReceipt
    ? (DB.accounts.find(a=>a.code==="10003")||null)
    : (DB.accounts.find(a=>a.code==="20001")||null);
  if(id){
    const r = DB[key].find(x=>x.id===id);
    ui.voucherForm = Object.assign({type}, r, { partyKind: r.partyKind==="other" ? "other" : partyKindKey });
  }else{
    ui.voucherForm = {
      type, id:null, number: nextVoucherNumber(type),
      date: todayISO(), partyKind: partyKindKey, partyId:"", partyName:"",
      description:"", amount:"",
      cashAccountId:(cashAccounts[0]&&cashAccounts[0].id)||"",
      partyAccountId:(defaultPartyAccount&&defaultPartyAccount.id)||"",
    };
  }
  render();
}
function saveVoucherForm(type){
  if(!canEditTab((type==="receipt"?"receipts":"payments"))){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  syncVoucherFormFromDOM();
  const f = ui.voucherForm;
  const isReceipt = type==="receipt";
  const key = isReceipt ? "receipts" : "payments";
  const partyKindKey = isReceipt ? "customers" : "suppliers";
  const amount = Number(f.amount)||0;

  if(!amount){ alert("الرجاء إدخال المبلغ"); return; }
  if(!f.cashAccountId){ alert("اختر حساب الخزينة/البنك"); return; }

  let partyAccountId = f.partyAccountId;
  let partyName = "";
  if(f.partyKind==="other"){
    if(!partyAccountId){ alert("اختر الحساب المرتبط"); return; }
    partyName = (f.partyName||"").trim() || "جهة أخرى";
  }else{
    if(!f.partyId){ alert("اختر "+(isReceipt?"العميل":"المورد")); return; }
    const p = DB[partyKindKey].find(x=>x.id===f.partyId);
    partyName = p ? p.name : "";
    if(!partyAccountId){
      const def = DB.accounts.find(a=>a.code===(isReceipt?"10003":"20001"));
      partyAccountId = def ? def.id : "";
    }
  }
  if(!partyAccountId){ alert("تعذر تحديد الحساب المرتبط بهذه العملية"); return; }
  if(checkPeriodLock(f.date, "حفظ هذا السند")) return;
  const dup = DB[key].find(x=> String(x.number)===String(f.number) && x.id!==f.id);
  if(dup){ alert("⚠️ رقم السند ("+f.number+") مستخدم بالفعل لسند آخر. تم إلغاء الحفظ لتفادي التكرار — أعد فتح النموذج للحصول على رقم صحيح."); return; }

  const record = {
    id: f.id, number: f.number, date: f.date,
    partyKind: f.partyKind==="other" ? "other" : partyKindKey,
    partyId: f.partyKind==="other" ? "" : f.partyId,
    partyName, description:(f.description||"").trim(),
    amount, cashAccountId:f.cashAccountId, partyAccountId,
  };

  if(f.id){
    const idx = DB[key].findIndex(x=>x.id===f.id);
    DB[key][idx] = record;
    logActivity("تعديل "+(isReceipt?"سند قبض":"سند صرف"), (partyName||"")+" — "+money(amount));
  }else{
    record.id = uid(isReceipt?"rc":"pv");
    DB[key].push(record);
    logActivity("إضافة "+(isReceipt?"سند قبض":"سند صرف"), (partyName||"")+" — "+money(amount));
  }
  upsertVoucherEntry(record, type);
  ui.voucherForm = null;
  saveDB(); render();
}
function buildVoucherLines(record, type){
  const isReceipt = type==="receipt";
  const amount = Number(record.amount)||0;
  if(!amount || !record.cashAccountId || !record.partyAccountId) return [];
  return isReceipt
    ? [{accountId:record.cashAccountId, debit:amount, credit:0}, {accountId:record.partyAccountId, debit:0, credit:amount}]
    : [{accountId:record.partyAccountId, debit:amount, credit:0}, {accountId:record.cashAccountId, debit:0, credit:amount}];
}
function upsertVoucherEntry(record, type){
  DB.entries = DB.entries.filter(e => !(e.autoGenerated && e.sourceType===type && e.sourceId===record.id));
  pushEntry({
    id: uid("e"), date: record.date,
    description: (type==="receipt" ? "سند قبض رقم "+record.number : "سند صرف رقم "+record.number) +
      (record.partyName ? " - "+record.partyName : "") + (record.description ? " ("+record.description+")" : ""),
    isAdjustment:false, autoGenerated:true, sourceType:type, sourceId:record.id,
    lines: buildVoucherLines(record, type),
  });
}
function removeVoucherEntry(type, recordId){
  DB.entries = DB.entries.filter(e => !(e.autoGenerated && e.sourceType===type && e.sourceId===recordId));
}
function deleteVoucherRecord(type, id){
  if(!canEditTab((type==="receipt"?"receipts":"payments"))){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  const key = type==="receipt" ? "receipts" : "payments";
  const rec = DB[key].find(x=>x.id===id);
  if(rec && checkPeriodLock(rec.date, "حذف هذا السند")) return;
  if(!confirm("هل تريد حذف هذا السند؟ سيتم حذف القيد المرتبط به أيضًا.")) return;
  if(rec) moveToTrash(key, rec, "رقم "+rec.number+" — "+money(rec.amount||0));
  DB[key] = DB[key].filter(x=>x.id!==id);
  removeVoucherEntry(type, id);
  logActivity("حذف "+(type==="receipt"?"سند قبض":"سند صرف"), "");
  saveDB(); render();
}

const LAST_BACKUP_KEY = "ferdaws-last-backup-v1";
function countAll(){
  return (DB.entries||[]).length + (DB.customers||[]).length + (DB.suppliers||[]).length +
    (DB.sales||[]).length + (DB.purchases||[]).length + (DB.receipts||[]).length + (DB.payments||[]).length;

/* ======================================================================
   12أ) النسخ الاحتياطي التلقائي بالبريد الإلكتروني (عبر خدمة EmailJS)
   ====================================================================== */
const EMAIL_BACKUP_CONFIG_KEY = "ferdaws-email-backup-config-v1";
const LAST_EMAIL_BACKUP_KEY = "ferdaws-last-email-backup-v1";
const LAST_EMAIL_BACKUP_STATUS_KEY = "ferdaws-last-email-backup-status-v1";
function loadEmailBackupConfig(){
  try{
    const cfg = JSON.parse(localStorage.getItem(EMAIL_BACKUP_CONFIG_KEY));
    return Object.assign({enabled:false, serviceId:"", templateId:"", publicKey:"", toEmail:"", frequencyDays:7}, cfg||{});
  }catch(e){
    return {enabled:false, serviceId:"", templateId:"", publicKey:"", toEmail:"", frequencyDays:7};
  }
}
function saveEmailBackupConfigObj(cfg){
  localStorage.setItem(EMAIL_BACKUP_CONFIG_KEY, JSON.stringify(cfg));
}
function daysSinceLastEmailBackup(){
  const last = localStorage.getItem(LAST_EMAIL_BACKUP_KEY);
  if(!last) return Infinity;
  return (Date.now() - new Date(last).getTime()) / (1000*60*60*24);
}
function saveEmailBackupSettings(){
  const cfg = {
    enabled: true,
    serviceId: byId("eb-service").value.trim(),
    templateId: byId("eb-template").value.trim(),
    publicKey: byId("eb-key").value.trim(),
    toEmail: byId("eb-email").value.trim(),
    frequencyDays: Number(byId("eb-freq").value) || 7,
  };
  if(!cfg.serviceId || !cfg.templateId || !cfg.publicKey || !cfg.toEmail){
    alert("الرجاء تعبئة كل الحقول (Service ID، Template ID، Public Key، والبريد الإلكتروني المستقبِل).");
    return;
  }
  saveEmailBackupConfigObj(cfg);
  alert("✔ تم حفظ إعدادات الإرسال التلقائي وتفعيلها. سيُرسَل أول نسخة الآن للتأكد من صحة الإعداد.");
  sendBackupByEmail(false);
  render();
}
function disableEmailBackup(){
  const cfg = loadEmailBackupConfig();
  cfg.enabled = false;
  saveEmailBackupConfigObj(cfg);
  render();
}
function sendBackupByEmail(auto){
  const cfg = loadEmailBackupConfig();
  if(!cfg.serviceId || !cfg.templateId || !cfg.publicKey || !cfg.toEmail){
    if(!auto) alert("استكمل بيانات إعداد البريد الإلكتروني أولاً.");
    return;
  }
  if(typeof emailjs === "undefined"){
    localStorage.setItem(LAST_EMAIL_BACKUP_STATUS_KEY, "تعذر تحميل مكتبة الإرسال (تحقق من الاتصال بالإنترنت)");
    if(!auto) alert("تعذر تحميل مكتبة الإرسال. تأكد من الاتصال بالإنترنت وحاول مرة أخرى.");
    else renderEmailBackupStatusIfVisible();
    return;
  }
  const stamp = todayISO();
  const payload = { app: "الفردوس للنقل والتوريد", exportedAt: new Date().toISOString(), data: DB };
  const jsonStr = JSON.stringify(payload);
  let base64 = "";
  try{ base64 = "data:application/json;base64," + btoa(unescape(encodeURIComponent(jsonStr))); }
  catch(e){ base64 = ""; }
  const params = {
    to_email: cfg.toEmail,
    subject: "نسخة احتياطية - الفردوس للنقل والتوريد - " + stamp,
    message: "نسخة احتياطية تلقائية بتاريخ " + stamp + ". عدد السجلات الحالية: " + countAll() + ".",
    backup_filename: "نسخة-احتياطية-الفردوس-" + stamp + ".json",
    attachment: base64,
  };
  try{ emailjs.init(cfg.publicKey); }catch(e){}
  emailjs.send(cfg.serviceId, cfg.templateId, params).then(function(){
    localStorage.setItem(LAST_EMAIL_BACKUP_KEY, new Date().toISOString());
    localStorage.setItem(LAST_EMAIL_BACKUP_STATUS_KEY, "success");
    if(!auto){ alert("✔ تم إرسال النسخة الاحتياطية بالبريد الإلكتروني بنجاح."); render(); }
    else renderEmailBackupStatusIfVisible();
  }).catch(function(err){
    const msg = (err && (err.text || err.message)) ? (err.text || err.message) : "خطأ غير معروف. تأكد من صحة بيانات EmailJS.";
    localStorage.setItem(LAST_EMAIL_BACKUP_STATUS_KEY, "فشل: " + msg);
    if(!auto){ alert("تعذر الإرسال بالبريد: " + msg); render(); }
    else renderEmailBackupStatusIfVisible();
  });
}
function renderEmailBackupStatusIfVisible(){
  if(ui.tab==="backup"){

function handleLogoUpload(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  if(!file.type.startsWith("image/")){ alert("الرجاء اختيار ملف صورة."); return; }
  if(file.size > 900*1024){ alert("حجم الصورة كبير جدًا. اختر صورة أصغر من 900 كيلوبايت لضمان أداء جيد."); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const info = loadCompanyInfo();
    info.logoDataUrl = e.target.result;
    saveCompanyInfoObj(info);
    logActivity("تحديث شعار الشركة", "");
    render();
    applySidebarLogo();
  };
  reader.readAsDataURL(file);
}
function removeLogo(){
  if(!confirm("هل تريد إزالة شعار الشركة من المستندات المطبوعة؟")) return;
  const info = loadCompanyInfo();
  delete info.logoDataUrl;
  saveCompanyInfoObj(info);

  applySidebarLogo();
}

function exportPeriodArchive(){
  if(!can("resetData")){ alert("هذا الإجراء متاح لمدير النظام فقط."); return; }
  const from = byId("archive-from").value;
  const to = byId("archive-to").value;
  if(!from || !to){ alert("الرجاء اختيار تاريخ البداية والنهاية"); return; }
  if(from>to){ alert("تاريخ البداية يجب أن يكون قبل تاريخ النهاية أو يساويه"); return; }
  if(!DB.periodLockDate || to>DB.periodLockDate){
    alert("⛔ لا يمكن أرشفة فترة غير مقفلة بالكامل. اقفل الفترة المحاسبية حتى تاريخ "+fmtDate(to)+" على الأقل أولاً من قسم \"قفل الفترات المحاسبية\".");
    return;
  }
  const archiveData = {};
  let totalRecords = 0;
  Object.keys(ARCHIVABLE_COLLECTIONS).forEach(key=>{
    const dateFn = ARCHIVABLE_COLLECTIONS[key];
    const rows = (DB[key]||[]).filter(r=>{ const d = dateFn(r); return d && d>=from && d<=to; });
    archiveData[key] = rows;
    totalRecords += rows.length;
  });
  if(totalRecords===0){ alert("لا توجد أي عمليات ضمن هذه الفترة."); return; }
  const payload = {
    app: "الفردوس للنقل والتوريد",
    kind: "period-archive",
    range: {from, to},
    exportedAt: new Date().toISOString(),
    recordCount: totalRecords,
    /* بيانات مرجعية كاملة (أسماء عملاء/موردين/سائقين...) لازمة لقراءة الأرشيف لاحقًا بمعزل عن التطبيق الحيّ */
    reference: {
      accounts: DB.accounts, customers: DB.customers, suppliers: DB.suppliers,
      drivers: DB.drivers, helpers: DB.helpers, vehicles: DB.vehicles,
    },
    data: archiveData,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "أرشيف-الفردوس-"+from+"-الى-"+to+".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  logActivity("تنزيل أرشيف فترة", fmtDate(from)+" — "+fmtDate(to)+" ("+totalRecords+" سجل)");
  alert("✔ تم تنزيل الأرشيف ("+totalRecords+" سجل). البيانات مازالت موجودة في التطبيق كما هي — الأرشفة هنا للتصدير فقط ولا تحذف شيئًا من القاعدة الحيّة.");
}

function importBackup(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let parsed;
    try{
      parsed = JSON.parse(e.target.result);
    }catch(err){
      alert("تعذّر قراءة الملف. تأكد أنه ملف نسخة احتياطية صحيح (JSON).");
      event.target.value = "";
      return;
    }
    const incoming = parsed && parsed.data ? parsed.data : parsed;
    if(!incoming || typeof incoming !== "object" || !Array.isArray(incoming.accounts)){
      alert("هذا الملف لا يبدو ملف نسخة احتياطية صالحًا لهذا التطبيق.");
      event.target.value = "";
      return;
    }
    const summary = "سيتم استبدال كل البيانات الحالية بالبيانات التالية من الملف:\n" +
      "- الحسابات: " + (incoming.accounts||[]).length + "\n" +
      "- القيود: " + (incoming.entries||[]).length + "\n" +
      "- العملاء: " + (incoming.customers||[]).length + "\n" +
      "- الموردون: " + (incoming.suppliers||[]).length + "\n" +
      "- كشف المبيعات: " + (incoming.sales||[]).length + "\n" +
      "- كشف المشتريات: " + (incoming.purchases||[]).length + "\n" +
      "- سندات القبض: " + (incoming.receipts||[]).length + "\n" +
      "- سندات الصرف: " + (incoming.payments||[]).length + "\n\n" +
      "هل تريد المتابعة؟";
    if(!confirm(summary)){
      event.target.value = "";
      return;
    }
    DB = Object.assign({}, emptyDB, incoming);
    migrateAccountCodes();
    seedMissingDefaultAccounts();
    syncAllPartyAccounts();
    refreshAllRegisterEntryLabels();
    recomputeCOGS();
    saveDB();
    if((loadSyncConfig()||{}).enabled) pushToCloud(true); /* استرجاع النسخة الاحتياطية = نية صريحة بالاستبدال، فترفع للسحابة بالقوة بدون فحص تعارض */
    ui.tab = "dashboard";
    ui.entryForm=null; ui.accountForm=null; ui.partyForm=null; ui.registerForm=null; ui.voucherForm=null;
    render();
    alert("✔ تم استرجاع النسخة الاحتياطية بنجاح");
    event.target.value = "";
  };
  reader.onerror = function(){
    alert("حدث خطأ أثناء قراءة الملف");
    event.target.value = "";
  };
  reader.readAsText(file, "UTF-8");
}

function moveToTrash(kind, record, label, batchId){
  DB.trash = DB.trash || [];
  const entry = { id:uid("tr"), kind, record: JSON.parse(JSON.stringify(record)),
    label: label||"", deletedAt: new Date().toISOString(),
    deletedBy: currentUser() ? currentUser().displayName : "",
    batchId: batchId || null };
  DB.trash.push(entry);
  if(DB.trash.length>400) DB.trash = DB.trash.slice(-400);
  if(!batchId) showUndoToast(entry.id, null, trashKindLabel(kind), label);
  return entry.id;
}
let undoToastTimer = null;
/* شريط عائم أسفل الشاشة يظهر فورًا بعد أي عملية حذف، ويتيح التراجع عنها
   بضغطة واحدة دون الحاجة للذهاب إلى صفحة "سلة المحذوفات" — وإن فات الوقت
   (7 ثوانٍ) يبقى العنصر محفوظًا هناك ويمكن استرجاعه في أي وقت لاحق */
function showUndoToast(trashId, batchId, kindLabel, itemLabel){
  let el = document.getElementById("undoToast");
  if(!el){
    el = document.createElement("div");
    el.id = "undoToast";
    el.className = "undo-toast";
    document.body.appendChild(el);
  }
  const text = "تم حذف " + esc(kindLabel||"") + (itemLabel ? " — " + esc(itemLabel) : "");
  const action = batchId
    ? "undoToastRestoreBatch('"+batchId+"')"
    : "undoToastRestore('"+trashId+"')";
  el.innerHTML = '<span>🗑️ '+text+'</span>' +
    '<button onclick="'+action+'">↩️ تراجع</button>' +
    '<button class="undo-toast-close" onclick="hideUndoToast()" title="إغلاق">✕</button>';
  el.classList.add("show");
  if(undoToastTimer) clearTimeout(undoToastTimer);
  undoToastTimer = setTimeout(hideUndoToast, 7000);
}
function hideUndoToast(){
  const el = document.getElementById("undoToast");
  if(el) el.classList.remove("show");
  if(undoToastTimer){ clearTimeout(undoToastTimer); undoToastTimer = null; }
}
function undoToastRestore(trashId){
  hideUndoToast();
  restoreFromTrash(trashId, true);
}
function undoToastRestoreBatch(batchId){
  hideUndoToast();
  restoreBatch(batchId, true);
}
function trashKindLabel(kind){
  const map = { entries:"قيد يومية", accounts:"حساب", customers:"عميل", suppliers:"مورد",
    sales:"عملية بيع", purchases:"عملية شراء", receipts:"سند قبض", payments:"سند صرف",
    checks:"شيك", drivers:"سائق", helpers:"مساعد", vehicles:"مركبة" };
  return map[kind] || kind;
}
function trashKindToTab(kind){
  const map = {entries:"journal", accounts:"accounts", customers:"customers", suppliers:"suppliers",
    sales:"salesReg", purchases:"purchases", receipts:"receipts", payments:"payments",
    checks:"checks", drivers:"custody", helpers:"custody", vehicles:"fleet"};
  return map[kind] || kind;
}
function restoreTrashItem(item){
  DB[item.kind] = DB[item.kind] || [];
  DB[item.kind].push(item.record);
  if(item.kind==="sales" || item.kind==="purchases"){
    const party = item.kind==="sales" ? DB.customers.find(c=>c.id===item.record.customerId) : DB.suppliers.find(s=>s.id===item.record.supplierId);
    upsertRegisterEntry(item.record, item.kind==="sales", party?party.name:"");
    recomputeCOGS();
  }
  if(item.kind==="receipts" || item.kind==="payments"){
    upsertVoucherEntry(item.record, item.kind==="receipts"?"receipt":"payment");
  }
  if(PARTY_ACCOUNT_META[item.kind]){
    // عند استرجاع عميل/مورد/سائق/مساعد من سلة المحذوفات، أعد ربطه بحسابه الفرعي
    // في شجرة الحسابات (يعيد إحياء الحساب القديم إن كان لا يزال موجودًا، أو ينشئ حسابًا جديدًا)
    const oldAccId = item.record.accountId;
    if(oldAccId){
      const oldAcc = DB.accounts.find(a=>a.id===oldAccId);
      if(oldAcc && !oldAcc.partyKind){
        oldAcc.partyKind = item.kind; oldAcc.partyId = item.record.id;
        oldAcc.name = oldAcc.name.replace(/ \(محذوف\)$/, "");
      }
    }
    ensurePartyAccount(item.kind, item.record);
  }
}
function restoreFromTrash(trashId, skipConfirm){
  const item = (DB.trash||[]).find(t=>t.id===trashId);
  if(!item) return;
  if(!canEditTab(trashKindToTab(item.kind))){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  if(!skipConfirm && !confirm("استرجاع هذا العنصر إلى مكانه الأصلي؟")) return;
  restoreTrashItem(item);
  DB.trash = DB.trash.filter(t=>t.id!==trashId);
  logActivity("استرجاع من سلة المحذوفات", trashKindLabel(item.kind)+" — "+(item.label||""));
  saveDB(); render();
}
function permanentlyDeleteTrash(trashId){
  if(!can("resetData")){ alert("⛔ الحذف النهائي متاح لمدير النظام فقط."); return; }
  if(!confirm("حذف نهائي — لا يمكن التراجع عن هذا الإجراء. متابعة؟")) return;
  DB.trash = (DB.trash||[]).filter(t=>t.id!==trashId);
  saveDB(); render();
}
function restoreBatch(batchId, skipConfirm){
  const items = (DB.trash||[]).filter(t=>t.batchId===batchId);
  if(!items.length) return;
  const blocked = items.some(it=>!canEditTab(trashKindToTab(it.kind)));
  if(blocked){ alert("⛔ ليس لديك صلاحية التعديل في أحد أقسام هذه الدفعة."); return; }
  if(!skipConfirm && !confirm("استرجاع كل عناصر هذه الدفعة ("+items.length+" سجل) إلى أماكنها الأصلية؟")) return;
  items.forEach(item=> restoreTrashItem(item));
  DB.trash = (DB.trash||[]).filter(t=>t.batchId!==batchId);
  logActivity("استرجاع دفعة من سلة المحذوفات", items.length+" سجل");
  saveDB(); render();
}
function deleteBatchPermanently(batchId){
  if(!can("resetData")){ alert("⛔ الحذف النهائي متاح لمدير النظام فقط."); return; }
  const items = (DB.trash||[]).filter(t=>t.batchId===batchId);
  if(!items.length) return;
  if(!confirm("حذف نهائي لكل عناصر هذه الدفعة ("+items.length+" سجل) — لا يمكن التراجع عن هذا. متابعة؟")) return;
  DB.trash = (DB.trash||[]).filter(t=>t.batchId!==batchId);
  saveDB(); render();
}
function renderTrashBin(){

/* ======================================================================
   صيانة استباقية بناءً على المسافة المقطوعة (العداد)
   ====================================================================== */
function vehicleMaintenanceStatus(v){
  const interval = Number(v.maintenanceIntervalKm)||0;
  const odo = Number(v.currentOdometer)||0;
  const lastServiceOdo = (DB.maintenanceLogs||[])
    .filter(m=>m.vehicleId===v.id && m.type==="صيانة" && Number(m.odometer)>0)
    .reduce((max,m)=> Math.max(max, Number(m.odometer)||0), 0);
  if(interval<=0) return {interval:0, remainingKm:0, due:false, dueSoon:false};
  const sinceService = odo - lastServiceOdo;
  const remainingKm = interval - sinceService;
  return { interval, lastServiceOdo, odo, remainingKm, due: remainingKm<=0, dueSoon: remainingKm>0 && remainingKm<=interval*0.1 };
}

/* ======================================================================
   قيود اليومية المتكررة (تُنشأ تلقائيًا حسب دورية محددة)
   ====================================================================== */
function computeNextRunDate(fromDate, frequency){
  const d = new Date((fromDate||todayISO())+"T00:00:00");
  if(frequency==="weekly") d.setDate(d.getDate()+7);
  else if(frequency==="yearly") d.setFullYear(d.getFullYear()+1);
  else d.setMonth(d.getMonth()+1); /* monthly (افتراضي) */
  return d.toISOString().slice(0,10);
}

function syncRecurringFormFromDOM(){
  if(!ui.recurringForm) return;
  ui.recurringForm.description = byId("rec-desc") ? byId("rec-desc").value : ui.recurringForm.description;
  ui.recurringForm.frequency = byId("rec-freq") ? byId("rec-freq").value : ui.recurringForm.frequency;
  ui.recurringForm.nextRunDate = byId("rec-next") ? byId("rec-next").value : ui.recurringForm.nextRunDate;
  ui.recurringForm.active = byId("rec-active") ? byId("rec-active").value==="1" : ui.recurringForm.active;
  const rows = document.querySelectorAll(".rec-line-row");
  if(rows.length){
    const lines = [];
    rows.forEach(row=> lines.push({
      accountId: row.querySelector(".line-acc").value,
      debit: row.querySelector(".line-deb").value,
      credit: row.querySelector(".line-cred").value,

function recurringRemoveLine(i){ syncRecurringFormFromDOM(); ui.recurringForm.lines.splice(i,1); render(); }
function recurringLineChanged(){
  let totalDebit=0, totalCredit=0;
  document.querySelectorAll(".rec-line-row").forEach(row=>{
    totalDebit += Number(row.querySelector(".line-deb").value)||0;
    totalCredit += Number(row.querySelector(".line-cred").value)||0;
  });
  const balanced = Math.abs(totalDebit-totalCredit)<0.005 && totalDebit>0;
  const el = byId("rec-totals");
  if(el){ el.style.color = balanced?"#059669":"#e11d48"; el.textContent = "مدين: "+money(totalDebit)+" — دائن: "+money(totalCredit); }
  const btn = byId("rec-save-btn");
  if(btn) btn.disabled = !balanced;
}
function saveRecurringForm(){
  if(!canEditTab("recurring")){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); return; }
  syncRecurringFormFromDOM();
  const f = ui.recurringForm;
  const totalDebit = f.lines.reduce((s,l)=>s+(Number(l.debit)||0),0);
  const totalCredit = f.lines.reduce((s,l)=>s+(Number(l.credit)||0),0);
  if(!(Math.abs(totalDebit-totalCredit)<0.005 && totalDebit>0)){ alert("القالب غير متوازن"); return; }
  if(!f.description.trim()){ alert("الرجاء إدخال بيان للقالب"); return; }
  const cleanLines = f.lines.filter(l=>l.accountId && (Number(l.debit)||Number(l.credit)));
  if(f.id){
    const idx = DB.recurringTemplates.findIndex(x=>x.id===f.id);
    DB.recurringTemplates[idx] = Object.assign({}, DB.recurringTemplates[idx], {description:f.description, frequency:f.frequency, nextRunDate:f.nextRunDate, active:f.active, lines:cleanLines});
    logActivity("تعديل قالب قيد متكرر", f.description);
  }else{
    DB.recurringTemplates.push({id:uid("rec"), description:f.description, frequency:f.frequency, startDate:f.nextRunDate, nextRunDate:f.nextRunDate, active:f.active, lastRunDate:null, lines:cleanLines});
    logActivity("إضافة قالب قيد متكرر", f.description);
  }
  ui.recurringForm = null;
  saveDB(); render();
}

  DB.recurringTemplates = DB.recurringTemplates.filter(x=>x.id!==id);

function runOneRecurringTemplate(id){
  const t = DB.recurringTemplates.find(x=>x.id===id);
  if(!t) return;

    autoGenerated:true, sourceType:"recurring", sourceId:t.id, lines: JSON.parse(JSON.stringify(t.lines)) });
  t.lastRunDate = todayISO();
  t.nextRunDate = computeNextRunDate(t.nextRunDate, t.frequency);
  logActivity("ترحيل قيد متكرر", t.description);
  saveDB(); render();
}
function generateDueRecurringEntries(){
  const due = (DB.recurringTemplates||[]).filter(t=>t.active && t.nextRunDate<=todayISO());
  due.forEach(t=>{
    pushEntry({ id:uid("e"), date: todayISO(), description: t.description, isAdjustment:false,
      autoGenerated:true, sourceType:"recurring", sourceId:t.id, lines: JSON.parse(JSON.stringify(t.lines)) });
    t.lastRunDate = todayISO();
    t.nextRunDate = computeNextRunDate(t.nextRunDate, t.frequency);
  });
  if(due.length){ logActivity("ترحيل قيود متكررة مستحقة", due.length+" قالب(قوالب)"); saveDB(); render(); }
}

/* ======================================================================
   الموازنة التقديرية (Budget vs Actual)
   ====================================================================== */
function budgetActualForMonth(accountId, month){
  const entries = DB.entries.filter(e => (e.date||"").slice(0,7)===month);
  const bal = computeBalances(entries);
  const b = bal[accountId] || {debit:0, credit:0};
  const acc = DB.accounts.find(a=>a.id===accountId);
  if(!acc) return 0;
  return acc.type==="revenue" ? (b.credit-b.debit) : (b.debit-b.credit);
}
function renderBudget(){
  ui.budgetMonth = ui.budgetMonth || currentMonthKey();
  let html = sectionHead("🎯","الموازنة التقديرية","حدد مبلغًا متوقعًا لكل حساب إيراد/مصروف شهريًا، وقارنه بالفعلي المُرحَّل من القيود");
  html += '<div style="width:160px; margin-bottom:14px;"><label class="f-label">الشهر</label><input class="f-input" type="month" value="'+esc(ui.budgetMonth)+'" onchange="ui.budgetMonth=this.value; render();"/></div>';

  const month = ui.budgetMonth;
  const editable = canEditTab("budget");
  ["revenue","expense"].forEach(type=>{
    const accs = DB.accounts.filter(a=>a.type===type);
    html += '<div class="group-title"><span class="dot '+(type==="revenue"?"dot-emerald":"dot-rose")+'"></span>'+(type==="revenue"?"الإيرادات":"المصروفات")+'</div>';
    html += '<div class="table-wrap" style="margin-bottom:18px;"><table><thead><tr><th>الحساب</th><th class="tleft">الموازنة</th><th class="tleft">الفعلي</th><th class="tleft">الفرق</th><th class="tleft">النسبة</th></tr></thead><tbody>';
    let totalBudget=0, totalActual=0;
    accs.forEach(a=>{
      const rec = (DB.budgets||[]).find(b=>b.accountId===a.id && b.month===month);
      const budgetAmt = rec ? Number(rec.amount)||0 : 0;
      const actual = budgetActualForMonth(a.id, month);
      const diff = type==="revenue" ? (actual-budgetAmt) : (budgetAmt-actual);
      const pct = budgetAmt>0 ? Math.round((actual/budgetAmt)*100) : (actual>0?100:0);
      totalBudget+=budgetAmt; totalActual+=actual;
      html += '<tr><td>'+esc(a.name)+'</td>' +
        '<td class="tleft">'+(editable ? '<input class="f-input" style="width:120px; padding:4px 8px;" type="number" value="'+esc(budgetAmt||"")+'" onchange="saveBudgetAmount(\''+a.id+'\',\''+month+'\',this.value)"/>' : money(budgetAmt))+'</td>' +
        '<td class="tleft num">'+money(actual)+'</td>' +
        '<td class="tleft num" style="color:'+(diff>=0?"#059669":"#e11d48")+'; font-weight:700;">'+money(diff)+'</td>' +
        '<td class="tleft">'+(budgetAmt>0?pct+"%":"—")+'</td></tr>';
    });
    html += '<tfoot><tr><td>الإجمالي</td><td class="tleft num">'+money(totalBudget)+'</td><td class="tleft num">'+money(totalActual)+'</td><td class="tleft num">'+money(type==="revenue"?(totalActual-totalBudget):(totalBudget-totalActual))+'</td><td></td></tr></tfoot>';
    html += '</tbody></table></div>';
  });
  return html;
}
function saveBudgetAmount(accountId, month, value){
  if(!canEditTab("budget")){ alert("⛔ ليس لديك صلاحية التعديل في هذا القسم."); render(); return; }
  DB.budgets = DB.budgets || [];
  let rec = DB.budgets.find(b=>b.accountId===accountId && b.month===month);
  if(!rec){ rec = {id:uid("bud"), accountId, month, amount:0}; DB.budgets.push(rec); }
  rec.amount = Number(value)||0;
  saveDB(); render();
}

function sendCheckWhatsAppReminder(checkId){
  const c = DB.checks.find(x=>x.id===checkId);
  if(!c) return;
  const party = DB[c.partyKind] ? DB[c.partyKind].find(p=>p.id===c.partyId) : null;
  if(!party){ alert("تعذر تحديد الجهة المرتبطة بالشيك."); return; }
  const phone = normalizePhoneForWhatsApp(party.phone);
  if(!phone){ alert("لا يوجد رقم هاتف صالح مسجل لهذه الجهة."); return; }
  const overdue = c.dueDate < todayISO();
  const message = "تحية طيبة "+party.name+"،\n" +
    (overdue
      ? "نود تذكيركم بأن الشيك رقم "+ (c.checkNumber||"—") +" بمبلغ "+money(c.amount)+" ج.م قد تجاوز تاريخ استحقاقه ("+fmtDate(c.dueDate)+")، نرجو التواصل لسرعة التحصيل."
      : "نود تذكيركم بأن موعد استحقاق الشيك رقم "+(c.checkNumber||"—")+" بمبلغ "+money(c.amount)+" ج.م هو "+fmtDate(c.dueDate)+".") +
    "\nمع خالص الشكر — الفردوس للنقل والتوريد";
  const url = "https://wa.me/"+phone+"?text="+encodeURIComponent(message);
  window.open(url, "_blank");
  logActivity("إرسال تذكير شيك واتساب", party.name+" — "+(c.checkNumber||""));
}
/* ======================================================================
   الفاتورة الإلكترونية (مصر) — تصدير بيانات العملية بصيغة JSON مبسّطة
   تمهيدًا لرفعها يدويًا على منظومة مصلحة الضرائب المصرية (ETA).
   ملاحظة هامة: هذا تصدير مساعد فقط وليس ربطًا مباشرًا حيًا ببوابة ETA،
   لأن ذلك يتطلب شهادة رقمية ومعرّف دافع ضرائب وتوكن API خاص بمنشأتك.
   ====================================================================== */
function exportEInvoiceJSON(saleId){
  const s = DB.sales.find(x=>x.id===saleId);
  if(!s){ alert("تعذر العثور على عملية البيع"); return; }
  const customer = DB.customers.find(c=>c.id===s.customerId);
  const company = loadCompanyInfo();
  const vat = vatSettings();
  const amount = Number(s.amount)||(Number(s.quantity)||0)*(Number(s.unitPrice)||0);
  const vatAmount = vat && vat.rate ? amount*Number(vat.rate)/100 : 0;
  const payload = {
    issuer: { name: company.name||"", taxRegistrationNumber: company.taxId||"" },
    receiver: { name: customer?customer.name:"" },
    documentType: "I", documentTypeVersion: "1.0",
    dateTimeIssued: (s.date||todayISO())+"T00:00:00",
    invoiceLines: [{
      description: s.description || "خدمة/بضاعة",
      quantity: Number(s.quantity)||1,
      unitValue: { amountEGP: Number(s.unitPrice)||0 },
      salesTotal: amount,
      taxableItems: vatAmount>0 ? [{taxType:"T1", rate:Number(vat.rate)}] : [],
    }],
    totalAmount: amount + vatAmount,
    note: "تصدير مساعد لإعداد الفاتورة الإلكترونية — يحتاج مراجعة ورفع يدوي عبر بوابة ETA أو أداة الدمج الخاصة بمنشأتك.",
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "einvoice_"+(s.id)+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}



/* ======================================================================
   بوابة العميل/المورد المبسطة — يشوف كشف حسابه بدون تسجيل دخول
   طريقتان:
   1) نسخة فورية (Snapshot) — تعمل دائمًا بدون أي إعدادات إضافية: تنزيل
      ملف HTML قائم بذاته وإرساله مباشرة عبر واتساب/بريد.
   2) رابط حي يتحدث تلقائيًا — يحتاج تفعيل "مزامنة الأجهزة" (Firebase)
      مسبقًا، ويحتاج كذلك رفع هذا الملف على استضافة ويب (مثل GitHub Pages
      أو Firebase Hosting) حتى يقدر يفتحه من جهازه هو.
   ====================================================================== */
function getPortalDataForParty(kind, partyId){
  const isCustomer = kind==="customers";
  const p = DB[kind].find(x=>x.id===partyId);
  if(!p) return null;
  const company = loadCompanyInfo();
  const balance = partyBalance(kind, partyId);
  const regKind = isCustomer ? "sales" : "purchases";
  const regField = isCustomer ? "customerId" : "supplierId";
  const voucherKind = isCustomer ? "receipts" : "payments";
  const regRows = DB[regKind].filter(r=>r[regField]===partyId).map(r=>({
    date:r.date, type:isCustomer?"بيع":"شراء", description:r.description||"", amount:Number(r.amount)||0
  }));
  const voucherRows = (DB[voucherKind]||[]).filter(v=>v.partyKind===kind && v.partyId===partyId).map(v=>({
    date:v.date, type:isCustomer?"تحصيل":"دفعة",
    description:(isCustomer?"سند قبض رقم ":"سند صرف رقم ")+(v.number||""),
    amount: isCustomer ? -(Number(v.amount)||0) : -(Number(v.amount)||0)
  }));
  const transactions = regRows.concat(voucherRows).sort((a,b)=> a.date<b.date?-1:1);
  return {
    customerName: p.name, companyName: company.name || "الفردوس للنقل والتوريد",
    companyPhone: company.phone||"", balance, transactions, generatedAt: new Date().toISOString(), kind,
  };
}

function publishPartyPortal(kind, partyId){

async function checkPortalViewMode(){
  const params = new URLSearchParams(location.search);
  const token = params.get("portal");
  if(!token) return false;
  const view = byId("portalView");
  view.style.display = "block";
  view.innerHTML = '<div style="max-width:520px; margin:60px auto; font-family:Tahoma,Arial,sans-serif; text-align:center; color:#64748b;">⏳ جاري تحميل كشف الحساب...</div>';

  let data = null;
  try{
    let localMatch = DB.customers.find(c=>c.portalToken===token);
    let localKind = "customers";
    if(!localMatch){ localMatch = DB.suppliers.find(s=>s.portalToken===token); localKind = "suppliers"; }
    if(localMatch) data = getPortalDataForParty(localKind, localMatch.id);
  }catch(e){ /* تجاهل */ }

  if(!data){
    const apiB64 = params.get("api");
    if(apiB64){
      try{
        const backendUrl = decodeURIComponent(escape(atob(apiB64)));
        const res = await fetch(backendUrl.replace(/\/+$/,"") + "/api/portal/" + encodeURIComponent(token));
        if(res.ok) data = await res.json();
      }catch(e){ /* سيظهر رسالة الخطأ أدناه إذا فشل كل شيء */ }
    }
  }

  if(!data){
    view.innerHTML = '<div style="max-width:520px; margin:60px auto; font-family:Tahoma,Arial,sans-serif; text-align:center; color:#e11d48; padding:20px;">⚠️ تعذر العثور على بيانات كشف الحساب. تأكد من صحة الرابط، أو تواصل مع الجهة المُرسِلة لتحديثه.</div>';
    return true;
  }
  view.innerHTML = buildPortalBodyHtml(data);
  return true;
}

/* ======================================================================
   تنبيه بالفواتير غير المُحصَّلة التي تقترب من مدة التقادم القانوني
   ملاحظة مهمة: المدة الافتراضية هنا (60 شهرًا) رقم عام قابل للتعديل وليس
   استشارة قانونية — يختلف الأمر حسب نوع الدين والعقد، فيُرجى مراجعة
   محاسب قانوني أو محامٍ لتحديد المدة الدقيقة المناسبة لمنشأتك، وتعديل
   الرقم أدناه بناءً على ذلك.
   ====================================================================== */
function debtPrescriptionSettings(){
  return {
    months: Number(DB.debtPrescriptionMonths) || 60,
    warnMonths: Number(DB.debtPrescriptionWarningMonths) || 3,
  };
}
function monthsBetweenDates(d1, d2){
  return daysBetween(d1, d2) / 30.44;
}
function invoicesNearPrescription(){
  const settings = debtPrescriptionSettings();
  const rows = customerAgingRows();
  return rows.filter(r=>r.oldestUnpaidDate).map(r=>{
    const monthsElapsed = monthsBetweenDates(r.oldestUnpaidDate, todayISO());
    const monthsRemaining = settings.months - monthsElapsed;
    return Object.assign({}, r, { monthsElapsed, monthsRemaining, expired: monthsRemaining<=0, nearingExpiry: monthsRemaining>0 && monthsRemaining<=settings.warnMonths });
  }).filter(r=>r.expired || r.nearingExpiry);
}
function renderDebtPrescriptionPanel(){
  const settings = debtPrescriptionSettings();
  const editable = canEditTab("backup");
  let html = '<div class="form-panel">';

    risky.forEach(r=>{

    });

    html += '<div style="font-size:12px; color:var(--stone-500); margin-top:10px;">لا توجد حاليًا فواتير تقترب من مدة التقادم المحددة.</div>';

  html += '</div>';

function isVoiceSearchSupported(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}
function startVoiceSearch(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  const btn = byId("voice-search-btn");
  let recognition;
  try{ recognition = new SR(); }catch(e){ return; }
  recognition.lang = "ar-EG";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  if(btn){ btn.textContent = "🔴"; btn.disabled = true; }
  recognition.onresult = function(event){
    const text = event.results[0][0].transcript;
    const inp = byId("global-search-input");
    if(inp){ inp.value = text; onGlobalSearchInput(text); }
  };
  recognition.onerror = function(){ if(btn){ btn.textContent="🎤"; btn.disabled=false; } };
  recognition.onend = function(){ if(btn){ btn.textContent="🎤"; btn.disabled=false; } };
  try{ recognition.start(); }catch(e){ if(btn){ btn.textContent="🎤"; btn.disabled=false; } }
}

/* ======================================================================
   اختصارات لوحة المفاتيح
   Ctrl/Cmd + K  → فتح البحث الشامل
   Ctrl/Cmd + Enter → حفظ الفورم المفتوح حاليًا (لو فيه زر حفظ ظاهر)
   Escape → إغلاق البحث الشامل أو إلغاء الفورم المفتوح
   ====================================================================== */
document.addEventListener("keydown", function(event){
  const ctrlOrCmd = event.ctrlKey || event.metaKey;
  if(ctrlOrCmd && (event.key==="k" || event.key==="K")){
    event.preventDefault();
    openGlobalSearch();
    return;
  }
  if(ctrlOrCmd && event.key==="Enter"){
    const searchVisible = byId("searchOverlay") && byId("searchOverlay").style.display==="flex";
    if(searchVisible) return;
    const panel = document.querySelector(".form-panel");
    if(panel){
      const saveBtn = panel.querySelector(".btn-primary");
      if(saveBtn){ event.preventDefault(); saveBtn.click(); }
    }
    return;
  }
  if(event.key==="Escape"){
    const searchOverlay = byId("searchOverlay");
    if(searchOverlay && searchOverlay.style.display==="flex"){ closeGlobalSearch(); return; }
    const activeTag = document.activeElement ? document.activeElement.tagName : "";
    if(activeTag==="INPUT" || activeTag==="TEXTAREA" || activeTag==="SELECT") return; /* لا تلغِ الفورم أثناء الكتابة العادية */
    const panel = document.querySelector(".form-panel");
    if(panel){
      const cancelBtn = Array.from(panel.querySelectorAll(".btn-ghost")).find(b=> b.textContent.indexOf("إلغاء")!==-1 || b.textContent.indexOf("إغلاق")!==-1);
      if(cancelBtn) cancelBtn.click();
    }
  }
});

function customersWithDroppedActivity(){
  const today = todayISO();
  const recentStart = addDays(today, -60);
  const priorStart = addDays(today, -150);
  return DB.customers.map(c=>{
    const sales = DB.sales.filter(s=>s.customerId===c.id);
    const recentCount = sales.filter(s=>s.date>=recentStart && s.date<=today).length;
    const priorCount = sales.filter(s=>s.date>=priorStart && s.date<recentStart).length;
    const lastSaleDate = sales.reduce((max,s)=> (!max||s.date>max)?s.date:max, null);
    return {customer:c, recentCount, priorCount, lastSaleDate};
  }).filter(r=> r.priorCount>=2 && r.recentCount===0);
}

/* ======================================================================
   مقارنة سنة بسنة شهريًا (إيراد/مصروف/ربح لكل شهر مقابل نفس الشهر بالسنة السابقة)
   ====================================================================== */
function lastDayOfMonth(year, month){ /* month: 1-12 */
  return new Date(year, month, 0).toISOString().slice(0,10);
}
function yearlyMonthlyComparison(year){
  const monthNames = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  const rows = [];
  for(let m=1;m<=12;m++){
    const mm = String(m).padStart(2,"0");
    const curFrom = year+"-"+mm+"-01", curTo = lastDayOfMonth(year, m);
    const prevFrom = (year-1)+"-"+mm+"-01", prevTo = lastDayOfMonth(year-1, m);
    const cur = incomeStatementForRange(curFrom, curTo);
    const prev = incomeStatementForRange(prevFrom, prevTo);
    rows.push({
      month: monthNames[m-1],
      curRevenue: cur.totalRevenue, curExpense: cur.totalExpense, curProfit: cur.netIncome,
      prevRevenue: prev.totalRevenue, prevExpense: prev.totalExpense, prevProfit: prev.netIncome,
    });
  }
  return rows;
}
function renderYearlyComparison(){
  ui.yearlyCompareYear = ui.yearlyCompareYear || Number(todayISO().slice(0,4));
  const year = ui.yearlyCompareYear;
  const rows = yearlyMonthlyComparison(year);
  const totals = rows.reduce((acc,r)=>{
    acc.curRevenue+=r.curRevenue; acc.curExpense+=r.curExpense; acc.curProfit+=r.curProfit;
    acc.prevRevenue+=r.prevRevenue; acc.prevExpense+=r.prevExpense; acc.prevProfit+=r.prevProfit;
    return acc;
  }, {curRevenue:0,curExpense:0,curProfit:0,prevRevenue:0,prevExpense:0,prevProfit:0});

  function pctBadge(cur, prev){
    const diff = cur-prev;
    const pct = Math.abs(prev)>0.001 ? Math.round((diff/Math.abs(prev))*100) : (Math.abs(cur)>0.001?100:0);
    return '<span style="font-size:10px; color:'+(diff>=0?"#059669":"#e11d48")+';">('+(diff>=0?"+":"")+pct+'%)</span>';
  }

  let html = '<div style="width:150px; margin-bottom:14px;"><label class="f-label">السنة</label><input class="f-input" type="number" value="'+year+'" onchange="ui.yearlyCompareYear=Number(this.value); render();"/></div>';
  html += '<div class="cards-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); margin-bottom:16px;">' +
    card("إجمالي الإيرادات "+year, money(totals.curRevenue), "سابقًا: "+money(totals.prevRevenue), "emerald") +
    card("إجمالي المصروفات "+year, money(totals.curExpense), "سابقًا: "+money(totals.prevExpense), "amber") +
    card("صافي الربح "+year, money(totals.curProfit), "سابقًا: "+money(totals.prevProfit), totals.curProfit>=totals.prevProfit?"teal":"rose") +
  '</div>';

  html += '<div class="table-wrap"><table><thead><tr><th>الشهر</th>' +
    '<th class="tleft">الإيرادات '+year+'</th><th class="tleft">الإيرادات '+(year-1)+'</th>' +
    '<th class="tleft">المصروفات '+year+'</th><th class="tleft">المصروفات '+(year-1)+'</th>' +
    '<th class="tleft">الربح '+year+'</th><th class="tleft">الربح '+(year-1)+'</th></tr></thead><tbody>';
  rows.forEach(r=>{
    html += '<tr><td style="font-weight:600;">'+r.month+'</td>' +
      '<td class="tleft num">'+money(r.curRevenue)+' '+pctBadge(r.curRevenue,r.prevRevenue)+'</td>' +
      '<td class="tleft num" style="color:var(--stone-400);">'+money(r.prevRevenue)+'</td>' +
      '<td class="tleft num">'+money(r.curExpense)+' '+pctBadge(r.curExpense,r.prevExpense)+'</td>' +
      '<td class="tleft num" style="color:var(--stone-400);">'+money(r.prevExpense)+'</td>' +
      '<td class="tleft num" style="font-weight:700; color:'+(r.curProfit>=0?"#059669":"#e11d48")+';">'+money(r.curProfit)+' '+pctBadge(r.curProfit,r.prevProfit)+'</td>' +
      '<td class="tleft num" style="color:var(--stone-400);">'+money(r.prevProfit)+'</td></tr>';
  });
  html += '</tbody></table></div>';
  return html;
}


/* ======================================================================
   تثبيت التطبيق على الجهاز (PWA) — التقاط حدث المتصفح لعرض زر تثبيت حقيقي
   ====================================================================== */
let deferredInstallPrompt = null;
let appIsInstalled = false;
window.addEventListener("beforeinstallprompt", function(event){
  event.preventDefault();
  deferredInstallPrompt = event;
  renderInstallStatusIfVisible();
});
window.addEventListener("appinstalled", function(){
  appIsInstalled = true;
  deferredInstallPrompt = null;
  renderInstallStatusIfVisible();
});
function isRunningAsInstalledApp(){
  return window.matchMedia && window.matchMedia("(display-mode: standalone)").matches
    || window.navigator.standalone === true; /* iOS Safari */
}
function isIOSDevice(){
  return /iphone|ipad|ipod/i.test(window.navigator.userAgent);
}
function renderInstallStatusIfVisible(){
  if(ui.tab==="backup"){
    const el = byId("install-app-box");
    if(el) el.outerHTML = renderInstallAppPanel();
  }
}
function triggerAppInstall(){
  if(!deferredInstallPrompt){
    alert("زر التثبيت التلقائي غير متاح حاليًا على هذا المتصفح. استخدم التعليمات اليدوية الظاهرة أدناه حسب جهازك.");
    return;
  }
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.then(function(){
    deferredInstallPrompt = null;
    renderInstallStatusIfVisible();
  });
}
function renderInstallAppPanel(){
  const installed = isRunningAsInstalledApp() || appIsInstalled;
  let html = '<div class="form-panel" id="install-app-box" style="margin-bottom:16px; background:#f0fdfa; border-color:#99f6e4;">';
  html += '<div style="font-weight:800; font-size:14px; margin-bottom:8px;">📲 تثبيت التطبيق على الجهاز</div>';
  if(installed){
    html += '<div style="font-size:12.5px; color:var(--emerald-700);">✅ التطبيق مُثبَّت بالفعل على هذا الجهاز ويعمل كتطبيق مستقل.</div>';
  }else if(deferredInstallPrompt){
    html += '<div style="font-size:12.5px; color:var(--stone-500); margin-bottom:10px;">تقدر تثبّت التطبيق على شاشتك الرئيسية ليشتغل زي أي تطبيق عادي (بأيقونته الخاصة، وبدون شريط عنوان المتصفح، ويفتح حتى بدون إنترنت).</div>' +
      '<button class="btn btn-primary" onclick="triggerAppInstall()">📲 تثبيت الآن</button>';
  }else if(isIOSDevice()){
    html += '<div style="font-size:12.5px; color:var(--stone-500); line-height:2;">' +
      'على آيفون/آيباد: اضغط زر <b>المشاركة</b> (Share) في متصفح Safari ↓ ثم اختر <b>"Add to Home Screen"</b> (إضافة إلى الشاشة الرئيسية).' +
    '</div>';
  }else{
    html += '<div style="font-size:12.5px; color:var(--stone-500); line-height:2;">' +
      'لو التطبيق مفتوح من رابط ويب (مش ملف محلي)، هيظهر زر التثبيت هنا تلقائيًا خلال لحظات. لو ما ظهرش: افتح قائمة المتصفح (⋮) وابحث عن خيار "تثبيت التطبيق" أو "Add to Home Screen".' +
    '</div>';
  }
  html += '</div>';
  return html;
}

(function(){
  function ssNorm(s){
    return String(s==null?"":s)
      .replace(/[\u064B-\u0652\u0670\u0640]/g, "") // تشكيل وتطويل
      .replace(/[إأآا]/g, "ا")
      .replace(/ى/g, "ي")
      .replace(/ة/g, "ه")
      .replace(/[ًٌٍَُِّْ]/g, "")
      .toLowerCase();
  }
  function ssEsc(s){
    return String(s==null?"":s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function ssBuild(select){
    if(!select || select.dataset.ssBound || select.multiple) return;
    select.dataset.ssBound = "1";

    var wrap = document.createElement("span");
    wrap.className = "ss-wrap";
    select.parentNode.insertBefore(wrap, select);
    wrap.appendChild(select);
    select.classList.add("ss-native");
    select.tabIndex = -1;

    var input = document.createElement("input");
    input.type = "text";
    input.className = "f-input ss-input";
    input.setAttribute("autocomplete", "off");
    input.setAttribute("placeholder", "اكتب للبحث…");
    if(select.disabled) input.disabled = true;
    wrap.appendChild(input);

    var caret = document.createElement("span");
    caret.className = "ss-caret";
    caret.textContent = "▾";
    wrap.appendChild(caret);

    var dropdown = document.createElement("div");
    dropdown.className = "ss-dropdown";
    wrap.appendChild(dropdown);

    var filtered = [];
    var activeIndex = -1;

    function label(){
      var opt = select.options[select.selectedIndex];
      return opt ? opt.text : "";
    }
    function syncFromSelect(){ input.value = label(); }

    function draw(query){
      var q = ssNorm(query);
      var all = Array.prototype.slice.call(select.options);
      filtered = q ? all.filter(function(o){ return ssNorm(o.text).indexOf(q) !== -1; }) : all;
      activeIndex = -1;
      for(var i=0;i<filtered.length;i++){ if(filtered[i].value === select.value){ activeIndex = i; break; } }
      if(!filtered.length){
        dropdown.innerHTML = '<div class="ss-empty">لا توجد نتائج مطابقة</div>';
      }else{
        dropdown.innerHTML = filtered.map(function(o,i){
          return '<div class="ss-option'+(o.disabled?" ss-disabled":"")+(i===activeIndex?" ss-active":"")+'" data-idx="'+i+'">'+ssEsc(o.text)+'</div>';
        }).join("");
      }
      dropdown.classList.add("ss-show");
      input.classList.add("ss-open");
    }
    function close(){
      dropdown.classList.remove("ss-show");
      input.classList.remove("ss-open");
      syncFromSelect();
    }
    function choose(opt){
      if(!opt || opt.disabled) return;
      var changed = select.value !== opt.value;
      select.value = opt.value;
      if(changed) select.dispatchEvent(new Event("change", {bubbles:true}));
      syncFromSelect();
      close();
    }
    function paintActive(){
      var kids = dropdown.children;
      for(var i=0;i<kids.length;i++) kids[i].classList.toggle("ss-active", i===activeIndex);
      var el = kids[activeIndex];
      if(el && el.scrollIntoView) el.scrollIntoView({block:"nearest"});
    }

    input.addEventListener("focus", function(){ input.select(); draw(""); });
    input.addEventListener("click", function(){ if(!dropdown.classList.contains("ss-show")) draw(""); });
    input.addEventListener("input", function(){ draw(input.value); });
    input.addEventListener("keydown", function(e){
      if(!dropdown.classList.contains("ss-show") && (e.key==="ArrowDown"||e.key==="ArrowUp")){ draw(""); }
      if(e.key==="ArrowDown"){ e.preventDefault(); activeIndex = Math.min(activeIndex+1, filtered.length-1); paintActive(); }
      else if(e.key==="ArrowUp"){ e.preventDefault(); activeIndex = Math.max(activeIndex-1, 0); paintActive(); }
      else if(e.key==="Enter"){ e.preventDefault(); if(filtered[activeIndex]) choose(filtered[activeIndex]); }
      else if(e.key==="Escape"){ close(); input.blur(); }
      else if(e.key==="Tab"){ close(); }
    });
    input.addEventListener("blur", function(){ setTimeout(close, 150); });
    dropdown.addEventListener("mousedown", function(e){
      e.preventDefault();
      var optEl = e.target.closest ? e.target.closest(".ss-option") : null;
      if(!optEl) return;
      choose(filtered[Number(optEl.dataset.idx)]);
    });

    syncFromSelect();
  }
  function ssEnhanceAll(root){
    var list = (root||document).querySelectorAll("select.f-input:not([data-ss-bound])");
    for(var i=0;i<list.length;i++) ssBuild(list[i]);
  }
  window.refreshSearchableSelect = function(id){
    var sel = document.getElementById(id);
    if(!sel || !sel.dataset.ssBound) return;
    var input = sel.parentNode && sel.parentNode.querySelector(".ss-input");
    if(input){ var opt = sel.options[sel.selectedIndex]; input.value = opt ? opt.text : ""; }
  };
  var ssObserver = new MutationObserver(function(muts){
    for(var i=0;i<muts.length;i++){
      if(muts[i].addedNodes && muts[i].addedNodes.length){ ssEnhanceAll(document); return; }
    }
  });
  document.addEventListener("DOMContentLoaded", function(){
    ssObserver.observe(document.body, {childList:true, subtree:true});
    ssEnhanceAll(document);
  });

})();

document.addEventListener("DOMContentLoaded", async function(){
  document.documentElement.setAttribute("dir", getLang()==="en" ? "ltr" : "rtl");
  document.documentElement.setAttribute("lang", getLang());
  if(localStorage.getItem(DARK_MODE_KEY)==="1") document.documentElement.classList.add("dark");
  applyZoomPreference();
  const isPortalView = await checkPortalViewMode();
  if(isPortalView) return; /* وضع بوابة العميل: لا داعي لتسجيل الدخول أو تحميل بقية التطبيق */
  await seedDefaultUsersIfNeeded();
  migrateAccountCodes();
  seedMissingDefaultAccounts();
  syncAllPartyAccounts();
  refreshAllRegisterEntryLabels();
  recomputeCOGS(); saveDB();
  if(session && session.userId && currentUser()){
    showApp();
  }else{
    showAuthScreen("login");
  }
  saveDB(); // لعرض رسالة "تم الحفظ" الأولية وضمان إنشاء المفتاح في التخزين
  try{ startSync(); }catch(e){ /* المزامنة اختيارية ولا يجب أن توقف التطبيق */ }
  if(session && session.userId && currentUser()){
    try{ setTimeout(checkAutoEmailBackup, 4000); }catch(e){ /* الإرسال التلقائي اختياري ولا يجب أن يوقف التطبيق */ }
  }
});
